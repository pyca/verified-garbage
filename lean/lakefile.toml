# Untrusted certificate generation runs natively; proofs check its output.
[[lean_lib]]
name = "NativeForward"
# Writes the audit records of each module (`NativeAuditRecords`).
plugins = ["NativeAuditRecords:shared"]
roots = []
globs = ["VerifiedGarbage.Proof.Weierstrass.AArch64.Forward.Data"]
precompileModules = true

# Opt-in hint search; the original taint checker still validates every hint.
[[lean_lib]]
name = "NativeHintSearch"
# Writes the audit records of each module (`NativeAuditRecords`).
plugins = ["NativeAuditRecords:shared"]
roots = []
globs = ["VerifiedGarbage.Proof.Framework.RegSet", "VerifiedGarbage.Proof.Framework.Slots", "VerifiedGarbage.Proof.Framework.NativeHintOps", "VerifiedGarbage.Proof.Framework.X86.NativeHintData", "VerifiedGarbage.Proof.Framework.Arm.NativeHintData"]
precompileModules = true

# The check of `VerifiedGarbage/TCB/AuditBase.lean`, which `ci/audit_base.py`
# generates: what Lean and this project's dependencies depend on, from their
# private data. Not a module, to see every proof; it imports only Lean and the
# dependencies, so Lake rebuilds it only when they (or the list) change.
[[lean_lib]]
name = "AuditBase"
roots = ["VerifiedGarbageAuditBase"]
allowNonModules = true
