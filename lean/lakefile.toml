name = "VerifiedGarbage"
# Resolve the compiled libraries before the broad library glob. Otherwise
# Lake can first assign one of these modules to VerifiedGarbage, then try to
# load a native library (which includes that same module) while compiling it.
defaultTargets = ["NativeSpec", "NativeForward", "NativeHintSearch", "VerifiedGarbage", "VerifiedGarbageTest"]
# Lake already checks several files concurrently. Limit each compiler to
# two threads so declaration tasks do not contend across all of those files.
#
# With `profiler`, every step over `profiler.threshold` (1 ms) reports its
# time, as a message at its declaration, which Lake keeps in the module's
# `.trace` and the CI build cache ships: `ci/lean_profile.py` reads them to
# rank the declarations the build spends the most on, with no profiling run.
# It does not change what is built (measured byte-identical), costs about
# 1-2% of the build, and adds about 8 MiB to the compressed cache. Lake
# replays a module's messages whenever it finds it up to date: build with
# `--log-level=warning` (or `-q`) to leave them out of the output. A module
# with `#guard_msgs` turns it off (`ci/check_lean_speed.py`). Here, not in
# `leanOptions`, whose TOML cannot set both `profiler` and
# `profiler.threshold`.
moreLeanArgs = ["-j2", "-Dprofiler=true", "-Dprofiler.threshold=1"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
warningAsError = true
# Mathlib's own linters (its tactic-analysis refactoring suggestions and its
# style conventions), which are on by default in every module that imports
# Mathlib, walk the syntax or info trees of every command in the interpreter:
# 5-8% of the build. The checks of Lean core stay on. `weak.` since only
# modules importing Mathlib know the options.
weak.linter.tacticAnalysis.rwaSuggestion = false
weak.linter.tacticAnalysis.introMerge = false
weak.linter.unusedTactic = false
weak.linter.globalAttributeIn = false
weak.linter.dupNamespace = false
weak.linter.style.nameCheck = false
weak.linter.auxLemma = false
weak.linter.internalConstructors = false
weak.linter.style.haveILetI = false
weak.linter.directoryDependency = false
weak.linter.overlappingInstances = false
weak.linter.style.docString.empty = false
weak.linter.adaptationNote = false
weak.linter.setNotationForOrder = false
weak.linter.fast_instance_existing = false
weak.linter.trailingWhitespace = false
weak.linter.unicodeLinter = false
weak.linter.whitespaceBeforeSemicolon = false
# Batteries' `unreachableTactic` and `unnecessarySeqFocus` linters, on in
# every module that imports them (through Mathlib), also run in the
# interpreter: summed over the CI build cache's `.trace` files, about 200 s of
# the build (122 s and 80 s, some 13,000 runs), 3% of
# `Proof.ChaCha20Poly1305.X86_64.CT`.
weak.linter.unreachableTactic = false
weak.linter.unnecessarySeqFocus = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[lean_lib]]
name = "VerifiedGarbage"
# Build every file, not only those reachable from `Artifacts.lean`.
globs = ["VerifiedGarbage.*"]
# A module importing a module of a precompiled library below (`NativeTCB`,
# `NativeSpec`, `NativeTactics`) loads that whole library's shared library,
# and Lake would add the shared library to the module's trace: editing any
# module of the library (e.g. `TCB/AArch64/Isa.lean`) would rebuild every
# module that imports any other (every proof of every target). The shared
# library is compiled from its modules' `.olean`s, and a module runs only the
# code of what it imports, whose `.olean`s its trace already has: leave the
# shared library out of the trace (it is still loaded), so a module is
# rebuilt only when something it imports changes.
platformIndependent = true

[[lean_lib]]
name = "VerifiedGarbageTest"
globs = ["VerifiedGarbageTest.+"]
# See `VerifiedGarbage`.
platformIndependent = true

# The known-answer tests (`VerifiedGarbageTest`) evaluate the specifications,
# which is an order of magnitude faster in compiled code than in the
# interpreter (ML-KEM-768: 20 s to 1 s): these modules are compiled to shared
# libraries, which the modules importing them load. It is declared last, so
# that it, and not `VerifiedGarbage`, is these modules' library.
[[lean_lib]]
name = "NativeSpec"
# Exactly these modules (as `globs`: `roots` would also take their submodules,
# such as `Spec.MlKem.Contract`, and with them the rest of the library).
roots = []
globs = ["VerifiedGarbage.Spec.Sha1", "VerifiedGarbage.Spec.Sha256",
  "VerifiedGarbage.Spec.Sha512", "VerifiedGarbage.Spec.Md5", "VerifiedGarbage.Spec.Sha3",
  "VerifiedGarbage.Spec.GcmSiv",
  "VerifiedGarbage.Spec.Hmac", "VerifiedGarbage.Spec.Pbkdf2", "VerifiedGarbage.Spec.Scrypt",
  "VerifiedGarbage.Spec.ChaCha20", "VerifiedGarbage.Spec.Poly1305", "VerifiedGarbage.Spec.Aes",
  "VerifiedGarbage.Spec.Ccm",
  "VerifiedGarbage.Spec.Gcm", "VerifiedGarbage.Spec.MlKem", "VerifiedGarbage.Spec.X25519",
  "VerifiedGarbage.Spec.MlDsa", "VerifiedGarbage.Spec.Ed25519", "VerifiedGarbage.Spec.Blake2",
  "VerifiedGarbage.Spec.Siv",
  "VerifiedGarbage.Spec.X448", "VerifiedGarbage.Spec.Rc2", "VerifiedGarbage.Spec.TripleDes",
  "VerifiedGarbage.Spec.Blowfish",
  "VerifiedGarbage.Spec.Idea",
  "VerifiedGarbage.Spec.Cast5",
  "VerifiedGarbage.Spec.Argon2", "VerifiedGarbage.Spec.Rc4", "VerifiedGarbage.Spec.Camellia",
  "VerifiedGarbage.Spec.Ocb", "VerifiedGarbage.Spec.Seed", "VerifiedGarbage.Spec.Sm4",
  "VerifiedGarbage.Spec.Cmac", "VerifiedGarbage.Spec.Weierstrass", "VerifiedGarbage.Spec.P256",
  "VerifiedGarbage.Spec.P384", "VerifiedGarbage.Spec.P521",
  "VerifiedGarbage.Spec.Ecdsa", "VerifiedGarbage.Spec.Dsa", "VerifiedGarbage.Spec.EcKey",
  "VerifiedGarbage.Spec.Ecdh", "VerifiedGarbage.Spec.Ecdsa.Rfc6979", "VerifiedGarbage.Spec.Ecdsa.Verify",
  "VerifiedGarbage.Spec.Rsa", "VerifiedGarbage.Spec.RsaKeyGen", "VerifiedGarbage.Spec.Ed448",
  "VerifiedGarbage.Spec.RsaPkcs1Enc", "VerifiedGarbage.Spec.Mgf1", "VerifiedGarbage.Spec.RsaPss",
  "VerifiedGarbage.Spec.RsaOaep"]
precompileModules = true

# The project's tactics, which run in most modules: the evaluator of
# `sig_eval` (`Proof/Framework/SigEval.lean`), run on every contract, the
# literal tactics (`materialize_code`, `rw_lit`, `Lit.lean`), run by every
# `taint_decide` and `lit_decide`, the `omega` helpers, and the elaborator of
# the comb tables (`nat_pairs%`, `Impl/NatPairs.lean`): compiled to a shared
# library like `NativeSpec`, since the interpreter runs them an order of
# magnitude slower. They import only Lean core and `NativeTCB`
# (`ci/check_lean_speed.py` checks that every such module is here).
[[lean_lib]]
name = "NativeTactics"
roots = []
globs = ["VerifiedGarbage.Proof.Framework.SigEval", "VerifiedGarbage.Proof.Framework.Lit",
  "VerifiedGarbage.Proof.Framework.LitShare",
  "VerifiedGarbage.Proof.Framework.Omega", "VerifiedGarbage.Proof.Framework.OmegaLit",
  "VerifiedGarbage.Proof.Framework.KernelRfl", "VerifiedGarbage.Proof.Framework.Sig",
  "VerifiedGarbage.Proof.MlDsa.DecideAt", "VerifiedGarbage.Impl.NatPairs",
  "VerifiedGarbage.Impl.AArch64Instrs"]
precompileModules = true

# The trusted base, which imports only Lean core: the code the emitter
# (`Emit.lean`, which loads this library) runs to check and print every
# artifact, an order of magnitude faster compiled than in the interpreter
# (52 s to 7 s). `TCB.Mem` is here and not in `NativeSpec`, which imports it.
[[lean_lib]]
name = "NativeTCB"
roots = []
globs = ["VerifiedGarbage.TCB.+"]
precompileModules = true

# Untrusted certificate generation runs natively; proofs check its output.
[[lean_lib]]
name = "NativeForward"
roots = []
globs = ["VerifiedGarbage.Proof.Weierstrass.AArch64.Forward.Data"]
precompileModules = true

# Opt-in hint search; the original taint checker still validates every hint.
[[lean_lib]]
name = "NativeHintSearch"
roots = []
globs = ["VerifiedGarbage.Proof.Framework.RegSet", "VerifiedGarbage.Proof.Framework.NativeHintOps", "VerifiedGarbage.Proof.Framework.X86.NativeHintData"]
precompileModules = true
