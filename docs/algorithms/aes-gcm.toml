name = "AES-GCM (128-, 192- and 256-bit keys)"
family = "AEADs"
specs = ["Aes", "Gcm"]
modules = ["src/aes_gcm.rs"]
asm = ["aes", "gcm"]
optimized = { x86_64 = "GHASH with `mul`; 16 blocks at a time with VAES, 8 with VPCLMULQDQ; counter mode and GHASH interleaved, in 128-bit (AES-NI, PCLMULQDQ, AVX), 256- or 512-bit registers" }
