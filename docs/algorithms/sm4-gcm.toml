name = "SM4-GCM"
family = "AEADs"
specs = ["Sm4", "Gcm", "Sm4/Gcm", "Sm4/Gcm/Contract"]
modules = ["src/sm4_gcm.rs"]
# Not `gcm`, AES-GCM's module, whose AES-NI and VAES functions SM4-GCM does
# not call: it calls only `vg_ghash` and its variants, named below.
asm = ["sm4", "sm4_gcm"]
optimized = { x86_64 = "GHASH one block at a time with PCLMULQDQ, eight with VPCLMULQDQ", aarch64 = "GHASH with PMULL" }
