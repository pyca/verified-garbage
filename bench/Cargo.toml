[package]
name = "verified-garbage-bench"
version = "0.0.0"
edition = "2024"
description = "Benchmarks of verified-garbage, against OpenSSL (through rust-openssl) and aws-lc-rs"
license = "Apache-2.0 OR BSD-3-Clause"
publish = false

# A package of its own, outside the library's, so that the library's tests,
# lints and coverage never build criterion or link OpenSSL or AWS-LC.
[workspace]

[dependencies]
# `VG_CPU_FEATURES` chooses the implementations benchmarked (see
# `src/cpu.rs` and `ci/bench_arches.py`).
verified-garbage = { path = "..", features = ["cpu-features-env"] }

# Low-level KEM calls are not yet wrapped by rust-openssl.
openssl-sys = { version = "0.9.117", optional = true }
foreign-types = { version = "0.3", optional = true }

[features]
# OpenSSL 3.2+ supplies Argon2; the benchmark runners use 3.0.
# On a supported host, use `cargo bench --features openssl-argon2` and
# `cargo test --features openssl-argon2 --test argon2` for the comparison.
openssl-argon2 = []
# OpenSSL 3.5+ supplies ML-DSA; enable its benchmark comparisons on a supported host.
openssl-mldsa = []
# OpenSSL 3.5+ supplies ML-KEM.
openssl-mlkem = ["dep:openssl-sys", "dep:foreign-types"]

[dev-dependencies]
# AWS-LC, built from source by aws-lc-sys (with only a C compiler, on every
# architecture benchmarked).
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
openssl = "0.10"

[[bench]]
name = "primitives"
harness = false
