[package]
name = "verified-garbage-asm"
version = "0.0.0"
edition = "2024"
# Naked functions (`#[unsafe(naked)]`, `naked_asm!`) were stabilized in 1.88.
rust-version = "1.88"
description = "The formally verified assembly of verified-garbage, generated from Lean"
license = "Apache-2.0 OR BSD-3-Clause"
repository = "https://github.com/alex/verified-garbage"
publish = false
# Every file under `src/` is generated by `lean/Emit.lean`: no build script.
build = false
