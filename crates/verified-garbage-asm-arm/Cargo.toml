# The verified functions for `arm`, generated from Lean into `src/`
# (see `lean/VerifiedGarbage/TCB/Rust.lean`): a crate of its own, so that
# compiling the library does not compile them again with it.
[package]
name = "verified-garbage-asm-arm"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "The formally verified assembly of verified-garbage for arm"
license = "Apache-2.0 OR BSD-3-Clause"
repository = "https://github.com/pyca/verified-garbage"
publish = false
build = false

[dependencies]
verified-garbage-cpu = { path = "../verified-garbage-cpu" }
