# The verified functions for `aarch64`, generated from Lean into `src/`
# (see `lean/VerifiedGarbage/TCB/Rust.lean`): a crate of its own, so that
# compiling the library does not compile them again with it.
[package]
name = "verified-garbage-asm-aarch64"
description = "The formally verified assembly of verified-garbage for aarch64"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = false

# Stated, though it is the default, so that the manifest is valid where
# only it is checked out (CI's jobs of the other targets), as Cargo reads it
# for every path dependency, built or not.
[lib]
path = "src/lib.rs"

[dependencies]
verified-garbage-cpu = { path = "../verified-garbage-cpu" }
