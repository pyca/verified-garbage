# The verified functions for `x86_64`, generated from Lean into `asm/`
# (see `lean/VerifiedGarbage/TCB/Rust.lean`): a crate of its own, so that
# compiling the library does not compile them again with it.
[package]
name = "verified-garbage-asm-x86_64"
description = "The formally verified assembly of verified-garbage for x86_64"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = false

# The printed code, which the emitter writes to `asm/` (not Cargo's default
# `src/`).
[lib]
path = "asm/lib.rs"

[dependencies]
verified-garbage-cpu = { path = "../verified-garbage-cpu" }
