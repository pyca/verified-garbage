# The verified functions for `riscv64`, generated from Lean into `asm/`
# (see `lean/VerifiedGarbage/TCB/Rust.lean`): a crate of its own, so that
# compiling the library does not compile them again with it.
[package]
name = "verified-garbage-asm-riscv64"
description = "The formally verified assembly of verified-garbage for riscv64"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = false

# The code as the emitter writes it, to `asm/` (not Cargo's default `src/`),
# which already holds its machine code: RISC-V's printer emits each
# instruction's encoding (`lean/VerifiedGarbage/TCB/RISCV64/Encode.lean`).
[lib]
path = "asm/lib.rs"

[dependencies]
verified-garbage-cpu = { path = "../verified-garbage-cpu" }
