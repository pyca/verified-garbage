<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benchmark results</title>
<!--
  The page of ci/bench_report.py: charts benchmark results files (that
  script's format), which it has built in (the `bench-data` element) or
  which are loaded into it. Everything is in this file, with no network
  access, so that a workflow's copy opens anywhere.

  It charts a few comparisons (`COMPARISONS`: the libraries; head against
  base; the CPU feature configurations), each as throughput relative to a
  baseline, over a few groupings of the benchmarks (`TOPICS`): each groups
  its benchmarks (by curve, key size, algorithm) and has a bar for each of
  some operations or message sizes within each group. A benchmark that no
  grouping takes is still in the table of all results at the bottom.
-->
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f1f0ec;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e8e7e1;
  --grid-strong: #c3c2b7;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --hover: rgba(11, 11, 11, 0.04);
  --accent: #2a78d6;
  --warn-ink: #7a5200;
  --s-base: #a09f99;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #262624;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2a2a28;
    --grid-strong: #45453f;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --hover: rgba(255, 255, 255, 0.05);
    --accent: #3987e5;
    --warn-ink: #f3d68f;
    --s-base: #63625e;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #262624;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2a2a28;
  --grid-strong: #45453f;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --hover: rgba(255, 255, 255, 0.05);
  --accent: #3987e5;
  --warn-ink: #f3d68f;
  --s-base: #63625e;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
button, select, input { font: inherit; color: inherit; }
button {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 10px;
  cursor: pointer;
}
button:hover { background: var(--surface-2); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
select, input[type="search"] {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 6px;
}
a { color: var(--accent); }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }

header { padding: 18px 0 6px; }
header .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
header h1 { font-size: 20px; font-weight: 600; margin: 0; }
header .run { color: var(--ink-2); }
header .tools { margin-left: auto; display: flex; gap: 6px; }
header .tools button { font-size: 13px; padding: 3px 9px; color: var(--ink-2); }
#file { display: none; }

nav.compare { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 4px; }
nav.compare button { border-radius: 999px; padding: 5px 14px; }
nav.compare button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
nav.compare .desc { align-self: center; color: var(--muted); font-size: 13px; margin-left: 6px; }

nav.topics {
  display: flex;
  gap: 2px;
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
  margin: 12px 0;
  scrollbar-width: thin;
}
nav.topics button {
  border: 0;
  border-bottom: 2px solid transparent;
  border-radius: 0;
  background: none;
  padding: 8px 12px 7px;
  white-space: nowrap;
  color: var(--ink-2);
}
nav.topics button:hover { color: var(--ink); background: none; }
nav.topics button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }

.filters { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 12px; align-items: baseline; }
.filters .label { color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip {
  border-radius: 999px;
  padding: 2px 11px;
  font-size: 13px;
  color: var(--muted);
  border: 1px dashed var(--axis);
  background: none;
}
.chip[aria-pressed="true"] { color: var(--ink); border: 1px solid var(--ink-2); background: var(--surface); }
.chips .reset { border: 0; background: none; color: var(--accent); font-size: 13px; padding: 2px 4px; }
.chips select { font-size: 13px; }
.note { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
.note:empty { display: none; }

#cards { display: flex; flex-direction: column; gap: 16px; margin: 18px 0 24px; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 18px 12px;
  min-width: 0;
}
.card-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
.card-head h2 { font-size: 17px; font-weight: 600; margin: 0; }
.card-head .cpu { color: var(--muted); font-size: 13px; }
.card-head .cpu.warn { color: var(--warn-ink); }
.card-head .numbers { margin-left: auto; font-size: 13px; padding: 2px 9px; color: var(--ink-2); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 12px 0 2px; color: var(--ink); }
.legend .item { display: inline-flex; align-items: center; gap: 7px; }
.legend .swatch { width: 12px; height: 12px; border-radius: 3px; }
.axis-title { color: var(--ink-2); font-size: 13px; margin-top: 6px; }
.chart { overflow-x: auto; }
.chart svg { display: block; }
.chart svg text { fill: var(--ink-2); font-size: 12px; }
.chart svg text.tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart svg text.inner { fill: var(--ink-2); font-size: 12px; }
.chart svg text.outer { fill: var(--ink); font-size: 14px; font-weight: 600; }
.chart svg text.value { fill: var(--ink-2); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart svg text.value.subject { fill: var(--ink); font-weight: 650; }
.chart svg text.missing { fill: var(--muted); font-size: 11px; }
.chart svg .grid { stroke: var(--grid); stroke-width: 1; }
.chart svg .grid.one { stroke: var(--grid-strong); }
.chart svg .axis { stroke: var(--axis); stroke-width: 1; }
.chart svg .bracket { stroke: var(--axis); stroke-width: 1; fill: none; }
.chart svg .wash { fill: var(--hover); }
.chart svg .hit { fill: transparent; }
.empty-card { color: var(--ink-2); padding: 24px 4px; }

table.data { border-collapse: collapse; width: 100%; margin-top: 12px; font-size: 13px; font-variant-numeric: tabular-nums; }
table.data th, table.data td { padding: 4px 10px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
table.data th:first-child, table.data td:first-child { text-align: left; white-space: normal; }
table.data th { color: var(--ink-2); font-weight: 600; background: var(--surface); position: sticky; top: 0; }
table.data td .rel { color: var(--muted); margin-left: 6px; }
table.data td.left { text-align: left; }
.table-tools { display: flex; justify-content: flex-end; margin-top: 8px; }
.table-tools button { font-size: 12px; padding: 2px 8px; }
.table-wrap { overflow: auto; max-height: 70vh; }

details.all { margin: 8px 0 40px; color: var(--ink-2); }
details.all summary { cursor: pointer; padding: 6px 0; }
details.all .search { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
details.all input { flex: 1; max-width: 420px; }

.welcome {
  max-width: 620px;
  margin: 60px auto;
  padding: 28px;
  text-align: center;
  color: var(--ink-2);
  border: 1px dashed var(--axis);
  border-radius: 12px;
  background: var(--surface);
}
.welcome h2 { color: var(--ink); font-size: 18px; margin: 0 0 8px; }
code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }

#tooltip {
  position: fixed;
  z-index: 20;
  pointer-events: none;
  display: none;
  max-width: min(380px, calc(100vw - 16px));
  padding: 9px 11px;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.16);
  font-size: 13px;
}
#tooltip .title { font-weight: 600; margin-bottom: 5px; }
#tooltip .row { display: grid; grid-template-columns: 14px auto 1fr auto; gap: 8px; align-items: baseline; }
#tooltip .row .k { width: 12px; height: 3px; border-radius: 2px; transform: translateY(-3px); }
#tooltip .row b { font-variant-numeric: tabular-nums; }
#tooltip .row .name { color: var(--ink-2); }
#tooltip .row .t { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
#tooltip .foot { color: var(--muted); margin-top: 6px; font-size: 12px; overflow-wrap: anywhere; }
#drop {
  position: fixed; inset: 0; z-index: 30; display: none;
  align-items: center; justify-content: center;
  background: rgba(0, 0, 0, 0.4); color: #ffffff; font-size: 18px;
}
#drop.show { display: flex; }
#errors { color: var(--warn-ink); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1>Benchmarks</h1>
      <span class="run" id="run"></span>
      <div class="tools">
        <button id="load" type="button" title="Add results files (.json) or other reports (.html)">Load results…</button>
        <button id="theme" type="button">Theme: auto</button>
      </div>
    </div>
    <input id="file" type="file" multiple accept=".json,.html,application/json,text/html">
    <div id="errors"></div>
  </header>
  <nav class="compare" id="compare" aria-label="Comparison"></nav>
  <nav class="topics" id="topics" role="tablist" aria-label="Algorithms"></nav>
  <div class="filters" id="filters"></div>
  <p class="note" id="note"></p>
  <div id="cards"></div>
  <details class="all" id="all"></details>
</div>
<div id="tooltip" role="tooltip"></div>
<div id="drop">Drop results files to add them</div>
<noscript><p style="padding:16px">This page needs JavaScript to chart the results.</p></noscript>
<script type="application/json" id="bench-data">null</script>
<script>
"use strict";

// ------------------------------------------------------------------ the data

const FORMAT = "verified-garbage-bench";
const VG = "verified-garbage";
const LIBRARIES = { openssl: "OpenSSL", "aws-lc-rs": "AWS-LC", [VG]: "VG" };
const ARCHES = ["x86_64", "aarch64", "aarch64-apple", "x86", "arm", "thumb", "powerpc64", "riscv64"];
const collator = new Intl.Collator("en", { numeric: true });

let files = [];     // results files: {id, name, context, results}
let records = [];   // {arch, cpu, cfg, side, library, group, size, sizeText, t}
let loadErrors = [];

function addDocument(doc, name) {
  if (Array.isArray(doc)) return doc.forEach(d => addDocument(d, name));
  if (doc && Array.isArray(doc.files)) return doc.files.forEach(d => addDocument(d, (d && d.name) || name));
  if (!doc || doc.format !== FORMAT || !Array.isArray(doc.results)) throw new Error(`${name}: not a benchmark results file`);
  const id = doc.id || `${name}#${files.length}`;
  if (!files.some(f => f.id === id)) files.push({ id, name: doc.name || name, context: doc.context || {}, results: doc.results });
}

function rebuild() {
  records = [];
  for (const f of files) {
    const c = f.context;
    for (const r of f.results) {
      const t = Number(r.time_ns);
      if (!(t > 0)) continue;
      records.push({
        arch: String(c.arch ?? "unknown"),
        cpu: c.cpu ? String(c.cpu) : "",
        cfg: String(c.cpu_features ?? ""),
        side: r.side === "base" ? "base" : "head",
        library: String(r.library),
        group: String(r.group),
        size: Number(r.size),
        sizeText: String(r.size),
        t,
      });
    }
  }
}

// ------------------------------------------------------------- the groupings

// Sizes of the bulk algorithms' benchmarks: each bar takes the benchmark's
// size nearest one of these (AES-GCM's TLS records are 63 bytes, not 64).
const BUCKETS = [[64, "64 B"], [1024, "1 KiB"], [16384, "16 KiB"]];
const SIZE_INNERS = BUCKETS.map(([b, label]) => [String(b), label, true]);
function nearestBucket(size) {
  let best = null;
  for (const [b] of BUCKETS) {
    const d = Math.abs(Math.log(size / b));
    if (d < Math.log(1.1) && (!best || d < best[1])) best = [String(b), d];
  }
  return best;
}
// A grouping of benchmarks that are each one of its outers, by name, at the
// sizes.
function bulk(outers) {
  const known = new Set(outers.map(o => o[0]));
  return (group, size) => {
    if (!known.has(group)) return null;
    const b = nearestBucket(size);
    return b ? [group, b[0], b[1]] : null;
  };
}
// RSA's and finite-field DH's sizes: the modulus' bytes.
const MODULUS = { 256: "2048", 384: "3072", 512: "4096" };

// Each grouping: its outer groups and inner bars, as [key, label, shown by
// default], and `match(group, size, sizeText)`: the [outer, inner] that a
// benchmark is (and how far its size is from the bar's, to take the
// nearest), or null.
const TOPICS = [
  {
    id: "ec", name: "Elliptic curves", outerName: "Curves", innerName: "Operations",
    note: "Signatures are of a 64-byte message, with the curve's usual hash (SHA-256 for P-256).",
    outers: [
      ["p256", "P-256", true], ["p384", "P-384", true], ["p521", "P-521", true],
      ["curve25519", "Curve25519", true], ["curve448", "Curve448", false], ["secp256k1", "secp256k1", false],
      ["p224", "P-224", false], ["p192", "P-192", false],
      ["brainpoolp256r1", "brainpoolP256r1", false], ["brainpoolp320r1", "brainpoolP320r1", false],
      ["brainpoolp384r1", "brainpoolP384r1", false], ["brainpoolp512r1", "brainpoolP512r1", false],
    ],
    inners: [
      ["ecdh", "ECDH", true], ["sign", "Sign", true], ["verify", "Verify", true],
      ["pubkey", "Public key", false], ["validate", "Validate key", false],
      ["compress", "Compress point", false], ["decompress", "Decompress point", false],
    ],
    match(g, size) {
      let m;
      if ((m = /^ecdh_([a-z0-9]+)$/.exec(g))) return [m[1], "ecdh"];
      if ((m = /^x(25519|448)$/.exec(g))) return ["curve" + m[1], "ecdh"];
      if ((m = /^x(25519|448)_public_key$/.exec(g))) return ["curve" + m[1], "pubkey"];
      if ((m = /^ed(25519|448)_(sign|verify)$/.exec(g))) return size === 64 ? ["curve" + m[1], m[2]] : null;
      if ((m = /^ed(25519|448)_keygen$/.exec(g))) return ["curve" + m[1], "pubkey"];
      if ((m = /^ecdsa_([a-z0-9]+)_(sha\d+)_(sign|verify)$/.exec(g))) {
        return size === 64 && !(m[1] === "p256" && m[2] !== "sha256") ? [m[1], m[3]] : null;
      }
      if ((m = /^ec_([a-z0-9]+)_public_key$/.exec(g))) return [m[1], "pubkey"];
      if ((m = /^ec_validate_([a-z0-9]+)$/.exec(g))) return [m[1], "validate"];
      if ((m = /^ec_([a-z0-9]+)_(compress|decompress)$/.exec(g))) return [m[1], m[2]];
      return null;
    },
  },
  {
    id: "rsa", name: "RSA", outerName: "Key sizes", innerName: "Operations",
    note: "PSS and OAEP with SHA-256.",
    outers: [["2048", "RSA-2048", true], ["3072", "RSA-3072", true], ["4096", "RSA-4096", true]],
    inners: [
      ["pkcs1_sign", "PKCS#1 sign", true], ["pkcs1_verify", "PKCS#1 verify", true],
      ["pss_sign", "PSS sign", false], ["pss_verify", "PSS verify", false],
      ["oaep_encrypt", "OAEP encrypt", true], ["oaep_decrypt", "OAEP decrypt", true],
      ["pkcs1_encrypt", "PKCS#1 encrypt", false], ["pkcs1_decrypt", "PKCS#1 decrypt", false],
      ["keygen", "Key generation", false], ["load", "Load private key", false],
    ],
    match(g, size) {
      const ops = {
        rsa_pkcs1_sign: "pkcs1_sign", rsa_pkcs1_verify: "pkcs1_verify",
        rsa_pss_sha256_mgf1_sha256_sign: "pss_sign", rsa_pss_sha256_mgf1_sha256_verify: "pss_verify",
        rsa_oaep_sha256_mgf1_sha256_encrypt: "oaep_encrypt", rsa_oaep_sha256_mgf1_sha256_decrypt: "oaep_decrypt",
        rsa_pkcs1_encrypt: "pkcs1_encrypt", rsa_pkcs1_decrypt: "pkcs1_decrypt",
        rsa_keygen_generate: "keygen", rsa_from_crt: "load",
      };
      return ops[g] && MODULUS[size] ? [MODULUS[size], ops[g]] : null;
    },
  },
  {
    id: "dh", name: "DH & DSA", outerName: "Groups", innerName: "Operations",
    outers: [
      ["ffdh2048", "FFDH-2048", true], ["ffdh3072", "FFDH-3072", true], ["ffdh4096", "FFDH-4096", false],
      ["dsa1024_160", "DSA-1024", false], ["dsa2048_224", "DSA-2048/224", false],
      ["dsa2048_256", "DSA-2048", true], ["dsa3072_256", "DSA-3072", true],
    ],
    inners: [["exchange", "Key exchange", true], ["keygen", "Key generation", true], ["sign", "Sign", true], ["verify", "Verify", true]],
    match(g, size) {
      let m;
      if (g === "ffdh_exchange" || g === "ffdh_generate") {
        return MODULUS[size] ? ["ffdh" + MODULUS[size], g === "ffdh_exchange" ? "exchange" : "keygen"] : null;
      }
      if ((m = /^dsa_(sign|verify|generate_key)_q(\d+)$/.exec(g))) return [`dsa${size}_${m[2]}`, m[1] === "generate_key" ? "keygen" : m[1]];
      return null;
    },
  },
  {
    id: "pq", name: "Post-quantum", outerName: "Parameters", innerName: "Operations",
    outers: [
      ["mlkem768", "ML-KEM-768", true], ["mlkem1024", "ML-KEM-1024", true],
      ["mldsa44", "ML-DSA-44", true], ["mldsa65", "ML-DSA-65", true], ["mldsa87", "ML-DSA-87", true],
    ],
    inners: [
      ["keygen", "Key generation", true], ["encaps", "Encapsulate", true], ["decaps", "Decapsulate", true],
      ["sign", "Sign", true], ["verify", "Verify", true],
    ],
    match(g) {
      const m = /^(mlkem(?:768|1024)|mldsa(?:44|65|87))_(keygen|encaps|decaps|sign|verify)$/.exec(g);
      return m ? [m[1], m[2]] : null;
    },
  },
  {
    id: "hash", name: "Hashes", outerName: "Hashes", innerName: "Message sizes",
    outers: [
      ["sha256", "SHA-256", true], ["sha384", "SHA-384", true], ["sha512", "SHA-512", true],
      ["sha3-256", "SHA3-256", true], ["blake2b-512", "BLAKE2b-512", true],
      ["sha1", "SHA-1", false], ["sha224", "SHA-224", false], ["sha512-224", "SHA-512/224", false],
      ["sha512-256", "SHA-512/256", false], ["sha3-224", "SHA3-224", false], ["sha3-384", "SHA3-384", false],
      ["sha3-512", "SHA3-512", false], ["shake128", "SHAKE128", false], ["shake256", "SHAKE256", false],
      ["blake2s-256", "BLAKE2s-256", false], ["md5", "MD5", false], ["sm3", "SM3", false],
    ],
    inners: SIZE_INNERS,
  },
  {
    id: "mac", name: "MACs", outerName: "MACs", innerName: "Message sizes",
    outers: [
      ["hmac-sha256", "HMAC-SHA-256", true], ["hmac-sha512", "HMAC-SHA-512", true],
      ["aes-128-cmac", "CMAC-AES-128", true], ["poly1305", "Poly1305", true],
      ["hmac-sha1", "HMAC-SHA-1", false], ["hmac-sha224", "HMAC-SHA-224", false], ["hmac-sha384", "HMAC-SHA-384", false],
      ["hmac-sha512-224", "HMAC-SHA-512/224", false], ["hmac-sha512-256", "HMAC-SHA-512/256", false],
      ["hmac-md5", "HMAC-MD5", false], ["aes-192-cmac", "CMAC-AES-192", false], ["aes-256-cmac", "CMAC-AES-256", false],
      ["tdes-cmac", "CMAC-3DES", false],
    ],
    inners: SIZE_INNERS,
  },
  {
    id: "aead", name: "AEADs", outerName: "AEADs", innerName: "Message sizes",
    note: "AES-GCM seals and opens TLS records, of the sizes nearest these.",
    outers: [
      ["aes-128-gcm-tls-seal", "AES-128-GCM encrypt", true], ["aes-256-gcm-tls-seal", "AES-256-GCM encrypt", true],
      ["chacha20poly1305", "ChaCha20-Poly1305 encrypt", true],
      ["aes-128-gcm-tls-open", "AES-128-GCM decrypt", false], ["aes-256-gcm-tls-open", "AES-256-GCM decrypt", false],
      ["chacha20poly1305-decrypt", "ChaCha20-Poly1305 decrypt", false],
      ["aes-128-gcm-siv-encrypt", "AES-128-GCM-SIV encrypt", false], ["aes-256-gcm-siv-encrypt", "AES-256-GCM-SIV encrypt", false],
      ["aes-128-ccm-encrypt", "AES-128-CCM encrypt", false], ["aes-256-ccm-encrypt", "AES-256-CCM encrypt", false],
      ["aes-128-ocb-encrypt", "AES-128-OCB encrypt", false], ["aes-128-siv-encrypt", "AES-SIV encrypt", false],
      ["sm4-gcm-encrypt", "SM4-GCM encrypt", false],
    ],
    inners: SIZE_INNERS,
  },
  {
    id: "cipher", name: "Ciphers", outerName: "Ciphers", innerName: "Message sizes",
    outers: [
      ["aes-ctr-128", "AES-128-CTR", true], ["aes-ctr-256", "AES-256-CTR", true], ["chacha20", "ChaCha20", true],
      ["aes-cbc-encrypt-128", "AES-128-CBC encrypt", true], ["aes-cbc-decrypt-128", "AES-128-CBC decrypt", true],
      ["aes-xts-256", "AES-XTS-256", false], ["aes-ecb-encrypt-128", "AES-128-ECB encrypt", false],
      ["aes-cfb128-encrypt-128", "AES-128-CFB encrypt", false], ["aes-ofb-128", "AES-128-OFB", false],
      ["camellia-ctr-16", "Camellia-128-CTR", false], ["sm4-ctr", "SM4-CTR", false],
      ["triple-des-cbc-encrypt", "3DES-CBC encrypt", false], ["blowfish-cbc-encrypt", "Blowfish-CBC encrypt", false],
      ["cast5-cbc-encrypt", "CAST5-CBC encrypt", false], ["seed-cbc-encrypt", "SEED-CBC encrypt", false],
      ["idea-cbc-encrypt", "IDEA-CBC encrypt", false], ["rc4", "RC4", false],
    ],
    inners: SIZE_INNERS,
  },
  {
    id: "kdf", name: "KDFs", outerName: "Functions", innerName: "Cost",
    note: "The cost is PBKDF2's iterations, scrypt's N, and Argon2's memory in KiB.",
    outers: [
      ["pbkdf2-hmac-sha256", "PBKDF2-HMAC-SHA-256", true], ["pbkdf2-hmac-sha512", "PBKDF2-HMAC-SHA-512", true],
      ["scrypt", "scrypt", true], ["argon2id", "Argon2id", true],
      ["pbkdf2-hmac-sha1", "PBKDF2-HMAC-SHA-1", false], ["pbkdf2-hmac-sha384", "PBKDF2-HMAC-SHA-384", false],
      ["argon2i", "Argon2i", false], ["argon2d", "Argon2d", false],
    ],
    // The costs are whatever the benchmarks measured.
    inners: null,
    match(g, size, sizeText) {
      return this.outers.some(o => o[0] === g) ? [g, sizeText] : null;
    },
  },
];
for (const t of TOPICS) if (!t.match) t.match = bulk(t.outers);

// ------------------------------------------------------------ the comparisons

const CFG_ALL = "";
function cfgLabel(cfg) { return cfg === CFG_ALL ? "all detected" : cfg; }

// Each comparison: whether the results have it, which results it compares
// (`seriesOf`: a result's series, or null to leave it out), and its series
// on an architecture, from those present there: [{key, label, baseline,
// subject}], the baseline first.
const COMPARISONS = [
  {
    id: "libraries", name: "Libraries", desc: "verified-garbage against OpenSSL and AWS-LC",
    available: () => records.some(r => r.library in LIBRARIES && r.library !== VG),
    seriesOf: r => (r.library in LIBRARIES && r.side === "head" && r.cfg === CFG_ALL ? r.library : null),
    series(present) {
      const base = state.base in LIBRARIES && present.has(state.base) ? state.base : present.has("openssl") ? "openssl" : "aws-lc-rs";
      return ["openssl", "aws-lc-rs", VG].filter(k => present.has(k) || k === base)
        .sort((a, b) => (b === base) - (a === base))
        .map(k => ({ key: k, label: LIBRARIES[k], baseline: k === base, subject: k === VG }));
    },
    note: "OpenSSL and AWS-LC run only with every CPU feature detected, so this compares verified-garbage's choice on each runner.",
  },
  {
    id: "head", name: "Head vs base", desc: "the branch against the commit it was compared with",
    available: () => records.some(r => r.side === "base"),
    seriesOf: r => (r.library === VG && r.cfg === state.cfg ? r.side : null),
    series: () => [
      { key: "base", label: "Base", baseline: true },
      { key: "head", label: "Head", subject: true },
    ],
  },
  {
    id: "cpu", name: "CPU features", desc: "verified-garbage's implementations, by VG_CPU_FEATURES",
    available: () => new Set(records.filter(r => r.library === VG && r.side === "head").map(r => r.cfg)).size > 1,
    seriesOf: r => (r.library === VG && r.side === "head" ? r.cfg : null),
    series(present) {
      const rank = k => (k === "none" ? 0 : k === CFG_ALL ? 2 : 1);
      const cfgs = [...present].sort((a, b) => rank(a) - rank(b) || collator.compare(a, b));
      return cfgs.map((k, i) => ({ key: k, label: cfgLabel(k), baseline: i === 0, subject: k === CFG_ALL }));
    },
  },
];

// ---------------------------------------------------------------- the state

// What the page shows, kept in the URL: the comparison, the grouping, the
// libraries' baseline ("auto": OpenSSL, or AWS-LC where it has none), head
// against base's configuration, the architectures shown (null: all), and
// each grouping's chosen outers and inners (where changed).
const state = { cmp: "", topic: "", base: "auto", cfg: CFG_ALL, arches: null, sel: {} };

function readHash() {
  const m = /^#(.+)$/.exec(location.hash);
  if (!m) return;
  try {
    const s = JSON.parse(decodeURIComponent(m[1]));
    if (s && typeof s === "object") for (const k of Object.keys(state)) if (k in s) state[k] = s[k];
  } catch { /* a link from elsewhere: ignore it */ }
  if (!state.sel || typeof state.sel !== "object") state.sel = {};
}
function saveHash() { history.replaceState(null, "", "#" + encodeURIComponent(JSON.stringify(state))); }

function selected(topic, kind, all) {
  const s = state.sel[topic.id] && state.sel[topic.id][kind];
  if (Array.isArray(s)) return new Set(s);
  const defs = kind === "o" ? topic.outers : topic.inners;
  return new Set(defs ? defs.filter(d => d[2]).map(d => d[0]) : all);
}

// --------------------------------------------------------------- computing

// The results of `topic` that comparison `cmp` compares: by architecture,
// then outer and inner, then series: at the size nearest the bar's, the
// fastest (of several runs loaded).
function collect(cmp, topic) {
  const out = new Map();
  for (const r of records) {
    const series = cmp.seriesOf(r);
    if (series === null) continue;
    const m = topic.match(r.group, r.size, r.sizeText);
    if (!m) continue;
    const [outer, inner, d = 0] = m;
    if (!out.has(r.arch)) out.set(r.arch, new Map());
    const a = out.get(r.arch);
    const key = outer + "\u001f" + inner;
    if (!a.has(key)) a.set(key, { outer, inner, cells: new Map() });
    const cells = a.get(key).cells;
    const prev = cells.get(series);
    if (!prev || d < prev.d || (d === prev.d && r.t < prev.r.t)) cells.set(series, { r, d });
  }
  return out;
}

function topicsWithData(cmp) {
  return TOPICS.filter(t => records.some(r => cmp.seriesOf(r) !== null && t.match(r.group, r.size, r.sizeText)));
}

// ------------------------------------------------------------ formatting

function sig(x) {
  const s = x.toPrecision(3);
  return s.includes("e") ? String(Number(s)) : s;
}
function fmtTime(ns) {
  for (const [scale, unit] of [[1e9, "s"], [1e6, "ms"], [1e3, "µs"]]) if (ns >= scale) return `${sig(ns / scale)} ${unit}`;
  return `${sig(ns)} ns`;
}
function fmtRel(x) { return x >= 10 ? `${x.toFixed(1)}×` : `${x.toFixed(2)}×`; }
function archOrder(a, b) {
  const ia = ARCHES.indexOf(a), ib = ARCHES.indexOf(b);
  return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || collator.compare(a, b);
}

// --------------------------------------------------------------------- DOM

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) e.append(c instanceof Node ? c : String(c));
  return e;
}
const SVG_NS = "http://www.w3.org/2000/svg";
function svg(tag, attrs, text) {
  const e = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== undefined && v !== null) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}
const measurer = document.createElement("canvas").getContext("2d");
function textWidth(s, size = 12, weight = 400) {
  measurer.font = `${weight} ${size}px system-ui, -apple-system, "Segoe UI", sans-serif`;
  return measurer.measureText(s).width;
}
function fit(s, max, size = 12, weight = 400) {
  if (textWidth(s, size, weight) <= max) return s;
  let lo = 0, hi = s.length;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (textWidth(s.slice(0, mid) + "…", size, weight) <= max) lo = mid; else hi = mid - 1;
  }
  return lo ? s.slice(0, lo) + "…" : "";
}

// ----------------------------------------------------------------- render

function render() {
  hideTooltip();
  renderRun();
  const cards = document.getElementById("cards");
  document.getElementById("errors").replaceChildren(...loadErrors.map(e => el("div", {}, e)));
  if (!records.length) {
    for (const id of ["compare", "topics", "filters", "note", "all"]) document.getElementById(id).replaceChildren();
    cards.replaceChildren(el("div", { class: "welcome" },
      el("h2", {}, "No benchmark results loaded"),
      el("p", {}, "Drop results files here, or use “Load results…”. ",
        el("code", {}, "python3 ci/bench_report.py collect"), " writes one from a local ", el("code", {}, "cargo bench"),
        ", and the Benchmarks workflow's ", el("code", {}, "benchmarks.html"), " has its run's built in.")));
    return;
  }
  const comparisons = COMPARISONS.filter(c => c.available());
  if (!comparisons.some(c => c.id === state.cmp)) state.cmp = (comparisons[0] || COMPARISONS[0]).id;
  const cmp = COMPARISONS.find(c => c.id === state.cmp);
  if (cmp.id === "head") {
    const cfgs = new Set(records.filter(r => r.side === "base").map(r => r.cfg));
    if (!cfgs.has(state.cfg)) state.cfg = cfgs.has(CFG_ALL) ? CFG_ALL : [...cfgs].sort(collator.compare)[0];
  }
  const topics = topicsWithData(cmp);
  if (!topics.some(t => t.id === state.topic)) state.topic = topics.length ? topics[0].id : "";
  saveHash();
  renderCompare(comparisons, cmp);
  renderTopics(topics);
  renderAll();
  const topic = TOPICS.find(t => t.id === state.topic);
  if (!topic) {
    for (const id of ["filters", "note"]) document.getElementById(id).replaceChildren();
    cards.replaceChildren(el("div", { class: "empty-card" }, "None of these results is in a grouping that this comparison charts: they are all in the table below."));
    return;
  }
  const data = collect(cmp, topic);
  renderFilters(cmp, topic, data);
  document.getElementById("note").textContent = [topic.note, cmp.note].filter(Boolean).join(" ");
  const presentI = new Set();
  for (const a of data.values()) for (const g of a.values()) presentI.add(g.inner);
  const outers = selected(topic, "o"), inners = selected(topic, "i", presentI);
  const arches = [...data.keys()].sort(archOrder).filter(a => !state.arches || state.arches.includes(a));
  cards.replaceChildren(...arches.map(arch => renderCard(cmp, topic, arch, data.get(arch), outers, inners)));
  if (!arches.length) cards.append(el("div", { class: "empty-card" }, "No architecture is selected."));
}

function renderRun() {
  const box = document.getElementById("run");
  const one = k => { const v = new Set(files.map(f => f.context[k]).filter(Boolean)); return v.size === 1 ? String([...v][0]) : null; };
  const commits = new Set();
  for (const f of files) for (const r of f.results) if (r.side !== "base" && r.commit) commits.add(r.commit);
  const parts = [];
  const ref = one("ref"), commit = commits.size === 1 ? [...commits][0].slice(0, 10) : null;
  if (ref || commit) parts.push([ref, commit].filter(Boolean).join(" @ "));
  const date = one("date");
  if (date) parts.push(date.slice(0, 10));
  box.replaceChildren(parts.join(" · "));
  const run = one("run");
  if (run && /^https:\/\//.test(run)) box.append(parts.length ? " · " : "", el("a", { href: run }, "workflow run"));
  else if (records.length) box.append(`${parts.length ? " · " : ""}${records.length.toLocaleString()} results`);
}

function renderCompare(comparisons, cmp) {
  const nav = document.getElementById("compare");
  nav.replaceChildren(...comparisons.map(c => el("button", {
    type: "button", "aria-pressed": String(c.id === state.cmp),
    onclick: () => { state.cmp = c.id; render(); },
  }, c.name)), el("span", { class: "desc" }, cmp.desc));
}

function renderTopics(topics) {
  document.getElementById("topics").replaceChildren(...topics.map(t => el("button", {
    type: "button", role: "tab", "aria-selected": String(t.id === state.topic),
    onclick: () => { state.topic = t.id; render(); },
  }, t.name)));
}

function chipRow(label, items, isOn, onToggle, extra) {
  return [
    el("span", { class: "label" }, label),
    el("div", { class: "chips" }, items.map(([key, text]) => el("button", {
      type: "button", class: "chip", "aria-pressed": String(isOn(key)), onclick: () => onToggle(key),
    }, text)), extra || null),
  ];
}

function renderFilters(cmp, topic, data) {
  const box = document.getElementById("filters");
  const presentO = new Set(), presentI = new Set(), present = new Set();
  for (const a of data.values()) for (const g of a.values()) {
    presentO.add(g.outer);
    presentI.add(g.inner);
    for (const k of g.cells.keys()) present.add(k);
  }
  const outerItems = topic.outers.filter(o => presentO.has(o[0]));
  const innerItems = topic.inners ? topic.inners.filter(i => presentI.has(i[0])) : [...presentI].sort(collator.compare).map(i => [i, i]);
  const toggle = (kind, all) => key => {
    const cur = selected(topic, kind, all);
    if (cur.has(key)) cur.delete(key); else cur.add(key);
    (state.sel[topic.id] = state.sel[topic.id] || {})[kind] = [...cur];
    render();
  };
  const reset = state.sel[topic.id]
    ? el("button", { type: "button", class: "reset", onclick: () => { delete state.sel[topic.id]; render(); } }, "Reset")
    : null;
  const oSel = selected(topic, "o"), iSel = selected(topic, "i", presentI);
  box.replaceChildren(
    ...chipRow(topic.outerName, outerItems, k => oSel.has(k), toggle("o")),
    ...chipRow(topic.innerName, innerItems, k => iSel.has(k), toggle("i", presentI), reset));
  const arches = [...data.keys()].sort(archOrder);
  if (arches.length > 1) {
    box.append(...chipRow("Architectures", arches.map(a => [a, a]), a => !state.arches || state.arches.includes(a), a => {
      const cur = new Set(state.arches || arches);
      if (cur.has(a)) cur.delete(a); else cur.add(a);
      state.arches = cur.size === arches.length ? null : [...cur];
      render();
    }));
  }
  if (cmp.id === "libraries" && present.has("openssl") && present.has("aws-lc-rs")) {
    const s = el("select", { "aria-label": "Relative to" },
      el("option", { value: "auto" }, "OpenSSL (AWS-LC where it has none)"),
      el("option", { value: "aws-lc-rs", selected: state.base === "aws-lc-rs" }, "AWS-LC"));
    s.addEventListener("change", () => { state.base = s.value; render(); });
    box.append(el("span", { class: "label" }, "Relative to"), el("div", { class: "chips" }, s));
  } else if (cmp.id === "head") {
    const cfgs = [...new Set(records.filter(r => r.side === "base" && r.library === VG).map(r => r.cfg))]
      .sort((a, b) => (a === CFG_ALL ? -1 : b === CFG_ALL ? 1 : collator.compare(a, b)));
    if (cfgs.length > 1) box.append(...chipRow("VG_CPU_FEATURES", cfgs.map(c => [c, cfgLabel(c)]), k => k === state.cfg, k => { state.cfg = k; render(); }));
  }
}

const openTables = new Set();

function renderCard(cmp, topic, arch, groups, outers, inners) {
  // The series that have results here, colored by role: the baseline gray,
  // the subject (verified-garbage, head, every feature detected) blue.
  const present = new Set();
  for (const g of groups.values()) for (const k of g.cells.keys()) present.add(k);
  const series = cmp.series(present);
  let slot = 2;
  for (const s of series) s.color = s.baseline ? "var(--s-base)" : s.subject ? "var(--s1)" : `var(--s${Math.min(8, slot++)})`;
  const base = series.find(s => s.baseline);
  // A cluster of bars for each outer and inner, in the grouping's order.
  const innerOrder = topic.inners ? topic.inners.map(i => i[0]) : [...new Set([...groups.values()].map(g => g.inner))].sort(collator.compare);
  const innerLabel = k => (topic.inners ? topic.inners.find(i => i[0] === k)[1] : k);
  const clusters = [];
  for (const [ok, olabel] of topic.outers) {
    if (!outers.has(ok)) continue;
    for (const ik of innerOrder) {
      const g = groups.get(ok + "\u001f" + ik);
      if (!inners.has(ik) || !g) continue;
      const baseCell = base && g.cells.get(base.key);
      const bars = series.map(s => {
        const c = g.cells.get(s.key);
        return { s, r: c ? c.r : null, rel: c && baseCell ? baseCell.r.t / c.r.t : NaN };
      });
      clusters.push({ outer: ok, outerLabel: olabel, innerLabel: innerLabel(ik), bars, hasBase: !!baseCell });
    }
  }
  // The runners' CPUs, and which series ran on which where they differ.
  const cpus = new Map();
  for (const c of clusters) for (const b of c.bars) if (b.r && b.r.cpu) {
    if (!cpus.has(b.s.label)) cpus.set(b.s.label, new Set());
    cpus.get(b.s.label).add(b.r.cpu);
  }
  const allCpus = new Set([...cpus.values()].flatMap(s => [...s]));
  const cpuText = allCpus.size === 1 ? [...allCpus][0]
    : allCpus.size > 1 ? "Different CPUs: " + [...cpus].map(([label, set]) => `${label} on ${[...set].join(" and ")}`).join("; ")
    : null;
  const numbers = el("button", { type: "button", class: "numbers", "aria-expanded": String(openTables.has(arch)) },
    openTables.has(arch) ? "Hide numbers" : "Numbers");
  const card = el("section", { class: "card" },
    el("div", { class: "card-head" }, el("h2", {}, arch),
      cpuText ? el("span", { class: "cpu" + (allCpus.size > 1 ? " warn" : "") }, cpuText) : null, numbers),
    el("div", { class: "legend" }, series.map(s => el("span", { class: "item" },
      el("span", { class: "swatch", style: `background:${s.color}` }), s.baseline ? `${s.label} (= 1.0×)` : s.label))),
    el("div", { class: "axis-title" }, `Throughput relative to ${base ? base.label : "the baseline"} · higher is better`));
  if (!clusters.length) {
    numbers.remove();
    card.append(el("div", { class: "empty-card" }, `Nothing selected has results on ${arch}.`));
    return card;
  }
  const chart = el("div", { class: "chart" });
  const table = el("div", {});
  card.append(chart, table);
  // Drawn once the card is in the page, and so has a width.
  requestAnimationFrame(() => drawChart(chart, clusters, series, base));
  const fillTable = () => table.replaceChildren(...(openTables.has(arch) ? [numbersTable(clusters, series, topic)] : []));
  numbers.addEventListener("click", () => {
    if (openTables.has(arch)) openTables.delete(arch); else openTables.add(arch);
    numbers.textContent = openTables.has(arch) ? "Hide numbers" : "Numbers";
    numbers.setAttribute("aria-expanded", String(openTables.has(arch)));
    fillTable();
  });
  fillTable();
  return card;
}

function niceStep(range, ticks) {
  const raw = range / ticks;
  const e = 10 ** Math.floor(Math.log10(raw));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * e >= raw) return m * e;
  return 10 * e;
}

function drawChart(box, clusters, series, base) {
  const width = Math.max(300, box.clientWidth);
  const nS = series.length;
  const left = 48, right = 8, top = 22, plotH = 260;
  const IN = 16, OUT = 40, GAP = 2;     // between clusters, between outer groups, between bars
  const nC = clusters.length;
  const nO = new Set(clusters.map(c => c.outer)).size;
  const fixed = (nC - nO) * IN + nO * OUT + nC * (nS - 1) * GAP;
  const bw = Math.max(8, Math.min(44, Math.floor((width - left - right - fixed) / (nC * nS))));
  const cw = nS * bw + (nS - 1) * GAP;
  // Too many bars to fit: the chart scrolls sideways.
  const svgW = Math.max(width, left + right + fixed + nC * nS * bw);
  const height = top + plotH + 62;
  const rels = clusters.flatMap(c => c.bars.map(b => b.rel)).filter(Number.isFinite);
  const maxRel = Math.max(1, ...rels);
  const step = niceStep(maxRel * 1.12, 8);
  const yMax = Math.ceil(maxRel * 1.12 / step) * step;
  const y = v => top + plotH - Math.min(v, yMax) / yMax * plotH;
  const s = svg("svg", {
    width: svgW, height, viewBox: `0 0 ${svgW} ${height}`, role: "img",
    "aria-label": "Bar chart of throughput relative to the baseline; “Numbers” shows it as a table",
  });
  for (let i = 0; i * step <= yMax + 1e-9; i++) {
    const v = i * step, vy = y(v);
    s.append(svg("line", { class: "grid", x1: left, x2: svgW - right, y1: vy, y2: vy }));
    s.append(svg("text", { class: "tick", x: left - 8, y: vy + 4, "text-anchor": "end" }, `${+v.toFixed(2)}×`));
  }
  // The baseline's 1×, a tick or not.
  s.append(svg("line", { class: "grid one", x1: left, x2: svgW - right, y1: y(1), y2: y(1) }));
  s.append(svg("line", { class: "axis", x1: left, x2: svgW - right, y1: top + plotH, y2: top + plotH }));
  const labelsY = top + plotH + 18;
  const spans = [];
  // Bars at their widest leave room: center them.
  let x = left + OUT / 2 + Math.max(0, (svgW - left - right - fixed - nC * nS * bw) / 2);
  for (const c of clusters) {
    const last = spans[spans.length - 1];
    if (!last || last.outer !== c.outer) {
      if (last) x += OUT - IN;
      spans.push({ outer: c.outer, label: c.outerLabel, x0: x, x1: x });
    }
    const x0 = x;
    spans[spans.length - 1].x1 = x0 + cw;
    const g = svg("g", {});
    const wash = svg("rect", { class: "wash", x: x0 - IN / 2 + 2, y: top - 8, width: cw + IN - 4, height: plotH + 8, rx: 6, visibility: "hidden" });
    g.append(wash);
    c.bars.forEach((b, i) => {
      if (!Number.isFinite(b.rel)) return;
      const bx = x0 + i * (bw + GAP), by = y(b.rel), h = top + plotH - by;
      const r = Math.min(4, bw / 2, h);
      g.append(svg("path", {
        d: `M${bx},${top + plotH}V${by + r}A${r},${r} 0 0 1 ${bx + r},${by}H${bx + bw - r}A${r},${r} 0 0 1 ${bx + bw},${by + r}V${top + plotH}Z`,
        style: `fill:${b.s.color}`,
      }));
      if (!b.s.baseline && bw >= 22) {
        g.append(svg("text", { class: "value" + (b.s.subject ? " subject" : ""), x: bx + bw / 2, y: by - 6, "text-anchor": "middle" },
          b.rel >= 10 ? b.rel.toFixed(1) : b.rel.toFixed(2)));
      }
    });
    if (!c.hasBase && base) {
      g.append(svg("text", { class: "missing", x: x0 + cw / 2, y: top + plotH - 8, "text-anchor": "middle" }, fit(`no ${base.label}`, cw + IN - 4, 11)));
    }
    g.append(svg("text", { class: "inner", x: x0 + cw / 2, y: labelsY, "text-anchor": "middle" }, fit(c.innerLabel, cw + IN - 4)));
    const hit = svg("rect", { class: "hit", x: x0 - IN / 2, y: top - 8, width: cw + IN, height: plotH + 30 });
    hit.addEventListener("pointermove", e => { wash.setAttribute("visibility", "visible"); showTooltip(tooltipFor(c), e.clientX, e.clientY); });
    hit.addEventListener("pointerleave", () => { wash.setAttribute("visibility", "hidden"); hideTooltip(); });
    g.append(hit);
    s.append(g);
    x += cw + IN;
  }
  // Each outer group: a bracket under its bars, and its name.
  const by = labelsY + 12;
  for (const sp of spans) {
    s.append(svg("path", { class: "bracket", d: `M${sp.x0},${by - 5}V${by}H${sp.x1}V${by - 5}` }));
    s.append(svg("text", { class: "outer", x: (sp.x0 + sp.x1) / 2, y: by + 20, "text-anchor": "middle" }, fit(sp.label, sp.x1 - sp.x0 + OUT - 6, 14, 600)));
  }
  box.replaceChildren(s);
}

function tooltipFor(c) {
  const ids = new Set();
  const rows = c.bars.map(b => {
    if (b.r) ids.add(`${b.r.group} / ${b.r.sizeText}`);
    return el("div", { class: "row" },
      el("span", { class: "k", style: `background:${b.s.color}` }),
      el("b", {}, Number.isFinite(b.rel) ? fmtRel(b.rel) : "–"),
      el("span", { class: "name" }, b.s.label),
      el("span", { class: "t" }, b.r ? fmtTime(b.r.t) : "no result"));
  });
  return [el("div", { class: "title" }, `${c.outerLabel} · ${c.innerLabel}`), ...rows, el("div", { class: "foot" }, [...ids].join(", "))];
}

function numbersTable(clusters, series, topic) {
  const cell = b => (b.r ? fmtTime(b.r.t) : "–");
  const rel = b => (b.r && !b.s.baseline && Number.isFinite(b.rel) ? fmtRel(b.rel) : null);
  const head = el("tr", {}, el("th", {}, topic.outerName), series.map(s => el("th", {}, s.label)));
  const rows = clusters.map(c => el("tr", {}, el("td", {}, `${c.outerLabel} · ${c.innerLabel}`),
    c.bars.map(b => el("td", {}, cell(b), rel(b) ? el("span", { class: "rel" }, rel(b)) : null))));
  const copy = el("button", { type: "button" }, "Copy as Markdown");
  copy.addEventListener("click", async () => {
    const lines = [`| ${topic.outerName} | ${series.map(s => s.label).join(" | ")} |`, `|---|${series.map(() => "--:").join("|")}|`,
      ...clusters.map(c => `| ${c.outerLabel} · ${c.innerLabel} | ${c.bars.map(b => cell(b) + (rel(b) ? ` (${rel(b)})` : "")).join(" | ")} |`)];
    try { await navigator.clipboard.writeText(lines.join("\n") + "\n"); copy.textContent = "Copied"; } catch { copy.textContent = "Couldn't copy"; }
    setTimeout(() => { copy.textContent = "Copy as Markdown"; }, 1500);
  });
  return el("div", {}, el("div", { class: "table-wrap" }, el("table", { class: "data" }, el("thead", {}, head), el("tbody", {}, rows))),
    el("div", { class: "table-tools" }, copy));
}

// Every result, including those that no grouping charts.
function renderAll() {
  const box = document.getElementById("all");
  if (box.dataset.count === String(records.length)) return;
  box.dataset.count = String(records.length);
  box.replaceChildren(el("summary", {}, `All ${records.length.toLocaleString()} results`));
  let filled = false;
  const fill = () => {
    if (filled) return;
    filled = true;
    const input = el("input", { type: "search", placeholder: "Filter, e.g. “aes-128-gcm x86_64”" });
    const count = el("span", {});
    const body = el("tbody", {});
    const sorted = [...records].sort((a, b) => archOrder(a.arch, b.arch) || collator.compare(a.group, b.group) || a.size - b.size || collator.compare(a.library, b.library));
    const draw = () => {
      const words = input.value.toLowerCase().split(/\s+/).filter(Boolean);
      const rows = sorted.filter(r => {
        const s = `${r.arch} ${cfgLabel(r.cfg)} ${r.side} ${r.group} ${r.sizeText} ${r.library} ${LIBRARIES[r.library] || ""}`.toLowerCase();
        return words.every(w => s.includes(w));
      });
      count.textContent = rows.length > 1000 ? `the first 1,000 of ${rows.length.toLocaleString()}` : `${rows.length.toLocaleString()} results`;
      body.replaceChildren(...rows.slice(0, 1000).map(r => el("tr", {},
        el("td", {}, r.group), el("td", {}, r.sizeText), el("td", { class: "left" }, LIBRARIES[r.library] || r.library),
        el("td", { class: "left" }, r.arch), el("td", { class: "left" }, cfgLabel(r.cfg)), el("td", { class: "left" }, r.side),
        el("td", {}, fmtTime(r.t)))));
    };
    input.addEventListener("input", draw);
    box.append(el("div", { class: "search" }, input, count),
      el("div", { class: "table-wrap" }, el("table", { class: "data" },
        el("thead", {}, el("tr", {}, ["Benchmark", "Size", "Library", "Arch", "VG_CPU_FEATURES", "Side", "Time"].map(h => el("th", {}, h)))), body)));
    draw();
  };
  box.ontoggle = () => { if (box.open) fill(); };
  if (box.open) fill();
}

// ----------------------------------------------------------------- tooltip

function showTooltip(content, x, y) {
  const tip = document.getElementById("tooltip");
  tip.replaceChildren(...content);
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let lx = x + 14, ly = y + 14;
  if (lx + w > innerWidth - 8) lx = Math.max(8, x - w - 14);
  if (ly + h > innerHeight - 8) ly = Math.max(8, y - h - 14);
  tip.style.left = lx + "px";
  tip.style.top = ly + "px";
}
function hideTooltip() { document.getElementById("tooltip").style.display = "none"; }

// ------------------------------------------------------------------ setup

function extractEmbedded(text) {
  const m = /<script type="application\/json" id="bench-data">([\s\S]*?)<\/script>/.exec(text);
  return m ? JSON.parse(m[1]) : null;
}

async function loadFiles(list) {
  loadErrors = [];
  for (const file of list) {
    try {
      const text = await file.text();
      const doc = /\.html?$/i.test(file.name) || /^\s*</.test(text) ? extractEmbedded(text) : JSON.parse(text);
      if (doc === null) throw new Error(`${file.name}: no results built in`);
      addDocument(doc, file.name);
    } catch (e) {
      loadErrors.push(e.message);
    }
  }
  rebuild();
  render();
}

function setTheme(t) {
  if (t === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  document.getElementById("theme").textContent = `Theme: ${t}`;
  try { localStorage.setItem("vg-bench-theme", t); } catch { /* only a convenience */ }
}

function init() {
  try {
    const embedded = JSON.parse(document.getElementById("bench-data").textContent || "null");
    if (embedded) addDocument(embedded, "built in");
  } catch (e) {
    loadErrors.push(`The results built into this page can't be read: ${e.message}`);
  }
  rebuild();
  readHash();
  let theme = "auto";
  try { theme = localStorage.getItem("vg-bench-theme") || "auto"; } catch { /* the default */ }
  setTheme(theme);
  document.getElementById("theme").addEventListener("click", () => {
    setTheme({ auto: "light", light: "dark", dark: "auto" }[document.documentElement.dataset.theme || "auto"]);
  });
  document.getElementById("load").addEventListener("click", () => document.getElementById("file").click());
  document.getElementById("file").addEventListener("change", e => { loadFiles([...e.target.files]); e.target.value = ""; });
  let depth = 0;
  const drop = document.getElementById("drop");
  const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes("Files");
  addEventListener("dragenter", e => { if (hasFiles(e)) { depth++; drop.classList.add("show"); } });
  addEventListener("dragleave", e => { if (hasFiles(e) && --depth <= 0) { depth = 0; drop.classList.remove("show"); } });
  addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
  addEventListener("drop", e => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    depth = 0;
    drop.classList.remove("show");
    loadFiles([...e.dataTransfer.files]);
  });
  addEventListener("hashchange", () => { readHash(); render(); });
  let lastWidth = 0, timer = null;
  new ResizeObserver(entries => {
    const w = Math.round(entries[0].contentRect.width);
    if (w === lastWidth) return;
    lastWidth = w;
    clearTimeout(timer);
    timer = setTimeout(render, 120);
  }).observe(document.getElementById("cards"));
  render();
}

init();
</script>
