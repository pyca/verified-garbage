<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benchmark results</title>
<!--
  The page of ci/bench_report.py: charts benchmark results files (that
  script's format), which it has built in (the `bench-data` element) or
  which are loaded into it. Everything is in this file, with no network
  access, so that a workflow's copy opens anywhere.

  What it compares follows from the results: each library, side (base or
  head) and VG_CPU_FEATURES configuration measured is a series, and every
  bar is throughput relative to the first series measured in its group
  (OpenSSL, else AWS-LC, else base, else the configuration `none`), drawn
  gray. Each benchmark group is a chart of its own, across machines (an
  architecture and CPU model); charts dropped onto each other combine,
  one plot per machine, grouped by a parameter their names share (P-256,
  P-384, …). It knows nothing of the algorithms but how to print their
  names (`WORDS`) and the units of their sizes (`UNITS`).
-->
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f1f0ec;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e8e7e1;
  --grid-strong: #c3c2b7;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --hover: rgba(11, 11, 11, 0.04);
  --accent: #2a78d6;
  --drop: rgba(42, 120, 214, 0.10);
  --s-base: #a09f99;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #262624;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2a2a28;
    --grid-strong: #45453f;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --hover: rgba(255, 255, 255, 0.05);
    --accent: #3987e5;
    --drop: rgba(57, 135, 229, 0.16);
    --s-base: #63625e;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #262624;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2a2a28;
  --grid-strong: #45453f;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --hover: rgba(255, 255, 255, 0.05);
  --accent: #3987e5;
  --drop: rgba(57, 135, 229, 0.16);
  --s-base: #63625e;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
button, select, input { font: inherit; color: inherit; }
button {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 10px;
  cursor: pointer;
}
button:hover { background: var(--surface-2); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type="search"] {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 9px;
}
a { color: var(--accent); }
code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 16px; }

header { padding: 18px 0 4px; }
header .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
header h1 { font-size: 20px; font-weight: 600; margin: 0; }
header .run { color: var(--ink-2); }
header .tools { margin-left: auto; display: flex; gap: 6px; }
header .tools button { font-size: 13px; padding: 3px 9px; color: var(--ink-2); }
#file { display: none; }
#errors { color: var(--s8); }

.controls { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 12px; align-items: baseline; margin: 14px 0 6px; }
.controls .label { color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 999px;
  padding: 2px 11px;
  font-size: 13px;
  color: var(--muted);
  border: 1px dashed var(--axis);
  background: none;
}
.chip[aria-pressed="true"] { color: var(--ink); border: 1px solid var(--ink-2); background: var(--surface); }
.chip .swatch { width: 11px; height: 11px; border-radius: 3px; }
.chip[aria-pressed="false"] .swatch { opacity: 0.35; }
.search { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search input { width: min(420px, 100%); }
.hint { color: var(--muted); font-size: 13px; }

#cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr));
  gap: 14px;
  margin: 16px 0 24px;
  align-items: start;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px 10px;
  min-width: 0;
}
.card.combined { grid-column: 1 / -1; }
.card.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.badge { display: inline-block; margin-left: 8px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); vertical-align: 2px; }
button.primary { color: var(--accent) !important; border-color: var(--accent); font-weight: 600; }
#toast {
  position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 20px); z-index: 25;
  display: flex; gap: 12px; align-items: center; max-width: calc(100vw - 32px);
  padding: 9px 12px 9px 16px; border-radius: 10px; background: var(--ink); color: var(--surface);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25); opacity: 0; pointer-events: none; transition: opacity 0.15s, transform 0.15s;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#toast button { background: none; border: 0; color: var(--surface); font-weight: 600; text-decoration: underline; padding: 2px 4px; }
.card.drop-target { outline: 2px dashed var(--accent); background: var(--drop); }
.card.dragging { opacity: 0.4; }
.card-head { display: flex; gap: 8px; align-items: flex-start; cursor: grab; }
.card-head .titles { flex: 1; min-width: 0; }
.card-head h2 { font-size: 15px; font-weight: 600; margin: 0; overflow-wrap: anywhere; }
.card-head .names { color: var(--muted); overflow-wrap: anywhere; }
.card-head .actions { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.card-head .actions button { font-size: 12px; padding: 1px 8px; color: var(--ink-2); }
.members { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.member { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--border); border-radius: 999px; padding: 0 2px 0 9px; font-size: 12px; color: var(--ink-2); background: var(--surface-2); }
.member button { border: 0; background: none; padding: 0 5px; color: var(--muted); border-radius: 999px; }
.sizes { margin-top: 8px; }
.sizes .chip { font-size: 12px; padding: 1px 9px; }
.plot-title { font-size: 13px; font-weight: 600; margin: 12px 0 0; color: var(--ink); }
.plot-title { margin-top: 10px; }
.axis-title { color: var(--muted); font-size: 12px; margin-top: 6px; }
.chart { overflow-x: auto; min-height: 40px; }
.chart svg { display: block; }
.chart svg text { fill: var(--ink-2); font-size: 12px; }
.chart svg text.tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart svg text.outer { fill: var(--ink); font-size: 13px; font-weight: 600; }
.chart svg text.value { fill: var(--ink-2); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart svg text.value.subject { fill: var(--ink); font-weight: 650; }
.chart svg text.missing { fill: var(--muted); font-size: 11px; }
.chart svg .grid { stroke: var(--grid); stroke-width: 1; }
.chart svg .grid.one { stroke: var(--grid-strong); }
.chart svg .axis { stroke: var(--axis); stroke-width: 1; }
.chart svg .bracket { stroke: var(--axis); stroke-width: 1; fill: none; }
.chart svg .wash { fill: var(--hover); }
.chart svg .hit { fill: transparent; }

table.data { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
table.data th, table.data td { padding: 3px 8px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
table.data th:first-child, table.data td:first-child { text-align: left; white-space: normal; }
table.data th { color: var(--ink-2); font-weight: 600; background: var(--surface); position: sticky; top: 0; }
table.data td .rel { color: var(--muted); margin-left: 6px; }
table.data td.left { text-align: left; }
.table-tools { display: flex; justify-content: flex-end; margin-top: 6px; }
.table-tools button { font-size: 12px; padding: 1px 8px; }
.table-wrap { overflow: auto; max-height: 70vh; }

details.all { margin: 8px 0 40px; color: var(--ink-2); }
details.all summary { cursor: pointer; padding: 6px 0; }
details.all .search { margin: 8px 0; }

.welcome {
  grid-column: 1 / -1;
  max-width: 620px;
  margin: 48px auto;
  padding: 28px;
  text-align: center;
  color: var(--ink-2);
  border: 1px dashed var(--axis);
  border-radius: 12px;
  background: var(--surface);
}
.welcome h2 { color: var(--ink); font-size: 18px; margin: 0 0 8px; }

#tooltip {
  position: fixed;
  z-index: 20;
  pointer-events: none;
  display: none;
  max-width: min(380px, calc(100vw - 16px));
  padding: 9px 11px;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.16);
  font-size: 13px;
}
#tooltip .title { font-weight: 600; margin-bottom: 5px; }
#tooltip .row { display: grid; grid-template-columns: 14px auto 1fr auto; gap: 8px; align-items: baseline; }
#tooltip .row .k { width: 12px; height: 3px; border-radius: 2px; transform: translateY(-3px); }
#tooltip .row b { font-variant-numeric: tabular-nums; }
#tooltip .row .name { color: var(--ink-2); }
#tooltip .row .t { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
#tooltip .foot { color: var(--muted); margin-top: 6px; font-size: 12px; overflow-wrap: anywhere; }
#drop {
  position: fixed; inset: 0; z-index: 30; display: none;
  align-items: center; justify-content: center;
  background: rgba(0, 0, 0, 0.4); color: #ffffff; font-size: 18px;
}
#drop.show { display: flex; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1>Benchmarks</h1>
      <span class="run" id="run"></span>
      <div class="tools">
        <button id="load" type="button" title="Add results files (.json) or other reports (.html)">Load results…</button>
        <button id="theme" type="button">Theme: auto</button>
      </div>
    </div>
    <input id="file" type="file" multiple accept=".json,.html,application/json,text/html">
    <div id="errors"></div>
  </header>
  <div class="controls" id="controls"></div>
  <div id="cards"></div>
  <details class="all" id="all"></details>
</div>
<div id="tooltip" role="tooltip"></div>
<div id="drop">Drop results files to add them</div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:16px">This page needs JavaScript to chart the results.</p></noscript>
<script type="application/json" id="bench-data">null</script>
<script type="application/json" id="bench-view">null</script>
<script>
"use strict";

// --------------------------------------------------------------- printing

const VG = "verified-garbage";
const LIBRARIES = { openssl: "OpenSSL", "aws-lc-rs": "AWS-LC", [VG]: "VG" };
const ARCHES = ["x86_64", "aarch64", "aarch64-apple", "x86", "arm", "thumb", "powerpc64", "riscv64"];
const collator = new Intl.Collator("en", { numeric: true });

// How to print the words of benchmark names (`ecdsa_p256_sha256_sign`).
const WORDS = {
  aes: "AES", argon2d: "Argon2d", argon2i: "Argon2i", argon2id: "Argon2id", blake2b: "BLAKE2b", blake2s: "BLAKE2s",
  blowfish: "Blowfish", camellia: "Camellia", cast5: "CAST5", cbc: "CBC", ccm: "CCM", cfb: "CFB", cfb8: "CFB8",
  cfb64: "CFB64", cfb128: "CFB128", chacha20: "ChaCha20", chacha20poly1305: "ChaCha20-Poly1305", cmac: "CMAC",
  ctr: "CTR", dit: "DIT", dsa: "DSA", ec: "EC", ecb: "ECB", ecdh: "ECDH", ecdsa: "ECDSA", ed25519: "Ed25519",
  ed448: "Ed448", ffdh: "FFDH", gcm: "GCM", hmac: "HMAC", hp: "HP", idea: "IDEA", md5: "MD5", mgf1: "MGF1",
  oaep: "OAEP", ocb: "OCB", ofb: "OFB", pbkdf2: "PBKDF2", pkcs1: "PKCS#1", poly1305: "Poly1305", pss: "PSS",
  quic: "QUIC", rc2: "RC2", rc4: "RC4", rsa: "RSA", seed: "SEED", sha1: "SHA-1", sha3: "SHA3", shake128: "SHAKE128",
  shake256: "SHAKE256", siv: "SIV", sm3: "SM3", sm4: "SM4", tdes: "3DES", "3des": "3DES", tls: "TLS",
  x25519: "X25519", x448: "X448", xts: "XTS",
};
function word(t) {
  let m;
  if (WORDS[t]) return WORDS[t];
  if ((m = /^p(\d{3})$/.exec(t))) return `P-${m[1]}`;
  if ((m = /^sha(\d{3})$/.exec(t))) return `SHA-${m[1]}`;
  if ((m = /^brainpoolp(\d+)r1$/.exec(t))) return `brainpoolP${m[1]}r1`;
  if ((m = /^mlkem(\d+)$/.exec(t))) return `ML-KEM-${m[1]}`;
  if ((m = /^mldsa(\d+)$/.exec(t))) return `ML-DSA-${m[1]}`;
  return t;
}
// A name's words, printed: a number after an acronym joins it (AES-128).
function pretty(tokens) {
  const out = [];
  for (const t of tokens) {
    const w = word(t);
    const prev = out[out.length - 1];
    if (prev && /^\d+$/.test(t) && /[A-Z0-9]$/.test(prev) && prev !== prev.toLowerCase()) out[out.length - 1] = `${prev}-${w}`;
    else out.push(w);
  }
  return out.join(" ");
}
const tokensOf = group => group.split(/[-_]/).filter(Boolean);

// The units of the benchmarks' sizes: bytes, but for these.
const UNITS = [
  [/^pbkdf2-/, n => `${n.toLocaleString()} iterations`],
  [/^scrypt/, n => `N = ${n.toLocaleString()}`],
  [/^argon2/, n => `${bytes(n * 1024)} of memory`],
  [/^(rsa_|ffdh_(?!parameters_g))/, n => `${n * 8}-bit`],
  [/^dsa_/, n => `${n}-bit`],
  [/-tls-connection$/, n => `${n} record${n === 1 ? "" : "s"}`],
];
function bytes(n) {
  for (const [scale, unit] of [[1048576, "MiB"], [1024, "KiB"]]) if (n >= scale && n % scale === 0) return `${n / scale} ${unit}`;
  return `${n} B`;
}
function sizeLabel(group, sizeText) {
  if (!/^\d+$/.test(sizeText)) return sizeText;
  const n = Number(sizeText);
  for (const [re, f] of UNITS) if (re.test(group)) return f(n);
  return bytes(n);
}
function shortCpu(cpu) {
  return cpu.replace(/\((R|TM)\)/gi, "").replace(/\b(Processor|CPU)\b/gi, "").replace(/\b\d+-Core\b/gi, "")
    .replace(/@.*$/, "").replace(/\s+/g, " ").trim();
}
function sig(x) {
  const s = x.toPrecision(3);
  return s.includes("e") ? String(Number(s)) : s;
}
function fmtTime(ns) {
  for (const [scale, unit] of [[1e9, "s"], [1e6, "ms"], [1e3, "µs"]]) if (ns >= scale) return `${sig(ns / scale)} ${unit}`;
  return `${sig(ns)} ns`;
}
function fmtRel(x) { return x >= 10 ? `${x.toFixed(1)}×` : `${x.toFixed(2)}×`; }

// ----------------------------------------------------------------- the data

const FORMAT = "verified-garbage-bench";
let files = [];
let records = [];
let loadErrors = [];
let machines = [];             // [{key, label}], in order
let series = [];               // [{key, label, color, subject}], baselines first
let seriesByKey = new Map();
let groups = [];               // the benchmark groups, in order
let table = new Map();         // group -> machine -> size -> series -> fastest record
let sizesOf = new Map();       // group -> its sizes, in order

function addDocument(doc, name) {
  if (Array.isArray(doc)) return doc.forEach(d => addDocument(d, name));
  if (doc && Array.isArray(doc.files)) return doc.files.forEach(d => addDocument(d, (d && d.name) || name));
  if (!doc || doc.format !== FORMAT || !Array.isArray(doc.results)) throw new Error(`${name}: not a benchmark results file`);
  const id = doc.id || `${name}#${files.length}`;
  if (!files.some(f => f.id === id)) files.push({ id, name: doc.name || name, context: doc.context || {}, results: doc.results });
}

function rebuild() {
  records = [];
  // Runs of the workflow are told apart, when there are several.
  const runs = [...new Set(files.map(f => f.context.run).filter(Boolean))];
  for (const f of files) {
    const c = f.context;
    const source = runs.length > 1 && c.run ? `run ${String(c.run).split("/").pop()}` : "";
    for (const r of f.results) {
      const t = Number(r.time_ns);
      if (!(t > 0) || r.group === undefined) continue;
      records.push({
        arch: String(c.arch ?? "unknown"), cpu: c.cpu ? String(c.cpu) : "", cfg: String(c.cpu_features ?? ""),
        side: r.side === "base" ? "base" : "head", library: String(r.library), group: String(r.group),
        sizeText: String(r.size), t, source,
      });
    }
  }
  // Machines: an architecture and CPU model, whose results alone compare.
  const ms = new Map();
  for (const r of records) {
    r.machine = `${r.arch}\u001f${r.cpu}`;
    if (!ms.has(r.machine)) ms.set(r.machine, { key: r.machine, arch: r.arch, label: r.cpu ? `${r.arch} · ${shortCpu(r.cpu)}` : r.arch });
  }
  const archRank = a => { const i = ARCHES.indexOf(a); return i < 0 ? 99 : i; };
  machines = [...ms.values()].sort((a, b) => archRank(a.arch) - archRank(b.arch) || collator.compare(a.label, b.label));
  // Series, in the order that picks each group's baseline: OpenSSL, AWS-LC,
  // then verified-garbage's configurations (`none` first, every feature
  // detected last), base before head.
  const libRank = l => (l === "openssl" ? 0 : l === "aws-lc-rs" ? 1 : l === VG ? 3 : 2);
  const cfgRank = c => (c === "none" ? 0 : c === "" ? 2 : 1);
  const ss = new Map();
  for (const r of records) {
    r.series = [r.library, r.cfg, r.side, r.source].join("\u001f");
    if (!ss.has(r.series)) {
      const label = (LIBRARIES[r.library] || r.library) + (r.cfg ? ` ${r.cfg}` : "") + (r.side === "base" ? " (base)" : "") + (r.source ? ` · ${r.source}` : "");
      ss.set(r.series, { key: r.series, label, library: r.library, cfg: r.cfg, side: r.side, source: r.source });
    }
  }
  const sources = [...new Set(records.map(r => r.source))];
  series = [...ss.values()].sort((a, b) => libRank(a.library) - libRank(b.library) || collator.compare(a.library, b.library)
    || cfgRank(a.cfg) - cfgRank(b.cfg) || collator.compare(a.cfg, b.cfg)
    || sources.indexOf(a.source) - sources.indexOf(b.source) || (a.side === "base" ? -1 : 1) - (b.side === "base" ? -1 : 1));
  // The subject, in blue: verified-garbage's head with every feature
  // detected; then the others in palette order (OpenSSL gray).
  const subject = [...series].reverse().find(s => s.library === VG && s.side === "head" && s.cfg === "")
    || [...series].reverse().find(s => s.library === VG) || series[series.length - 1];
  let slot = 2;
  for (const s of series) {
    s.subject = s === subject;
    s.color = s.subject ? "var(--s1)" : s.library === "openssl" ? "var(--s-base)" : `var(--s${Math.min(8, slot++)})`;
  }
  seriesByKey = new Map(series.map(s => [s.key, s]));
  // The fastest of each benchmark's results, by group, machine, size and
  // series (several runs of one can be loaded).
  table = new Map();
  sizesOf = new Map();
  for (const r of records) {
    if (!table.has(r.group)) { table.set(r.group, new Map()); sizesOf.set(r.group, new Set()); }
    sizesOf.get(r.group).add(r.sizeText);
    const byMachine = table.get(r.group);
    if (!byMachine.has(r.machine)) byMachine.set(r.machine, new Map());
    const bySize = byMachine.get(r.machine);
    if (!bySize.has(r.sizeText)) bySize.set(r.sizeText, new Map());
    const bySeries = bySize.get(r.sizeText);
    const prev = bySeries.get(r.series);
    if (!prev || r.t < prev.t) bySeries.set(r.series, r);
  }
  for (const [g, s] of sizesOf) sizesOf.set(g, [...s].sort(collator.compare));
  groups = [...table.keys()].sort(collator.compare);
}

// ---------------------------------------------------------------- the state

// What the page shows, kept in the URL: the combined charts (each a list of
// groups), the one that “+ Add” adds to (by one of its groups), each
// chart's hidden sizes, the hidden series and machines, and the search.
const state = { charts: [], current: "", sizes: {}, hidden: [], machines: [], q: "" };

function readHash() {
  const m = /^#(.+)$/.exec(location.hash);
  if (!m) return;
  try {
    const s = JSON.parse(decodeURIComponent(m[1]));
    if (s && typeof s === "object") for (const k of Object.keys(state)) if (k in s) state[k] = s[k];
  } catch { /* a link from elsewhere: ignore it */ }
  if (!Array.isArray(state.charts)) state.charts = [];
  for (const k of ["hidden", "machines"]) if (!Array.isArray(state[k])) state[k] = [];
  if (!state.sizes || typeof state.sizes !== "object") state.sizes = {};
  if (typeof state.q !== "string") state.q = "";
  if (typeof state.current !== "string") state.current = "";
}
// The charts that `bench_report.py html --chart` built in, each its groups
// and the `group/size`s it starts with hidden: a size is hidden where every
// group of the chart that has it hides it.
function startWith() {
  let view = null;
  try { view = JSON.parse(document.getElementById("bench-view").textContent || "null"); } catch { return; }
  if (!view || !Array.isArray(view.charts)) return;
  const known = new Set(groups);
  for (const c of view.charts) {
    const gs = (c.groups || []).filter(g => known.has(g));
    if (!gs.length) continue;
    state.charts.push(gs);
    const hide = new Set(c.hide || []);
    const labels = new Map();
    for (const g of gs) for (const size of sizesOf.get(g)) {
      const label = sizeLabel(g, size);
      labels.set(label, (labels.get(label) ?? true) && hide.has(`${g}/${size}`));
    }
    const hidden = [...labels].filter(([, h]) => h).map(([l]) => l);
    if (hidden.length) state.sizes["+" + gs.join("+")] = hidden;
    state.current = gs[0];
  }
}
function saveHash() { history.replaceState(null, "", "#" + encodeURIComponent(JSON.stringify(state))); }

// The charts: those combined first, as they were made, then each other
// group alone, by name. Each has a key, its groups, and whether it is
// combined.
function charts() {
  const known = new Set(groups);
  const combined = state.charts.map(list => list.filter(g => known.has(g))).filter(list => list.length);
  const taken = new Set(combined.flat());
  const out = combined.map(list => ({ key: "+" + list.join("+"), groups: list, combined: true }));
  for (const g of groups) if (!taken.has(g)) out.push({ key: g, groups: [g], combined: false });
  return out;
}
function combine(a, b) {
  // `a` dropped onto `b`: b's groups, then a's, where b was (or a, if only
  // a was combined).
  const merged = [...b.groups, ...a.groups.filter(g => !b.groups.includes(g))];
  const at = state.charts.findIndex(l => sameList(l, b.groups));
  const lists = state.charts.map(l => (sameList(l, b.groups) || (at < 0 && sameList(l, a.groups)) ? merged : l))
    .filter(l => l === merged || !sameList(l, a.groups));
  if (!lists.includes(merged)) lists.push(merged);
  state.charts = lists;
  state.current = merged[0];
  update();
}
// The combined chart that “+ Add” adds to: the one chosen, else the last.
function currentList() {
  return state.charts.find(l => l.includes(state.current)) || state.charts[state.charts.length - 1] || null;
}
// Adds `gs` to the current chart (or starts one), keeping the page where it
// was, and offers to undo it.
function addToCurrent(gs, from) {
  const before = { charts: JSON.parse(JSON.stringify(state.charts)), current: state.current, q: state.q };
  let list = currentList();
  if (list) for (const g of gs) { if (!list.includes(g)) list.push(g); }
  else state.charts.push(list = [...gs]);
  state.current = list[0];
  state.q = "";
  saveHash();
  render(from);
  const what = gs.length === 1 ? pretty(tokensOf(gs[0])) : `${gs.length} charts`;
  toast(`Added ${what} to “${layout(list).title}”`, () => {
    Object.assign(state, before);
    saveHash();
    render();
  });
}
function sameList(x, y) { return x.length === y.length && x.every((g, i) => g === y[i]); }
function matches(group) {
  const words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  const text = `${group} ${pretty(tokensOf(group))}`.toLowerCase();
  return words.every(w => text.includes(w));
}

// ------------------------------------------------------------- combining

// How a combined chart lays out its groups: by the parameter that every
// name has exactly one of (P-256, ML-KEM-768, …: a word with digits, by
// its letters), where it tells some of them apart but not all; and the
// words that every name shares, which make its title.
function layout(gs) {
  const toks = gs.map(tokensOf);
  const shared = toks[0].filter(t => toks.every(ts => ts.includes(t)));
  let best = null;
  const classes = new Set(toks.flat().filter(t => /\d/.test(t) && !shared.includes(t)).map(t => t.replace(/\d+/g, "#")));
  for (const cls of classes) {
    const picks = toks.map(ts => ts.filter(t => /\d/.test(t) && t.replace(/\d+/g, "#") === cls));
    if (!picks.every(p => p.length === 1)) continue;
    const k = new Set(picks.map(p => p[0])).size;
    if (k < 2 || k >= gs.length) continue;
    const pos = toks.reduce((n, ts, i) => n + ts.indexOf(picks[i][0]), 0);
    if (!best || k < best.k || (k === best.k && pos < best.pos)) best = { k, pos, picks: picks.map(p => p[0]) };
  }
  const rest = (ts, drop) => ts.filter(t => !shared.includes(t) && t !== drop);
  const firsts = [...new Set(toks.map(ts => pretty([ts[0]])))];
  const title = shared.length ? pretty(shared) : firsts.length <= 4 ? firsts.join(" · ") : `${gs.length} benchmarks`;
  return {
    title,
    outer: best ? (g => best.picks[gs.indexOf(g)]) : null,
    name: g => { const i = gs.indexOf(g); return pretty(rest(toks[i], best ? best.picks[i] : null)); },
  };
}

// ------------------------------------------------------------------- DOM

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) e.append(c instanceof Node ? c : String(c));
  return e;
}
const SVG_NS = "http://www.w3.org/2000/svg";
function svg(tag, attrs, text) {
  const e = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== undefined && v !== null) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}
const measurer = document.createElement("canvas").getContext("2d");
function textWidth(s, size = 12, weight = 400) {
  measurer.font = `${weight} ${size}px system-ui, -apple-system, "Segoe UI", sans-serif`;
  return measurer.measureText(s).width;
}
function fit(s, max, size = 12, weight = 400) {
  if (textWidth(s, size, weight) <= max) return s;
  let lo = 0, hi = s.length;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (textWidth(s.slice(0, mid) + "…", size, weight) <= max) lo = mid; else hi = mid - 1;
  }
  return lo ? s.slice(0, lo) + "…" : "";
}

// --------------------------------------------------------------- rendering

function update() { saveHash(); render(); }

// The cards drawn so far: drawn again at once when the page is rendered, so
// that their heights, and so the page, stay put.
const drawn = new Set();

// Renders the page; with `from` (a card), keeps the card after it (or
// before it) where it was on the screen.
function render(from) {
  let anchor = null;
  if (from) {
    const near = from.nextElementSibling || from.previousElementSibling;
    if (near && near.dataset.key) anchor = { key: near.dataset.key, top: near.getBoundingClientRect().top };
  }
  hideTooltip();
  renderRun();
  document.getElementById("errors").replaceChildren(...loadErrors.map(e => el("div", {}, e)));
  const cards = document.getElementById("cards");
  if (!records.length) {
    document.getElementById("controls").replaceChildren();
    document.getElementById("all").replaceChildren();
    cards.replaceChildren(el("div", { class: "welcome" },
      el("h2", {}, "No benchmark results loaded"),
      el("p", {}, "Drop results files here, or use “Load results…”. ",
        el("code", {}, "python3 ci/bench_report.py collect"), " writes one from a local ", el("code", {}, "cargo bench"),
        ", and the Benchmarks workflow's ", el("code", {}, "benchmarks.html"), " has its run's built in.")));
    return;
  }
  const list = charts();
  renderControls(list);
  renderAll();
  observer.disconnect();
  // Combined charts stay in view while searching for what to add to them.
  const shown = list.filter(c => c.combined || c.groups.some(matches));
  cards.replaceChildren(...shown.map(renderCard));
  if (!shown.length) cards.append(el("div", { class: "welcome" }, "No benchmark matches the search."));
  for (const node of cards.children) {
    if (node.draw && drawn.has(node.dataset.key)) { observer.unobserve(node); node.draw(); }
  }
  if (anchor) {
    const near = [...cards.children].find(n => n.dataset.key === anchor.key);
    if (near) scrollBy(0, near.getBoundingClientRect().top - anchor.top);
  }
}

function toast(text, undo) {
  const box = document.getElementById("toast");
  clearTimeout(box.timer);
  box.replaceChildren(el("span", {}, text), undo ? el("button", { type: "button", onclick: () => { box.classList.remove("show"); undo(); } }, "Undo") : null);
  box.classList.add("show");
  box.timer = setTimeout(() => box.classList.remove("show"), 6000);
}

function renderRun() {
  const box = document.getElementById("run");
  const one = k => { const v = new Set(files.map(f => f.context[k]).filter(Boolean)); return v.size === 1 ? String([...v][0]) : null; };
  const commits = new Set();
  for (const f of files) for (const r of f.results) if (r.side !== "base" && r.commit) commits.add(r.commit);
  const parts = [];
  const ref = one("ref"), commit = commits.size === 1 ? [...commits][0].slice(0, 10) : null;
  if (ref || commit) parts.push([ref, commit].filter(Boolean).join(" @ "));
  const date = one("date");
  if (date) parts.push(date.slice(0, 10));
  box.replaceChildren(parts.join(" · "));
  const run = one("run");
  if (run && /^https:\/\//.test(run)) box.append(parts.length ? " · " : "", el("a", { href: run }, "workflow run"));
}

function chip(text, on, onclick, swatch) {
  return el("button", { type: "button", class: "chip", "aria-pressed": String(on), onclick },
    swatch ? el("span", { class: "swatch", style: `background:${swatch}` }) : null, text);
}

function renderControls(list) {
  const box = document.getElementById("controls");
  const toggle = (key, k) => () => {
    const set = new Set(state[key]);
    if (set.has(k)) set.delete(k); else set.add(k);
    state[key] = [...set];
    update();
  };
  const rows = [];
  if (series.length > 1) {
    rows.push(el("span", { class: "label" }, "Series"), el("div", { class: "chips" },
      series.map(s => chip(s.label, !state.hidden.includes(s.key), toggle("hidden", s.key), s.color)),
      el("span", { class: "hint" }, "Gray bars are each group's baseline (1.0×): the first of these it has.")));
  }
  if (machines.length > 1) {
    rows.push(el("span", { class: "label" }, "Machines"), el("div", { class: "chips" },
      machines.map(m => chip(m.label, !state.machines.includes(m.key), toggle("machines", m.key)))));
  }
  const input = el("input", { type: "search", placeholder: "Find benchmarks, e.g. “ecdh p”", value: state.q, "aria-label": "Find benchmarks" });
  let timer = null;
  input.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      state.q = input.value;
      saveHash();
      const pos = input.selectionStart;
      render();
      const again = document.querySelector("#controls input[type=search]");
      again.focus();
      again.setSelectionRange(pos, pos);
    }, 150);
  });
  const matching = list.filter(c => !c.combined).flatMap(c => c.groups.filter(matches));
  const target = currentList();
  const addAll = state.q && matching.length > (target ? 0 : 1) && matching.length <= 60
    ? el("button", { type: "button", class: "primary", onclick: () => addToCurrent(matching) },
        target ? `+ Add these ${matching.length}` : `Combine these ${matching.length}`)
    : null;
  rows.push(el("span", { class: "label" }, "Benchmarks"), el("div", { class: "search" }, input, addAll,
    el("span", { class: "hint" }, target
      ? "“+ Add” puts a chart into the one marked “Adding here”; dragging a chart onto another combines them too."
      : "“+ Start a chart” on any chart begins one to add others to; dragging a chart onto another combines them too.")));
  box.replaceChildren(...rows);
}

// ------------------------------------------------------------------ cards

let dragged = null;
const observer = new IntersectionObserver(entries => {
  for (const e of entries) if (e.isIntersecting && e.target.draw) { observer.unobserve(e.target); e.target.draw(); }
}, { rootMargin: "400px" });

function hiddenSizes(card) { return new Set(state.sizes[card.key] || []); }

function renderCard(card) {
  const target = currentList();
  const isCurrent = card.combined && target && sameList(card.groups, target.filter(g => card.groups.includes(g)));
  const node = el("section", { class: "card" + (card.combined ? " combined" : "") + (isCurrent ? " current" : ""), "data-key": card.key });
  const lay = card.combined ? layout(card.groups) : null;
  const title = card.combined ? lay.title : pretty(tokensOf(card.groups[0]));
  const plots = el("div", {});
  const numbers = el("div", {});
  const actions = el("div", { class: "actions" });
  const head = el("div", { class: "card-head", draggable: "true", title: "Drag onto another chart to combine them" },
    el("div", { class: "titles" }, el("h2", {}, title, isCurrent && state.charts.length ? el("span", { class: "badge" }, "Adding here") : null),
      card.combined
        ? el("div", { class: "members" }, card.groups.map(g => el("span", { class: "member", title: g }, pretty(tokensOf(g)),
            el("button", { type: "button", "aria-label": `Take ${g} out`, onclick: () => {
              state.charts = state.charts.map(l => (sameList(l, card.groups) ? l.filter(x => x !== g) : l)).filter(l => l.length);
              update();
            } }, "×"))))
        : el("code", { class: "names" }, card.groups[0])),
    actions);
  node.append(head);
  if (!card.combined) {
    actions.append(el("button", {
      type: "button", class: "primary",
      title: target ? `Add to “${layout(target).title}”` : "Start a chart to add others to",
      onclick: () => addToCurrent(card.groups, node),
    }, target ? "+ Add" : "+ Start a chart"));
  } else if (!isCurrent) {
    actions.append(el("button", { type: "button", title: "Make “+ Add” add to this chart", onclick: () => { state.current = card.groups[0]; update(); } }, "Add here"));
  }
  // Sizes, where there is a choice.
  const sizes = [...new Set(card.groups.flatMap(g => sizesOf.get(g).map(s => sizeLabel(g, s))))];
  const hidden = hiddenSizes(card);
  if (sizes.length > 1) {
    node.append(el("div", { class: "chips sizes" }, sizes.map(s => chip(s, !hidden.has(s), () => {
      const set = hiddenSizes(card);
      if (set.has(s)) set.delete(s); else set.add(s);
      state.sizes[card.key] = [...set];
      if (!set.size) delete state.sizes[card.key];
      update();
    }))));
  }
  node.append(plots, numbers);
  // The plots, drawn when the card comes into view.
  const model = cardModel(card, lay, hidden);
  node.draw = () => { drawn.add(card.key); drawCard(model, plots); };
  observer.observe(node);
  if (!model.plots.length) {
    plots.append(el("div", { class: "hint", style: "padding:12px 0" }, "Nothing to show here with these series, sizes and machines."));
  } else {
    let open = false;
    const showNumbers = el("button", { type: "button" }, "Numbers");
    showNumbers.addEventListener("click", () => {
      open = !open;
      showNumbers.textContent = open ? "Hide numbers" : "Numbers";
      numbers.replaceChildren(...(open ? [numbersTable(model)] : []));
    });
    actions.append(showNumbers,
      el("button", { type: "button", title: "Copy this chart as an image", onclick: e => exportCard(model, title, plots, "copy", e.currentTarget) }, "Copy image"),
      el("button", { type: "button", title: "Download this chart as a PNG", onclick: e => exportCard(model, title, plots, "png", e.currentTarget) }, "PNG"));
  }
  if (card.combined) {
    actions.append(el("button", { type: "button", onclick: () => { state.charts = state.charts.filter(l => !sameList(l, card.groups)); update(); } }, "Split"));
  }
  // Dragging one chart onto another combines them.
  head.addEventListener("dragstart", e => { dragged = card; node.classList.add("dragging"); e.dataTransfer.setData("text/x-vg-chart", card.key); e.dataTransfer.effectAllowed = "move"; });
  head.addEventListener("dragend", () => { dragged = null; node.classList.remove("dragging"); document.querySelectorAll(".drop-target").forEach(n => n.classList.remove("drop-target")); });
  node.addEventListener("dragover", e => { if (dragged && dragged !== card) { e.preventDefault(); node.classList.add("drop-target"); } });
  node.addEventListener("dragleave", e => { if (!node.contains(e.relatedTarget)) node.classList.remove("drop-target"); });
  node.addEventListener("drop", e => {
    node.classList.remove("drop-target");
    if (!dragged || dragged === card) return;
    e.preventDefault();
    combine(dragged, card);
  });
  return node;
}

// A chart's plots, one for each machine, of each of its groups and sizes: a
// combined chart's grouped by the parameter its names differ in (`layout`).
function cardModel(card, lay, hiddenSizeLabels) {
  const shownSeries = series.filter(s => !state.hidden.includes(s.key));
  const shownMachines = machines.filter(m => !state.machines.includes(m.key));
  const sizesShown = g => sizesOf.get(g).filter(s => !hiddenSizeLabels.has(sizeLabel(g, s)));
  const multiSize = card.groups.some(g => sizesShown(g).length > 1);
  const plots = [];
  for (const m of shownMachines) {
    const clusters = [];
    for (const g of card.groups) for (const size of sizesShown(g)) {
      const bySeries = table.get(g).get(m.key)?.get(size);
      const bars = bySeries ? shownSeries.filter(s => bySeries.has(s.key)).map(s => ({ s, r: bySeries.get(s.key) })) : [];
      if (!bars.length) continue;
      const sl = sizeLabel(g, size);
      if (card.groups.length === 1) {
        clusters.push({ outer: "", outerLabel: "", innerLabel: sl, group: g, size, bars });
      } else if (lay.outer) {
        const outer = lay.outer(g);
        clusters.push({ outer, outerLabel: pretty([outer]), innerLabel: [lay.name(g), multiSize ? sl : ""].filter(Boolean).join(" · ") || sl, group: g, size, bars });
      } else {
        clusters.push({ outer: g, outerLabel: lay.name(g), innerLabel: multiSize ? sl : "", group: g, size, bars });
      }
    }
    if (lay && lay.outer) {
      const outers = [...new Set(clusters.map(c => c.outer))].sort(collator.compare);
      clusters.sort((a, b) => outers.indexOf(a.outer) - outers.indexOf(b.outer));
    }
    if (clusters.length) plots.push({ title: machines.length > 1 ? m.label : null, clusters, small: card.groups.length === 1 });
  }
  // Relative to each group's baseline, where any group has two series to
  // compare; otherwise, times.
  const relative = plots.some(p => p.clusters.some(c => c.bars.length > 1));
  for (const p of plots) for (const c of p.clusters) {
    const base = c.bars[0];
    for (const b of c.bars) {
      b.baseline = relative && b === base;
      b.v = relative ? base.r.t / b.r.t : b.r.t;
    }
  }
  return { plots, relative, multiSeries: shownSeries.length > 1 };
}

function drawCard(model, box) {
  box.replaceChildren();
  model.plots.forEach((p, i) => {
    if (i === 0) {
      box.append(el("div", { class: "axis-title" }, model.relative
        ? "Throughput relative to the gray bar · higher is better"
        : "Time per operation · lower is better"));
    }
    if (p.title) box.append(el("div", { class: "plot-title" }, p.title));
    const chart = el("div", { class: "chart" });
    box.append(chart);
    drawPlot(chart, p.clusters, model.relative, p.small);
  });
}

function niceStep(range, ticks) {
  const raw = range / ticks;
  const e = 10 ** Math.floor(Math.log10(raw));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * e >= raw) return m * e;
  return 10 * e;
}

function drawPlot(box, clusters, relative, small) {
  const width = Math.max(260, box.clientWidth || 360);
  const left = relative ? 44 : 60, right = 6, top = 20, plotH = small ? 130 : 230;
  let IN = 14, OUT = 34;
  const GAP = 2;
  const hasOuter = clusters.some(c => c.outerLabel);
  const hasInner = clusters.some(c => c.innerLabel);
  const nBars = clusters.reduce((n, c) => n + c.bars.length, 0);
  const outers = new Set(clusters.map(c => c.outer)).size;
  let fixed = (clusters.length - outers) * IN + outers * OUT + clusters.reduce((n, c) => n + (c.bars.length - 1) * GAP, 0);
  const bw = Math.max(8, Math.min(40, Math.floor((width - left - right - fixed) / nBars)));
  // Room to spare (the bars at their widest) goes between the clusters, for
  // their labels.
  const spare = width - left - right - fixed - nBars * bw;
  if (spare > 0) {
    const extra = Math.min(48, spare / (clusters.length + outers));
    IN += extra;
    OUT += extra;
    fixed += extra * (clusters.length + outers);
  }
  const svgW = Math.max(width, left + right + fixed + nBars * bw);
  const height = top + plotH + (hasInner ? 18 : 0) + (hasOuter ? 32 : 6);
  const vals = clusters.flatMap(c => c.bars.map(b => b.v));
  const maxV = Math.max(relative ? 1 : 0, ...vals);
  const step = niceStep(maxV * 1.12, 6);
  const yMax = Math.ceil(maxV * 1.12 / step) * step;
  const y = v => top + plotH - Math.min(v, yMax) / yMax * plotH;
  const s = svg("svg", {
    width: svgW, height, viewBox: `0 0 ${svgW} ${height}`, role: "img",
    "aria-label": relative ? "Bar chart of throughput relative to each group's baseline; “Numbers” shows it as a table" : "Bar chart of times; “Numbers” shows them as a table",
  });
  for (let i = 0; i * step <= yMax + 1e-9; i++) {
    const v = i * step, vy = y(v);
    s.append(svg("line", { class: "grid", x1: left, x2: svgW - right, y1: vy, y2: vy }));
    s.append(svg("text", { class: "tick", x: left - 7, y: vy + 4, "text-anchor": "end" }, relative ? `${+v.toFixed(2)}×` : fmtTime(v)));
  }
  if (relative) s.append(svg("line", { class: "grid one", x1: left, x2: svgW - right, y1: y(1), y2: y(1) }));
  s.append(svg("line", { class: "axis", x1: left, x2: svgW - right, y1: top + plotH, y2: top + plotH }));
  const used = fixed + nBars * bw;
  // Values on the bars, if every one fits: all or none.
  const valueText = b => (relative ? (b.v >= 10 ? b.v.toFixed(1) : b.v.toFixed(2)) : fmtTime(b.v));
  const labelled = clusters.every(c => c.bars.every(b => b.baseline || textWidth(valueText(b), 11) <= bw + GAP - 1));
  let x = left + OUT / 2 + Math.max(0, (svgW - left - right - used) / 2);
  const spans = [];
  const labelsY = top + plotH + 16;
  for (const c of clusters) {
    const last = spans[spans.length - 1];
    if (!last || last.outer !== c.outer) {
      if (last) x += OUT - IN;
      spans.push({ outer: c.outer, label: c.outerLabel, x0: x, x1: x });
    }
    const cw = c.bars.length * bw + (c.bars.length - 1) * GAP;
    const x0 = x;
    spans[spans.length - 1].x1 = x0 + cw;
    const g = svg("g", {});
    const wash = svg("rect", { class: "wash", x: x0 - IN / 2 + 2, y: top - 8, width: cw + IN - 4, height: plotH + 8, rx: 6, visibility: "hidden" });
    g.append(wash);
    c.bars.forEach((b, i) => {
      const bx = x0 + i * (bw + GAP), by = y(b.v), h = top + plotH - by;
      const r = Math.min(4, bw / 2, h);
      g.append(svg("path", {
        d: `M${bx},${top + plotH}V${by + r}A${r},${r} 0 0 1 ${bx + r},${by}H${bx + bw - r}A${r},${r} 0 0 1 ${bx + bw},${by + r}V${top + plotH}Z`,
        style: `fill:${b.baseline ? "var(--s-base)" : b.s.color}`,
      }));
      if (!b.baseline && labelled) {
        g.append(svg("text", { class: "value" + (b.s.subject ? " subject" : ""), x: bx + bw / 2, y: by - 5, "text-anchor": "middle" }, valueText(b)));
      }
    });
    if (relative && c.bars.length === 1) {
      g.append(svg("text", { class: "missing", x: x0 + cw / 2, y: y(1) - 6, "text-anchor": "middle" }, fit(`only ${c.bars[0].s.label}`, cw + IN + 20, 11)));
    }
    if (c.innerLabel) g.append(svg("text", { x: x0 + cw / 2, y: labelsY, "text-anchor": "middle" }, fit(c.innerLabel, cw + IN - 4)));
    const hit = svg("rect", { class: "hit", x: x0 - IN / 2, y: top - 8, width: cw + IN, height: plotH + 26 });
    hit.addEventListener("pointermove", e => { wash.setAttribute("visibility", "visible"); showTooltip(tooltipFor(c, relative), e.clientX, e.clientY); });
    hit.addEventListener("pointerleave", () => { wash.setAttribute("visibility", "hidden"); hideTooltip(); });
    g.append(hit);
    s.append(g);
    x += cw + IN;
  }
  if (hasOuter) {
    const by = labelsY + (hasInner ? 10 : -8);
    for (const sp of spans) {
      if (!sp.label) continue;
      if (hasInner) s.append(svg("path", { class: "bracket", d: `M${sp.x0},${by - 5}V${by}H${sp.x1}V${by - 5}` }));
      s.append(svg("text", { class: "outer", x: (sp.x0 + sp.x1) / 2, y: by + 18, "text-anchor": "middle" }, fit(sp.label, sp.x1 - sp.x0 + OUT - 6, 13, 600)));
    }
  }
  box.replaceChildren(s);
}

function clusterName(c) {
  return [c.outerLabel, c.innerLabel].filter(Boolean).join(" · ") || sizeLabel(c.group, c.size);
}

function tooltipFor(c, relative) {
  const rows = c.bars.map(b => el("div", { class: "row" },
    el("span", { class: "k", style: `background:${b.baseline ? "var(--s-base)" : b.s.color}` }),
    el("b", {}, relative ? fmtRel(b.v) : fmtTime(b.v)),
    el("span", { class: "name" }, b.s.label + (b.baseline ? " (baseline)" : "")),
    el("span", { class: "t" }, relative ? fmtTime(b.r.t) : "")));
  return [el("div", { class: "title" }, clusterName(c)), ...rows,
    el("div", { class: "foot" }, `${c.group} / ${c.size}`)];
}

function numbersTable(model) {
  const used = series.filter(s => model.plots.some(p => p.clusters.some(c => c.bars.some(b => b.s === s))));
  const rows = [];
  for (const p of model.plots) for (const c of p.clusters) {
    const name = [p.title, clusterName(c)].filter(Boolean).join(" · ");
    rows.push([name, used.map(s => {
      const b = c.bars.find(b => b.s === s);
      return b ? { t: fmtTime(b.r.t), rel: model.relative && !b.baseline ? fmtRel(b.v) : null } : null;
    })]);
  }
  const head = el("tr", {}, el("th", {}, ""), used.map(s => el("th", {}, s.label)));
  const body = rows.map(([name, cells]) => el("tr", {}, el("td", {}, name),
    cells.map(c => el("td", {}, c ? c.t : "–", c && c.rel ? el("span", { class: "rel" }, c.rel) : null))));
  const copy = el("button", { type: "button" }, "Copy as Markdown");
  copy.addEventListener("click", async () => {
    const lines = [`| | ${used.map(s => s.label).join(" | ")} |`, `|---|${used.map(() => "--:").join("|")}|`,
      ...rows.map(([name, cells]) => `| ${name} | ${cells.map(c => (c ? c.t + (c.rel ? ` (${c.rel})` : "") : "–")).join(" | ")} |`)];
    try { await navigator.clipboard.writeText(lines.join("\n") + "\n"); copy.textContent = "Copied"; } catch { copy.textContent = "Couldn't copy"; }
    setTimeout(() => { copy.textContent = "Copy as Markdown"; }, 1500);
  });
  return el("div", {}, el("div", { class: "table-wrap" }, el("table", { class: "data" }, el("thead", {}, head), el("tbody", {}, body))),
    el("div", { class: "table-tools" }, copy));
}

// ------------------------------------------------------------------ images

// A chart as one SVG, its styles inlined (the page's are in CSS), with its
// title and legend, for an image to copy or save.
function chartSvg(model, title, box) {
  const css = getComputedStyle(document.documentElement);
  const color = v => {
    const m = /^var\((--[\w-]+)\)$/.exec(v);
    return m ? css.getPropertyValue(m[1]).trim() : v;
  };
  const font = 'system-ui, -apple-system, "Segoe UI", sans-serif';
  const pad = 16;
  const svgs = [...box.querySelectorAll("svg")];
  const width = Math.max(...svgs.map(s => Number(s.getAttribute("width")))) + 2 * pad;
  const out = svg("svg", { xmlns: SVG_NS, width, height: 0, "font-family": font });
  out.append(svg("rect", { width: "100%", height: "100%", fill: color("var(--surface)") }));
  let y = pad + 16;
  out.append(svg("text", { x: pad, y, "font-size": 16, "font-weight": 600, fill: color("var(--ink)") }, title));
  // The legend: the series in the chart.
  const used = series.filter(s => model.plots.some(p => p.clusters.some(c => c.bars.some(b => b.s === s))));
  if (used.length > 1) {
    y += 24;
    let x = pad;
    for (const s of used) {
      const w = textWidth(s.label, 13) + 34;
      if (x + w > width - pad) { x = pad; y += 20; }
      out.append(svg("rect", { x, y: y - 10, width: 11, height: 11, rx: 3, fill: color(s.library === "openssl" ? "var(--s-base)" : s.color) }));
      out.append(svg("text", { x: x + 17, y, "font-size": 13, fill: color("var(--ink)") }, s.label));
      x += w;
    }
  }
  y += 22;
  out.append(svg("text", { x: pad, y, "font-size": 12, fill: color("var(--muted)") },
    model.relative ? "Throughput relative to the gray bar, each group's baseline · higher is better" : "Time per operation · lower is better"));
  y += 8;
  for (const node of box.children) {
    if (node.classList.contains("plot-title")) {
      y += 22;
      out.append(svg("text", { x: pad, y, "font-size": 13, "font-weight": 600, fill: color("var(--ink)") }, node.textContent));
      y += 4;
    }
    const live = node.querySelector && node.querySelector("svg");
    if (!live) continue;
    const copy = live.cloneNode(true);
    // Inline what the page's CSS gives each element.
    const a = [live, ...live.querySelectorAll("*")], b = [copy, ...copy.querySelectorAll("*")];
    a.forEach((n, i) => {
      const cs = getComputedStyle(n);
      const m = b[i];
      if (n.tagName === "text") {
        m.setAttribute("fill", cs.fill);
        m.setAttribute("font-size", cs.fontSize);
        m.setAttribute("font-weight", cs.fontWeight);
        m.setAttribute("font-family", font);
      } else if (n.tagName === "line" || n.classList.contains("bracket")) {
        m.setAttribute("stroke", cs.stroke);
        m.setAttribute("fill", "none");
      } else if (n.tagName === "path") {
        m.setAttribute("fill", cs.fill);
      }
      m.removeAttribute("style");
      m.removeAttribute("class");
    });
    copy.querySelectorAll("rect").forEach(r => r.remove());
    copy.setAttribute("x", pad);
    copy.setAttribute("y", y);
    out.append(copy);
    y += Number(live.getAttribute("height"));
  }
  out.setAttribute("height", y + pad);
  return { text: new XMLSerializer().serializeToString(out), width, height: y + pad };
}

// The chart as a PNG, at twice its size.
async function chartPng(model, title, box) {
  if (!box.querySelector("svg")) drawCard(model, box);
  const { text, width, height } = chartSvg(model, title, box);
  const url = URL.createObjectURL(new Blob([text], { type: "image/svg+xml" }));
  try {
    const img = new Image();
    await new Promise((ok, fail) => { img.onload = ok; img.onerror = fail; img.src = url; });
    const canvas = document.createElement("canvas");
    canvas.width = width * 2;
    canvas.height = height * 2;
    const ctx = canvas.getContext("2d");
    ctx.scale(2, 2);
    ctx.drawImage(img, 0, 0);
    return await new Promise(ok => canvas.toBlob(ok, "image/png"));
  } finally {
    URL.revokeObjectURL(url);
  }
}

function exportCard(model, title, box, how, button) {
  const done = msg => { const old = button.textContent; button.textContent = msg; setTimeout(() => { button.textContent = old; }, 1500); };
  const png = chartPng(model, title, box);
  if (how === "copy") {
    // Called at once, in the click, with the image to come: as browsers
    // allow it (Safari only so).
    navigator.clipboard.write([new ClipboardItem({ "image/png": png })])
      .then(() => done("Copied"), () => done("Couldn't copy"));
    return;
  }
  png.then(blob => {
    const a = el("a", { href: URL.createObjectURL(blob), download: `${title.replace(/[^\w.-]+/g, "-").replace(/^-|-$/g, "") || "benchmark"}.png` });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, () => done("Couldn't save"));
}

// --------------------------------------------------------------- all results

function renderAll() {
  const box = document.getElementById("all");
  if (box.dataset.count === String(records.length)) return;
  box.dataset.count = String(records.length);
  box.replaceChildren(el("summary", {}, `All ${records.length.toLocaleString()} results`));
  let filled = false;
  const fill = () => {
    if (filled) return;
    filled = true;
    const input = el("input", { type: "search", placeholder: "Filter, e.g. “aes-128-gcm x86_64”" });
    const count = el("span", { class: "hint" });
    const body = el("tbody", {});
    const label = new Map(machines.map(m => [m.key, m.label]));
    const sorted = [...records].sort((a, b) => collator.compare(a.group, b.group) || collator.compare(a.sizeText, b.sizeText)
      || machines.findIndex(m => m.key === a.machine) - machines.findIndex(m => m.key === b.machine)
      || series.indexOf(seriesByKey.get(a.series)) - series.indexOf(seriesByKey.get(b.series)));
    const draw = () => {
      const words = input.value.toLowerCase().split(/\s+/).filter(Boolean);
      const rows = sorted.filter(r => {
        const s = `${r.group} ${r.sizeText} ${label.get(r.machine)} ${seriesByKey.get(r.series).label}`.toLowerCase();
        return words.every(w => s.includes(w));
      });
      count.textContent = rows.length > 1000 ? `the first 1,000 of ${rows.length.toLocaleString()}` : `${rows.length.toLocaleString()} results`;
      body.replaceChildren(...rows.slice(0, 1000).map(r => el("tr", {},
        el("td", {}, r.group), el("td", { class: "left" }, sizeLabel(r.group, r.sizeText)),
        el("td", { class: "left" }, seriesByKey.get(r.series).label), el("td", { class: "left" }, label.get(r.machine)),
        el("td", {}, fmtTime(r.t)))));
    };
    input.addEventListener("input", draw);
    box.append(el("div", { class: "search" }, input, count),
      el("div", { class: "table-wrap" }, el("table", { class: "data" },
        el("thead", {}, el("tr", {}, ["Benchmark", "Size", "Series", "Machine", "Time"].map(h => el("th", {}, h)))), body)));
    draw();
  };
  box.ontoggle = () => { if (box.open) fill(); };
  if (box.open) fill();
}

// ----------------------------------------------------------------- tooltip

function showTooltip(content, x, y) {
  const tip = document.getElementById("tooltip");
  tip.replaceChildren(...content);
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let lx = x + 14, ly = y + 14;
  if (lx + w > innerWidth - 8) lx = Math.max(8, x - w - 14);
  if (ly + h > innerHeight - 8) ly = Math.max(8, y - h - 14);
  tip.style.left = lx + "px";
  tip.style.top = ly + "px";
}
function hideTooltip() { document.getElementById("tooltip").style.display = "none"; }

// ------------------------------------------------------------------- setup

function extractEmbedded(text) {
  const m = /<script type="application\/json" id="bench-data">([\s\S]*?)<\/script>/.exec(text);
  return m ? JSON.parse(m[1]) : null;
}

async function loadFiles(list) {
  loadErrors = [];
  for (const file of list) {
    try {
      const text = await file.text();
      const doc = /\.html?$/i.test(file.name) || /^\s*</.test(text) ? extractEmbedded(text) : JSON.parse(text);
      if (doc === null) throw new Error(`${file.name}: no results built in`);
      addDocument(doc, file.name);
    } catch (e) {
      loadErrors.push(e.message);
    }
  }
  rebuild();
  render();
}

function setTheme(t) {
  if (t === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  document.getElementById("theme").textContent = `Theme: ${t}`;
  try { localStorage.setItem("vg-bench-theme", t); } catch { /* only a convenience */ }
}

function init() {
  try {
    const embedded = JSON.parse(document.getElementById("bench-data").textContent || "null");
    if (embedded) addDocument(embedded, "built in");
  } catch (e) {
    loadErrors.push(`The results built into this page can't be read: ${e.message}`);
  }
  rebuild();
  if (location.hash.length > 1) readHash();
  else startWith();
  let theme = "auto";
  try { theme = localStorage.getItem("vg-bench-theme") || "auto"; } catch { /* the default */ }
  setTheme(theme);
  document.getElementById("theme").addEventListener("click", () => {
    setTheme({ auto: "light", light: "dark", dark: "auto" }[document.documentElement.dataset.theme || "auto"]);
  });
  document.getElementById("load").addEventListener("click", () => document.getElementById("file").click());
  document.getElementById("file").addEventListener("change", e => { loadFiles([...e.target.files]); e.target.value = ""; });
  let depth = 0;
  const drop = document.getElementById("drop");
  const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes("Files");
  addEventListener("dragenter", e => { if (hasFiles(e)) { depth++; drop.classList.add("show"); } });
  addEventListener("dragleave", e => { if (hasFiles(e) && --depth <= 0) { depth = 0; drop.classList.remove("show"); } });
  addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
  addEventListener("drop", e => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    depth = 0;
    drop.classList.remove("show");
    loadFiles([...e.dataTransfer.files]);
  });
  addEventListener("hashchange", () => { readHash(); render(); });
  let lastWidth = 0, timer = null;
  new ResizeObserver(entries => {
    const w = Math.round(entries[0].contentRect.width);
    if (w === lastWidth) return;
    lastWidth = w;
    clearTimeout(timer);
    timer = setTimeout(render, 150);
  }).observe(document.getElementById("cards"));
  render();
}

init();
</script>
