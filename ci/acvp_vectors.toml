# NIST ACVP (https://github.com/usnistgov/ACVP-Server) test vector files not
# vendored under vectors/ (those of a set whose files are too large), which ci/fetch_acvp_vectors.py downloads,
# checking each file's SHA-256, into the directory the tests read from
# `ACVP_ROOT` (tests/acvp/main.rs). Each `path` is the file's path under
# `base`, the repository's gen-val/json-files/ at a pinned commit, and under
# `ACVP_ROOT`.

base = "https://raw.githubusercontent.com/usnistgov/ACVP-Server/975de31eb83d87039ec88934fdc47d8c312b892d/gen-val/json-files"
retrieved = 2026-11-26

