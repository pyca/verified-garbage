version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    # bench/ is its own workspace with a path dependency on the library, so
    # a dependency they share must change in both lock files in the same PR:
    # list both directories and group each dependency's update across them,
    # one PR per dependency, never one PR for unrelated dependencies.
    directories:
      - /
      - /bench
    schedule:
      interval: weekly
    groups:
      cargo:
        group-by: dependency-name
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /ci
    schedule:
      interval: weekly
