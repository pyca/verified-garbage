version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    # bench/ is its own workspace with a path dependency on the library, so
    # its lock file must change in the same PR as the root one: list both
    # directories and group them into one PR.
    directories:
      - /
      - /bench
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /ci
    schedule:
      interval: weekly
