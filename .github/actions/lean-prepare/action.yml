name: Prepare the Lean build
description: >
  Restores this project's last build into `lean/.lake/build` (Lake rebuilds
  only what changed since: mostly extraction), installing Lean meanwhile,
  then installs Mathlib (`lean-setup`, `lean-mathlib`). Every job that
  builds the proofs starts with it, after checking out the repository. The
  cache holds `lean/.lake/ltar`, a module archive per module
  (`ci/lean_cache.py store`), which it unpacks with the project's leantar
  (the `leantar` action downloads it, for the rest of the job: the restores
  here and `lean-assemble`'s `store`) while Lean installs.

inputs:
  key:
    description: The key of the build's cache (the plan job's `build-cache`).
    required: true
  restore-keys:
    description: Fallbacks, one per line, most preferred first.
    required: true
  modules:
    description: >
      A file of the project's modules (`lean_shards.py closure`) to unpack
      alone, for a shard; empty for every module.
    required: false
    default: ""

outputs:
  cache-hit:
    description: Whether the build was restored from exactly `key`.
    value: ${{ steps.lean-build.outputs.cache-hit == 'true' || steps.lean-build-again.outputs.cache-hit == 'true' }}
  cache-primary-key:
    description: The key to save the build under (`key`).
    value: ${{ steps.lean-build.outputs.cache-primary-key }}
  cache-matched-key:
    description: The key of the build restored, if any (empty if none was).
    value: ${{ steps.lean-build.outputs.cache-matched-key || steps.lean-build-again.outputs.cache-matched-key }}

runs:
  using: composite
  steps:
    # Installing elan and the toolchain, and listing the modules the proofs
    # import from outside the project, need nothing restored: they run in
    # the background while the build's archives restore, and `lean-setup`
    # waits for them. A process started in
    # a step outlives it; the runner stops what is left at the end of the
    # job. Its output goes to a file: holding the step's open would make the
    # step wait for it.
    - name: Install elan and list the imports, in the background
      shell: bash
      working-directory: lean
      run: |
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
        (
          # Not `-e` (bash steps run with it): a failure must still write
          # the status, or `lean-setup` would wait for it.
          set +e -o pipefail
          log() { echo "[lean-setup $(date -u +%T)] $*"; }
          # Runs a download up to three times; the command bounds each
          # attempt with `timeout` (which stops its whole process group),
          # or a stalled connection would hang until `lean-setup` gives up.
          retry() {
            local what=$1 attempt status
            shift
            for attempt in 1 2 3; do
              log "$what (attempt $attempt)"
              "$@"
              status=$?
              [ "$status" = 0 ] && { log "$what: done"; return 0; }
              [ "$status" = 124 ] && log "$what: timed out" || log "$what: failed ($status)"
            done
            return 1
          }
          # Before downloading a toolchain, elan fetches the index of Lean's
          # releases (https://release.lean-lang.org, about 4 MB) with no
          # timeout at all (`fetch_url` in elan's `elan-utils`), and prints
          # nothing while it does. That server sometimes stalls partway through
          # the transfer, and elan then waits forever. The index normally
          # takes under a second, after which elan prints
          # `info: downloading https://…`: an attempt that has not printed it
          # within 10 s is stuck, so stop it and try again. The download
          # itself elan aborts on a stall (30 s below 10 B/s); the 180 s
          # bounds the whole attempt.
          install_toolchain() {
            local out="$RUNNER_TEMP/elan-install.log" done="$RUNNER_TEMP/elan-install.status" pid
            rm -f "$done"
            # Shown as it is written, and kept to look for the download.
            { timeout 180 "$HOME/.elan/bin/elan" -v toolchain install "$1" 2>&1 | tee "$out"
              echo $? > "$done"; } &
            pid=$!
            for _ in $(seq 10); do
              sleep 1
              [ -f "$done" ] || grep -q 'downloading https://' "$out" 2>/dev/null && break
            done
            if [ ! -f "$done" ] && ! grep -q 'downloading https://' "$out" 2>/dev/null; then
              log "elan has not started downloading after 10 s: stuck fetching the index of releases"
              pkill -P "$pid"
              wait "$pid"
              return 124
            fi
            wait "$pid"
            return "$(cat "$done")"
          }
          {
            retry "Installing elan" timeout 15 sh -c '
              curl -sSfL --connect-timeout 20 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
                | sh -s -- -y --default-toolchain none' &&
            retry "Installing $(cat lean-toolchain)" install_toolchain "$(cat lean-toolchain)" &&
            log "Listing the imports" &&
            # Every module the Lean files import from outside this project
            # and Lean itself, as Lean's own parser reads their headers.
            git ls-files '*.lean' | timeout 300 xargs "$HOME/.elan/bin/lean" --deps-json \
              | jq -r '.imports[].result.imports[].module
                       | select(test("^(VerifiedGarbage[A-Za-z]*|Init|Std|Lean)(\\.|$)") | not)' \
              | sort -u > "$RUNNER_TEMP/lean-mods" &&
            log "Listing the imports: done"
          } > "$RUNNER_TEMP/lean-setup.log" 2>&1
          echo $? > "$RUNNER_TEMP/lean-setup.status.tmp"
          mv "$RUNNER_TEMP/lean-setup.status.tmp" "$RUNNER_TEMP/lean-setup.status"
        ) < /dev/null > /dev/null 2>&1 &
    - uses: ./.github/actions/leantar
    - name: Restore this project's build
      id: lean-build
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: lean/.lake/ltar
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
    # A download that fails partway (a stalled connection, aborted) is only
    # a warning, and looks like a miss: without a second try the job would
    # build every module from nothing.
    - name: Restore this project's build again
      id: lean-build-again
      if: ${{ steps.lean-build.outputs.cache-matched-key == '' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: lean/.lake/ltar
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
    # With the project's leantar, not the toolchain's, so while Lean installs
    # (`lean-setup` waits for it). The archives stay, for the next `store`
    # (lean-assemble).
    - name: Unpack this project's build
      if: ${{ hashFiles('lean/.lake/ltar/index.json') != '' }}
      shell: bash
      env:
        MODULES: ${{ inputs.modules }}
      # `--empty-private`: nothing CI runs reads the private data of this
      # project's modules (`ci/lean_cache.py`), half of what restoring writes.
      run: python3 ci/lean_cache.py restore lean --empty-private ${MODULES:+--modules "$MODULES"}
    - uses: ./.github/actions/lean-setup
      id: lean-setup
    - uses: ./.github/actions/lean-mathlib
      with:
        mods: ${{ steps.lean-setup.outputs.mods }}
        cache-hit: ${{ steps.lean-setup.outputs.cache-hit }}
        cache-key: ${{ steps.lean-setup.outputs.cache-key }}
    # Saved with the next project build, so publishing can fetch the exact
    # dependency cache without installing Lean to parse the imports again.
    - name: Record the dependency cache key
      shell: bash
      env:
        KEY: ${{ steps.lean-setup.outputs.cache-key }}
      run: |
        mkdir -p lean/.lake/ltar
        printf '%s\n' "$KEY" > lean/.lake/ltar/mathlib-cache-key
