name: Prepare the Lean build
description: >
  Restores this project's last build into `lean/.lake/build` (Lake rebuilds
  only what changed since: mostly extraction), installing Lean meanwhile,
  then installs Mathlib (`lean-setup`, `lean-mathlib`). Every job that
  builds the proofs starts with it, after checking out the repository.

inputs:
  key:
    description: The key of the build's cache (the plan job's `build-cache`).
    required: true
  restore-keys:
    description: Fallbacks, one per line, most preferred first.
    required: true

outputs:
  cache-hit:
    description: Whether the build was restored from exactly `key`.
    value: ${{ steps.lean-build.outputs.cache-hit == 'true' || steps.lean-build-again.outputs.cache-hit == 'true' }}
  cache-primary-key:
    description: The key to save the build under (`key`).
    value: ${{ steps.lean-build.outputs.cache-primary-key }}
  cache-matched-key:
    description: The key of the build restored, if any (empty if none was).
    value: ${{ steps.lean-build.outputs.cache-matched-key || steps.lean-build-again.outputs.cache-matched-key }}

runs:
  using: composite
  steps:
    # Installing elan and the toolchain, and listing the modules the proofs
    # import from outside the project, need nothing restored: they run in
    # the background while the build restores (writing about 10 GB, which
    # takes a minute), and `lean-setup` waits for them. A process started in
    # a step outlives it; the runner stops what is left at the end of the
    # job. Its output goes to a file: holding the step's open would make the
    # step wait for it.
    - name: Install elan and list the imports, in the background
      shell: bash
      working-directory: lean
      run: |
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
        (
          # Not `-e` (bash steps run with it): a failure must still write
          # the status, or `lean-setup` would wait for it.
          set +e -o pipefail
          {
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none &&
            # Every module the Lean files import from outside this project
            # and Lean itself, as Lean's own parser reads their headers.
            git ls-files '*.lean' | xargs "$HOME/.elan/bin/lean" --deps-json \
              | jq -r '.imports[].result.imports[].module
                       | select(test("^(VerifiedGarbage[A-Za-z]*|Init|Std|Lean)(\\.|$)") | not)' \
              | sort -u > "$RUNNER_TEMP/lean-mods"
          } > "$RUNNER_TEMP/lean-setup.log" 2>&1
          echo $? > "$RUNNER_TEMP/lean-setup.status.tmp"
          mv "$RUNNER_TEMP/lean-setup.status.tmp" "$RUNNER_TEMP/lean-setup.status"
        ) < /dev/null > /dev/null 2>&1 &
    - name: Restore this project's build
      id: lean-build
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: lean/.lake/build
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
    # A download that fails partway (a stalled connection, aborted) is only
    # a warning, and looks like a miss: without a second try the job would
    # build every module from nothing.
    - name: Restore this project's build again
      id: lean-build-again
      if: ${{ steps.lean-build.outputs.cache-matched-key == '' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: lean/.lake/build
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
    - uses: ./.github/actions/lean-setup
      id: lean-setup
    - uses: ./.github/actions/lean-mathlib
      with:
        mods: ${{ steps.lean-setup.outputs.mods }}
        cache-hit: ${{ steps.lean-setup.outputs.cache-hit }}
        cache-key: ${{ steps.lean-setup.outputs.cache-key }}
