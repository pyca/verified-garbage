name: Upload an artifact
description: >
  `actions/upload-artifact`, tried up to three times. The artifact service
  sometimes times out (`Failed to FinalizeArtifact: … ETIMEDOUT`), which
  failed a merge queue run whose every test had passed; a later attempt
  replaces whatever the failed one left (`overwrite`). Every job uploads
  through this, but `all-green`'s metrics, which it uploads without a
  checkout and whose failure it ignores.

inputs:
  name:
    description: The artifact's name.
    required: true
  path:
    description: The files to upload (upload-artifact's `path`).
    required: true
  if-no-files-found:
    description: upload-artifact's, with its default.
    default: warn
  retention-days:
    description: upload-artifact's (empty for the repository's default).
    default: ""
  compression-level:
    description: upload-artifact's, with its default.
    default: "6"

runs:
  using: composite
  steps:
    - id: first
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
    - if: ${{ steps.first.outcome == 'failure' }}
      shell: bash
      env:
        ARTIFACT: ${{ inputs.name }}
      run: |
        echo "::warning::Uploading $ARTIFACT failed: trying again."
        sleep 15
    - id: second
      if: ${{ steps.first.outcome == 'failure' }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: true
    - if: ${{ steps.second.outcome == 'failure' }}
      shell: bash
      env:
        ARTIFACT: ${{ inputs.name }}
      run: |
        echo "::warning::Uploading $ARTIFACT failed again: trying a last time."
        sleep 60
    - if: ${{ steps.second.outcome == 'failure' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: true
