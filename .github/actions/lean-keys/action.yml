name: Name the Lean caches
description: >
  The keys of the caches of the Lean build and of its manifest, for every job
  that restores them: the toolchain and dependencies (a prefix, which other
  sources' entries share, as fallbacks), then the sources. CI's plan job and
  the cache publisher (lean-cache.yml) both name them here, so they agree.

outputs:
  build-cache:
    value: ${{ steps.keys.outputs.build-cache }}
  build-cache-prefix:
    value: ${{ steps.keys.outputs.build-cache-prefix }}
  manifest-cache:
    value: ${{ steps.keys.outputs.manifest-cache }}
  manifest-cache-prefix:
    value: ${{ steps.keys.outputs.manifest-cache-prefix }}

runs:
  using: composite
  steps:
    # The sources' hash is of the blob hashes Git's index holds for them
    # (as checked out: the step fails if any differs from the index), not
    # of their contents: `hashFiles` read and hashed all 26,000-odd files,
    # 9 s at the start of every run's Lean build, where this takes a tenth
    # of a second.
    - id: keys
      shell: bash
      env:
        PREFIX: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-
      run: |
        paths=(lean/lakefile.toml ':(glob)lean/*.lean' lean/VerifiedGarbage lean/VerifiedGarbageTest)
        if [ -n "$(git status --porcelain --untracked-files=all -- "${paths[@]}")" ]; then
          echo "::error::The Lean sources differ from Git's index, which names their caches."
          git status --short -- "${paths[@]}"
          exit 1
        fi
        SOURCES=$(git ls-files --stage -- "${paths[@]}" | sha256sum | cut -d' ' -f1)
        {
          echo "build-cache-prefix=lean-build-$PREFIX"
          echo "build-cache=lean-build-$PREFIX$SOURCES"
          echo "manifest-cache-prefix=lean-manifest-$PREFIX"
          echo "manifest-cache=lean-manifest-$PREFIX$SOURCES"
        } >> "$GITHUB_OUTPUT"
