name: Download the project's leantar
description: >
  Downloads the release of reaperhulk/leangz that `ci/leantar/release.toml`
  pins, checked against its SHA-256, into `~/.cache/verified-garbage/`
  (`ci/leantar_release.py`), where `ci/lean_cache.py` finds it: `leantar`, the
  toolchain's compressor for Lake's per-module `.ltar` archives, with a faster
  unpack (a third of the CPU time), batch packing (digama0/leangz#13: `-p -`
  packs many archives in one process, and `--level` sets the zstd level) and
  `-x --empty-private` (each module's `.olean.private` as an empty file, for
  `lean_cache.py restore --empty-private`). The toolchain's own `leantar`
  packs one archive per process, about half a CPU-second each; this one packs
  a build's 16,000 modules in seconds. Here, before anything restores, so
  that a bad download fails in its own step.

runs:
  using: composite
  steps:
    - name: Download leantar
      shell: bash
      run: |
        "$(python3 ci/leantar_release.py)" --version
