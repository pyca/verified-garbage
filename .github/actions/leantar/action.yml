name: Install the project's leantar
description: >
  Puts on PATH, as `leantar-batch`, the release of reaperhulk/leangz that
  `ci/leantar/release.toml` pins, checked against its SHA-256
  (`ci/leantar_release.py`): `leantar`, the toolchain's compressor for Lake's
  per-module `.ltar` archives, with a faster unpack (a third of the CPU time),
  batch packing (digama0/leangz#13: `-p -` packs many archives in one
  process, and `--level` sets the zstd level) and `-x --empty-private` (each
  module's `.olean.private` as an empty file, for `lean_cache.py restore
  --empty-private`). The toolchain's own `leantar` packs one archive per
  process, about half a CPU-second each; this one packs a build's 16,000
  modules in seconds. `ci/lean_cache.py` packs (`store`) and restores
  (`restore`) with it; the archives' format is unchanged, so the toolchain's
  `leantar` unpacks them too (`unpack`, outside CI).

runs:
  using: composite
  steps:
    - name: Install leantar
      shell: bash
      run: |
        python3 ci/leantar_release.py --install "$RUNNER_TEMP/leantar-batch/leantar-batch"
        echo "$RUNNER_TEMP/leantar-batch" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/leantar-batch/leantar-batch" --version
