name: Set up Lean and Mathlib
description: >
  Waits for elan (and so the toolchain `lean/lean-toolchain` names) and the
  list of modules the proofs import from outside the project, which
  `lean-prepare` starts in the background, and restores (or clones) Mathlib
  and its dependencies in `lean/.lake/packages`. It runs no Lake command;
  `lean-mathlib`, after it, makes sure Mathlib is built. Jobs run both
  through `lean-prepare`.

outputs:
  mods:
    description: The modules the proofs import from outside the project.
    value: ${{ steps.mods.outputs.mods }}
  cache-hit:
    description: Whether Mathlib and its dependencies were restored.
    value: ${{ steps.lake-packages.outputs.cache-hit }}
  cache-key:
    description: The key to save Mathlib and its dependencies under.
    value: ${{ steps.lake-packages.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - name: List the modules the proofs import from outside the project
      id: mods
      shell: bash
      run: |
        # Shows the background job's log as it is written, so a slow or
        # stuck download is visible while it happens. The job bounds every
        # step it runs; the limit here only catches a job that died without
        # writing its status.
        log="$RUNNER_TEMP/lean-setup.log"
        shown=0
        show() {
          [ -f "$log" ] || return 0
          local n
          n=$(wc -l < "$log")
          [ "$n" -gt "$shown" ] && sed -n "$((shown + 1)),${n}p" "$log"
          shown=$n
        }
        for _ in $(seq 1200); do
          show
          [ -f "$RUNNER_TEMP/lean-setup.status" ] && break
          sleep 1
        done
        show
        status=$(cat "$RUNNER_TEMP/lean-setup.status" 2>/dev/null || echo "no status")
        if [ "$status" = "no status" ]; then
          echo "Still running:"
          ps -eo pid,etime,args --forest | grep -v ' ps ' || true
        fi
        if [ "$status" != 0 ]; then
          echo "::error::Installing elan or listing the imports failed ($status)."
          exit 1
        fi
        mods=$(cat "$RUNNER_TEMP/lean-mods")
        echo "$mods"
        echo "mods=$(echo $mods)" >> "$GITHUB_OUTPUT"
        echo "hash=$(echo "$mods" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
    # Mathlib and its dependencies, with the prebuilt files for those
    # modules: they change only with the toolchain, the manifest or the
    # list, so a hit skips the clones, building Mathlib's `cache` tool and
    # the download. Archives have their own directory, index and files.tar.gz,
    # separate from the project build.
    - name: Restore Mathlib and its dependencies
      id: lake-packages
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: lean/.lake/mathlib-ltar
        key: lake-packages-ltar-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ steps.mods.outputs.hash }}
    - name: Unpack Mathlib and its dependencies
      if: ${{ steps.lake-packages.outputs.cache-hit == 'true' }}
      shell: bash
      run: python3 ci/lean_cache.py restore lean --archive-dir .lake/mathlib-ltar
    # Lake would clone mathlib4's whole history; a checkout of the pinned
    # revision is all the build needs, and Lake accepts it as is.
    - name: Shallow-clone Mathlib
      if: ${{ steps.lake-packages.outputs.cache-hit != 'true' }}
      shell: bash
      working-directory: lean
      run: |
        # A failed cache download may leave partial archives and an index.
        # Do not let the next store reuse them.
        rm -rf .lake/mathlib-ltar
        rev=$(jq -r '.packages[] | select(.name == "mathlib") | .rev' lake-manifest.json)
        git init -q .lake/packages/mathlib
        cd .lake/packages/mathlib
        git remote add origin https://github.com/leanprover-community/mathlib4
        git fetch -q --depth 1 origin "$rev"
        git checkout -q FETCH_HEAD
