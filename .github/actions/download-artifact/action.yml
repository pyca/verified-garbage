name: Download artifacts
description: >
  `actions/download-artifact`, tried up to three times, since the artifact
  service sometimes times out (see `upload-artifact`); a later attempt
  writes over whatever the failed one left. Every job downloads through
  this.

inputs:
  name:
    description: The artifact to download (or empty, with `pattern`).
    default: ""
  pattern:
    description: download-artifact's `pattern`.
    default: ""
  merge-multiple:
    description: download-artifact's, with its default.
    default: "false"
  path:
    description: Where to download to.
    required: true
  run-id:
    description: The run to download from (and then `github-token`), by default this one.
    default: ${{ github.run_id }}
  github-token:
    description: A token to download from another run with.
    default: ""

runs:
  using: composite
  steps:
    - id: first
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.name }}
        pattern: ${{ inputs.pattern }}
        merge-multiple: ${{ inputs.merge-multiple }}
        path: ${{ inputs.path }}
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}
    - if: ${{ steps.first.outcome == 'failure' }}
      shell: bash
      env:
        ARTIFACT: ${{ inputs.name }}${{ inputs.pattern }}
      run: |
        echo "::warning::Downloading $ARTIFACT failed: trying again."
        sleep 15
    - id: second
      if: ${{ steps.first.outcome == 'failure' }}
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.name }}
        pattern: ${{ inputs.pattern }}
        merge-multiple: ${{ inputs.merge-multiple }}
        path: ${{ inputs.path }}
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}
    - if: ${{ steps.second.outcome == 'failure' }}
      shell: bash
      env:
        ARTIFACT: ${{ inputs.name }}${{ inputs.pattern }}
      run: |
        echo "::warning::Downloading $ARTIFACT failed again: trying a last time."
        sleep 60
    - if: ${{ steps.second.outcome == 'failure' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.name }}
        pattern: ${{ inputs.pattern }}
        merge-multiple: ${{ inputs.merge-multiple }}
        path: ${{ inputs.path }}
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}
