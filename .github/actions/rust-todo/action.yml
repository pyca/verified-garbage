name: Decide what a Rust job does
description: >
  What a Rust job of CI has left to do after restoring its cache: test
  everything, or, on a push to main that the merge queue tested already
  (`merge-queue-run` in ci.yml), only build what main's cache lacks for it to
  save, and nothing when the cache's exact key was there.

inputs:
  tested-by:
    description: The merge queue's run that tested this commit (`merge-queue-run`'s `run-id`), or empty.
    required: true
  cache-hit:
    description: Whether Swatinem/rust-cache restored its exact key.
    required: true

outputs:
  test:
    description: Whether to run the tests (and collect coverage).
    value: ${{ steps.todo.outputs.test }}
  build:
    description: Whether to build (lint, and the tests, run or not).
    value: ${{ steps.todo.outputs.build }}

runs:
  using: composite
  steps:
    - id: todo
      shell: bash
      env:
        TESTED_BY: ${{ inputs.tested-by }}
        CACHE_HIT: ${{ inputs.cache-hit }}
      run: |
        if [ -z "$TESTED_BY" ]; then
          echo "test=true" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"
        elif [ "$CACHE_HIT" != true ]; then
          echo "The merge queue's run $TESTED_BY tested this commit: building only, for main's cache."
          echo "build=true" >> "$GITHUB_OUTPUT"
        else
          echo "The merge queue's run $TESTED_BY tested this commit, and main's cache is up to date: nothing to do."
        fi
