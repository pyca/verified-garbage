name: Find out whether a shard assembled the build
description: >
  Whether this run has a `lean-assembled-<shard>` marker, which a shard of
  `lean-shard` uploads once it has checked the whole build. It downloads the
  markers through the artifact service, as every download does
  (`download-artifact`), not by listing the run's artifacts through the REST
  API, whose rate limit for the repository's token is shared with every
  other job and run: a refused listing, read as "no marker", once failed
  `all-green` (it then assembled the build itself, and failed to download
  leantar for the same reason). A pattern that matches nothing downloads
  nothing and succeeds; a download that fails is retried, and fails the job
  if it keeps failing, so it is never taken for an absent marker.

outputs:
  assembled:
    description: "`true` if a shard assembled the build, `false` if none did."
    value: ${{ steps.found.outputs.assembled }}

runs:
  using: composite
  steps:
    - uses: ./.github/actions/download-artifact
      with:
        pattern: lean-assembled-*
        merge-multiple: true
        path: ${{ runner.temp }}/lean-assembled-markers
    - id: found
      shell: bash
      env:
        MARKERS: ${{ runner.temp }}/lean-assembled-markers
      run: |
        if [ -n "$(find "$MARKERS" -type f -print -quit 2>/dev/null)" ]; then
          cat "$MARKERS"/*
          echo "assembled=true" >> "$GITHUB_OUTPUT"
        else
          echo "No shard assembled the build."
          echo "assembled=false" >> "$GITHUB_OUTPUT"
        fi
