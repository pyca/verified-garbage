name: xts-exp
on:
  push:
    branches: [xts-exp]
permissions: {}
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        i: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: grep -m1 "model name" /proc/cpuinfo
      - run: cd exp && cargo run --release -q --bin zen3 && cargo run --release -q --bin zen3
