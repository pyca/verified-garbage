name: Checkout fetch methods experiment
on:
  push:
    branches: [bench/fetch-methods-20261107]
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Prepare benchmark
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ram"
          sudo mount -t tmpfs -o size=4G tmpfs "$GITHUB_WORKSPACE/ram"
          sudo chown "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/ram"
          uname -a
          lscpu
          git --version
          df -Th "$GITHUB_WORKSPACE/ram"
          echo '[]' > "$RUNNER_TEMP/results.json"
          cat > "$RUNNER_TEMP/compare.py" <<'PY'
          import json, os, pathlib, subprocess, sys, time, shutil
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'ram'
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          sha='1e938f5abb64510b0ff65502723915391c66e649'
          repo='https://github.com/pyca/verified-garbage.git'
          method=sys.argv[1]
          trial=int(sys.argv[2])
          dest=root/'checkout'
          def cmd(args):
              subprocess.run(args,cwd=dest,check=True,stdout=subprocess.DEVNULL)
          def git(*args): cmd(['git',*args])
          def metadata(partial=False):
              git('init','-q')
              git('config','gc.auto','0')
              git('remote','add','origin',repo)
              if partial:
                  git('config','remote.origin.promisor','true')
                  git('config','remote.origin.partialclonefilter','blob:none')
              git('-c','protocol.version=2','fetch','--quiet','--no-tags','--no-recurse-submodules','--depth=1',*(['--filter=blob:none'] if partial else []),'origin',sha)
          row=dict(method=method,trial=trial)
          if method=='action':
              row['total']=(int((temp/'end').read_text())-int((temp/'start').read_text()))/1e9
          else:
              dest.mkdir()
              start=time.perf_counter()
              if method=='direct':
                  metadata()
                  git('checkout','--quiet','--force','--detach','FETCH_HEAD')
                  row['total']=time.perf_counter()-start
              elif method=='archive':
                  archive=temp/'source.tar.gz'
                  subprocess.run(['curl','-fLsS','--retry','2',f'https://codeload.github.com/pyca/verified-garbage/tar.gz/{sha}','-o',str(archive)],check=True)
                  row['download']=time.perf_counter()-start
                  cmd(['tar','-xzf',str(archive),'--strip-components=1'])
                  row['archive_ready']=time.perf_counter()-start
                  metadata(partial=True)
                  git('update-ref','HEAD','FETCH_HEAD')
                  git('read-tree','HEAD')
                  git('update-index','--refresh')
                  row['total']=time.perf_counter()-start
                  archive.unlink()
          # Validate every method's index and working tree against the same pinned commit.
          head=subprocess.check_output(['git','rev-parse','HEAD'],cwd=dest,text=True).strip()
          assert head==sha, head
          index=subprocess.check_output(['git','ls-files','--stage','-z'],cwd=dest)
          baseline=temp/'baseline-index'
          if baseline.exists():
              assert index==baseline.read_bytes(), 'tracked index differs'
          else:
              assert method=='action'
              baseline.write_bytes(index)
          status=subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],cwd=dest)
          assert not status, status[:500]
          rows=json.loads((temp/'results.json').read_text())
          rows.append(row)
          (temp/'results.json').write_text(json.dumps(rows,indent=2))
          print(json.dumps(row),flush=True)
          shutil.rmtree(dest)
          PY
      - name: Start action trial 1
        run: date +%s%N > "$RUNNER_TEMP/start"
      - name: Action trial 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1e938f5abb64510b0ff65502723915391c66e649
          path: ram/checkout
          persist-credentials: false
      - name: Record action trial 1
        run: |
          date +%s%N > "$RUNNER_TEMP/end"
          python3 "$RUNNER_TEMP/compare.py" action 1
      - name: direct trial 1
        run: python3 "$RUNNER_TEMP/compare.py" direct 1
      - name: archive trial 1
        run: python3 "$RUNNER_TEMP/compare.py" archive 1
      - name: archive trial 2
        run: python3 "$RUNNER_TEMP/compare.py" archive 2
      - name: direct trial 2
        run: python3 "$RUNNER_TEMP/compare.py" direct 2
      - name: Start action trial 2
        run: date +%s%N > "$RUNNER_TEMP/start"
      - name: Action trial 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1e938f5abb64510b0ff65502723915391c66e649
          path: ram/checkout
          persist-credentials: false
      - name: Record action trial 2
        run: |
          date +%s%N > "$RUNNER_TEMP/end"
          python3 "$RUNNER_TEMP/compare.py" action 2
      - name: Start action trial 3
        run: date +%s%N > "$RUNNER_TEMP/start"
      - name: Action trial 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1e938f5abb64510b0ff65502723915391c66e649
          path: ram/checkout
          persist-credentials: false
      - name: Record action trial 3
        run: |
          date +%s%N > "$RUNNER_TEMP/end"
          python3 "$RUNNER_TEMP/compare.py" action 3
      - name: direct trial 3
        run: python3 "$RUNNER_TEMP/compare.py" direct 3
      - name: archive trial 3
        run: python3 "$RUNNER_TEMP/compare.py" archive 3
      - name: archive trial 4
        run: python3 "$RUNNER_TEMP/compare.py" archive 4
      - name: direct trial 4
        run: python3 "$RUNNER_TEMP/compare.py" direct 4
      - name: Start action trial 4
        run: date +%s%N > "$RUNNER_TEMP/start"
      - name: Action trial 4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1e938f5abb64510b0ff65502723915391c66e649
          path: ram/checkout
          persist-credentials: false
      - name: Record action trial 4
        run: |
          date +%s%N > "$RUNNER_TEMP/end"
          python3 "$RUNNER_TEMP/compare.py" action 4
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json, pathlib, os, statistics
          rows=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'results.json').read_text())
          lines=['| Method | Median seconds | Range |','|---|---:|---:|']
          for method in ['action','direct','archive']:
              xs=[r['total'] for r in rows if r['method']==method]
              lines.append(f'| {method} | {statistics.median(xs):.3f} | {min(xs):.3f}–{max(xs):.3f} |')
          xs=[r['archive_ready'] for r in rows if r['method']=='archive']
          lines.append(f'| archive without Git metadata | {statistics.median(xs):.3f} | {min(xs):.3f}–{max(xs):.3f} |')
          report='\n'.join(lines)
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Four alternating trials per method, all on tmpfs; pinned commit 1e938f5abb64510b0ff65502723915391c66e649. Archive total includes a blobless shallow fetch and Git index reconstruction. Every method checks identical index entries and a clean working tree. Action timer includes inter-step overhead; others use monotonic subprocess timing.\n\n'+report+'\n')
          PY
      - name: Preserve measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-methods-${{ matrix.os }}
          path: ${{ runner.temp }}/results.json
