name: Publish Lean cache

# Exports main's checked Lean build for agents that cannot restore Actions
# caches (see "Restoring the CI build cache" in lean/README.md), after CI
# passes on a push to main. A workflow of its own, not a job of CI: its
# runs serialize (CI runs on main can finish out of order), and GitHub
# cancels a waiting run when another queues, which in CI would mark a run
# that passed as cancelled. A cancelled run here only means a newer commit
# took over. A run publishes its commit's build unless the published one is
# of a newer commit: while main moves faster than a run packages the build,
# each run still replaces an older cache, rather than leaving it to a newer
# run that main will also have moved past.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Lean cache
    # Only CI's pushes to main: `branches` alone would also match a pull
    # request from a fork's `main`.
    if: >-
      ${{ github.repository == 'pyca/verified-garbage'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-26.04
    # Only the steps that talk to the registry see the token: the others run
    # third-party code (elan's installer, Mathlib's `cache` tool).
    permissions:
      contents: read
      packages: write
    env:
      GH_REPO: ${{ github.repository }}
      IMAGE: ghcr.io/pyca/vg-lean-cache:latest
      # The commit CI checked (GITHUB_SHA is main's head when this started).
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      # Bump if the archive format or compression settings change.
      CACHE_FORMAT: ltar5-oras-v5
      ORAS_VERSION: 1.3.2
      ORAS_SHA256: 9229ccc6d17bb282039ad4a69abb16dcb887a5bce567c075d731d9b3c7ad8eaf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      # The keys CI saved this commit's build under.
      - uses: ./.github/actions/lean-keys
        id: keys
      # One static binary, checked against the release's checksum.
      - name: Install oras
        run: |
          tarball="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/oras-project/oras/releases/download/v$ORAS_VERSION/$tarball"
          echo "$ORAS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oras"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/oras" oras
          echo "$RUNNER_TEMP/oras" >> "$GITHUB_PATH"
      - name: Decide whether the cache needs publishing
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ steps.keys.outputs.build-cache }}-${{ env.CACHE_FORMAT }}
        run: |
          # Read the manifest's annotations, without pulling the archive. The
          # token goes on stdin to this command alone: nothing stores it.
          if printf '%s' "$GH_TOKEN" | oras manifest fetch --username "$GITHUB_ACTOR" --password-stdin "$IMAGE" \
              > "$RUNNER_TEMP/lean-cache-manifest.json" 2> "$RUNNER_TEMP/lean-cache-fetch.log"; then
            key=$(jq -r '.annotations["io.pyca.lean.cache-key"] // empty' "$RUNNER_TEMP/lean-cache-manifest.json")
            if [ "$key" = "$CACHE_KEY" ]; then
              echo "The checked Lean cache is already published."
              exit 0
            fi
            # Never replace a newer commit's cache with this one's.
            published=$(jq -r '.annotations["org.opencontainers.image.revision"] // empty' "$RUNNER_TEMP/lean-cache-manifest.json")
            if [ -n "$published" ]; then
              status=$(gh api "repos/$GH_REPO/compare/$published...$HEAD_SHA" --jq .status)
              if [ "$status" = behind ]; then
                echo "The published Lean cache is of a newer commit, $published."
                exit 0
              fi
            fi
          else
            # A missing image is expected on the first publish. Other registry
            # errors must fail rather than hiding a broken comparison.
            if ! grep -qiE 'manifest unknown|not found' "$RUNNER_TEMP/lean-cache-fetch.log"; then
              cat "$RUNNER_TEMP/lean-cache-fetch.log" >&2
              exit 1
            fi
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"
      - name: Restore the checked module archives
        id: build
        if: ${{ steps.publish.outputs.needed == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake/ltar
          key: ${{ steps.keys.outputs.build-cache }}
      - name: Retry restoring the checked module archives
        id: build-again
        if: ${{ steps.publish.outputs.needed == 'true' && steps.build.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake/ltar
          key: ${{ steps.keys.outputs.build-cache }}
      - name: Check the checked build was restored
        id: dependencies
        if: ${{ steps.publish.outputs.needed == 'true' }}
        env:
          CACHE_HIT: ${{ steps.build.outputs.cache-hit == 'true' || steps.build-again.outputs.cache-hit == 'true' }}
        run: |
          # Never publish a fallback or an empty project build.
          [ "$CACHE_HIT" = true ] || { echo "::error::The checked build cache is missing"; exit 1; }
          if [ -f lean/.lake/ltar/mathlib-cache-key ]; then
            echo "key=$(cat lean/.lake/ltar/mathlib-cache-key)" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore the checked dependency archives
        id: mathlib
        if: ${{ steps.publish.outputs.needed == 'true' && steps.dependencies.outputs.key != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake/mathlib-ltar
          key: ${{ steps.dependencies.outputs.key }}
      # Old project caches lack the dependency key. An evicted dependency
      # cache also needs the normal setup to fetch and store it again.
      - uses: ./.github/actions/lean-prepare
        if: ${{ steps.publish.outputs.needed == 'true' && steps.mathlib.outputs.cache-hit != 'true' }}
        with:
          key: ${{ steps.keys.outputs.build-cache }}
          restore-keys: ${{ steps.keys.outputs.build-cache }}
      # The archive goes to memory: it is uploaded, then discarded.
      - name: Package the checked build and dependencies
        if: ${{ steps.publish.outputs.needed == 'true' }}
        run: |
          set -o pipefail
          mkdir -p /dev/shm/lean-cache-image
          python3 ci/lean_cache.py bundle lean .lake/ltar .lake/mathlib-ltar \
            | zstd -T0 -5 -o /dev/shm/lean-cache-image/lean-cache.tar.zst
      - name: Upload the cache image
        id: upload
        if: ${{ steps.publish.outputs.needed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ steps.keys.outputs.build-cache }}-${{ env.CACHE_FORMAT }}
        run: |
          # Runs hold the workflow's lock from the decision to here, so no
          # newer cache was published since.
          # The archive is the one layer, as it is: the README's restore
          # streams it from the registry API into
          # `zstd -dc | ci/lean_cache.py unpack`.
          toolchain=$(cat lean/lean-toolchain)
          cd /dev/shm/lean-cache-image
          printf '%s' "$GH_TOKEN" | oras push --username "$GITHUB_ACTOR" --password-stdin \
            --artifact-type application/vnd.pyca.lean-cache.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/$GH_REPO" \
            --annotation "org.opencontainers.image.revision=$HEAD_SHA" \
            --annotation "io.pyca.lean.toolchain=$toolchain" \
            --annotation "io.pyca.lean.cache-key=$CACHE_KEY" \
            "$IMAGE" lean-cache.tar.zst:application/vnd.oci.image.layer.v1.tar+zstd
          echo "published=true" >> "$GITHUB_OUTPUT"
      # Only `latest` is published, so replacing it leaves old images untagged.
      - name: Delete old cache versions
        if: ${{ steps.upload.outputs.published == 'true' }}
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          owner: pyca
          package-name: vg-lean-cache
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: 'true'
