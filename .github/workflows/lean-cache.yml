name: Publish Lean cache

# Exports main's checked Lean build for agents that cannot restore Actions
# caches (see "Restoring the CI build cache" in lean/README.md), after CI
# passes on a push to main. A workflow of its own, not a job of CI: its
# runs serialize (CI runs on main can finish out of order), and GitHub
# cancels a waiting run when another queues, which in CI would mark a run
# that passed as cancelled. A cancelled run here only means a newer commit
# took over; each run also skips a commit main has moved past.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Lean cache
    # Only CI's pushes to main: `branches` alone would also match a pull
    # request from a fork's `main`.
    if: >-
      ${{ github.repository == 'pyca/verified-garbage'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    # Only the steps that talk to the registry see the token: the others run
    # third-party code (elan's installer, Mathlib's `cache` tool).
    permissions:
      contents: read
      packages: write
    env:
      GH_REPO: ${{ github.repository }}
      IMAGE: ghcr.io/pyca/vg-lean-cache:latest
      # The commit CI checked (GITHUB_SHA is main's head when this started).
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      # Bump if the archive format or compression settings change.
      CACHE_FORMAT: zstd5-v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      # The keys CI saved this commit's build under.
      - uses: ./.github/actions/lean-keys
        id: keys
      - name: Decide whether the cache needs publishing
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ steps.keys.outputs.build-cache }}-${{ env.CACHE_FORMAT }}
        run: |
          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "Main has advanced: its newer run will publish the cache."
            exit 0
          fi
          # Log out on every exit, so later steps find no stored credential.
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          # Read the registry's small image config, without pulling any layers.
          if docker buildx imagetools inspect "$IMAGE" --format '{{json .Image.Config.Labels}}' \
              > "$RUNNER_TEMP/lean-cache-labels.json" 2> "$RUNNER_TEMP/lean-cache-inspect.log"; then
            key=$(jq -r '.["io.pyca.lean.cache-key"] // empty' "$RUNNER_TEMP/lean-cache-labels.json")
            if [ "$key" = "$CACHE_KEY" ]; then
              echo "The checked Lean cache is already published."
              exit 0
            fi
          else
            # A missing image is expected on the first publish. Other registry
            # errors must fail rather than hiding a broken comparison.
            if ! grep -qiE 'manifest unknown|not found' "$RUNNER_TEMP/lean-cache-inspect.log"; then
              cat "$RUNNER_TEMP/lean-cache-inspect.log" >&2
              exit 1
            fi
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/lean-prepare
        id: prepare
        if: ${{ steps.publish.outputs.needed == 'true' }}
        with:
          key: ${{ steps.keys.outputs.build-cache }}
          restore-keys: ${{ steps.keys.outputs.build-cache }}
      - name: Package the checked build and dependencies
        if: ${{ steps.publish.outputs.needed == 'true' }}
        env:
          CACHE_HIT: ${{ steps.prepare.outputs.cache-hit }}
        run: |
          # Never publish a fallback or an empty project build.
          [ "$CACHE_HIT" = true ] || { echo "::error::The checked build cache is missing"; exit 1; }
          mkdir -p "$RUNNER_TEMP/lean-cache-image"
          tar -C lean -cf - .lake/build .lake/packages \
            | zstd -T0 -5 -o "$RUNNER_TEMP/lean-cache-image/lean-cache.tar.zst"
      - name: Upload the cache image
        id: upload
        if: ${{ steps.publish.outputs.needed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ steps.keys.outputs.build-cache }}-${{ env.CACHE_FORMAT }}
        run: |
          # Check immediately before publishing, while holding the workflow's lock.
          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "Main has advanced: its newer run will publish the cache."
            exit 0
          fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          # One plain manifest: with attestations, the push would be an index
          # whose untagged children the cleanup below would delete.
          docker build -f ci/lean-cache.Dockerfile --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=https://github.com/$GH_REPO" \
            --label "org.opencontainers.image.revision=$HEAD_SHA" \
            --label "io.pyca.lean.toolchain=$(cat lean/lean-toolchain)" \
            --label "io.pyca.lean.cache-key=$CACHE_KEY" \
            -t "$IMAGE" "$RUNNER_TEMP/lean-cache-image"
          docker push "$IMAGE"
          echo "published=true" >> "$GITHUB_OUTPUT"
      # Only `latest` is published, so replacing it leaves old images untagged.
      - name: Delete old cache versions
        if: ${{ steps.upload.outputs.published == 'true' }}
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          owner: pyca
          package-name: vg-lean-cache
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: 'true'
