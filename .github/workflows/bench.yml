name: Benchmarks
# Experiment branch only (never merged): times Montgomery-reduction variants
# of vg_rsa_mont_mul_adx on the x86-64 runners.
on:
  workflow_dispatch:
    inputs:
      base_commit: {required: false}
      arches: {required: false}
      cpu_features: {required: false}
      modules: {required: false}
permissions:
  contents: read
jobs:
  exp:
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cd exp-bench && cargo build --release -q
      - run: cd exp-bench && grep -m1 "model name" /proc/cpuinfo && ./target/release/exp > /dev/null && ./target/release/exp | grep -E "^w=|ghz"
      - run: |
          F=$(for f in avx avx2 avx512f bmi1 bmi2 adx; do grep -qw $f /proc/cpuinfo && printf "%s," $f; done | sed "s/,$//")
          cd op-bench && cargo build --release -q && cp target/release/op-bench /tmp/op_w5
          cp ../src/asm/x86_64/rsa.rs /tmp/rsa_w5.rs && cp rsa_base.rs ../src/asm/x86_64/rsa.rs && cargo build --release -q && cp target/release/op-bench /tmp/op_base && cp /tmp/rsa_w5.rs ../src/asm/x86_64/rsa.rs
          for i in 1 2 3; do VG_CPU_FEATURES=$F OPENSSL_ia32cap="~0x0:~0x200000" /tmp/op_base | sed 's/^/op base /'; VG_CPU_FEATURES=$F OPENSSL_ia32cap="~0x0:~0x200000" /tmp/op_w5 | sed 's/^/op w5 /'; done
