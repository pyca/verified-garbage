# Scratch branch only (never merged): times the Montgomery prototypes in
# ci/proto on the ARMv7 benchmark runners, in the same container and runners
# as bench.yml's `arm` jobs (ci/bench_arches.py's PLATFORMS["arm"]).
name: Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proto:
    strategy:
      fail-fast: false
      matrix:
        mode: [marm, mthumb]
        sample: [1, 2, 3]
    name: Montgomery prototypes (${{ matrix.mode }}, sample ${{ matrix.sample }})
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    container:
      image: ghcr.io/pyca/verified-garbage-runner:armv7-cross
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ci/proto
      - name: Record the CPU
        run: |
          python3 -c 'from pathlib import Path; print(Path("/proc/cpuinfo").read_text().split("\n\n", 1)[0])' | tee cpu.txt
      - name: Build
        env:
          MODE: ${{ matrix.mode }}
        run: |
          arm-linux-gnueabihf-gcc --version | head -1
          arm-linux-gnueabihf-gcc -O2 -march=armv7-a -mfpu=neon -mfloat-abi=hard "-$MODE" \
            -o proto ci/proto/mont_proto.c ci/proto/mont_kernels.S
      - name: Run
        env:
          MODE: ${{ matrix.mode }}
        run: |
          /usr/local/bin/arm32-run ./proto 1.0 > out.txt 2> err.txt || { cat out.txt err.txt; exit 1; }
          cat err.txt out.txt
          {
            echo "### $MODE: $(grep -m1 'CPU part' cpu.txt)"
            if grep -q qemu err.txt; then echo "**Under QEMU (no AArch32): timings meaningless**"; fi
            echo '```'
            cat out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
