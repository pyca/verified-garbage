name: Unproven compact i686 Montgomery screening
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/pyca/verified-garbage-runner:i686
      options: --platform linux/386 --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compare compact loops with 3027 and OpenSSL
        shell: bash
        run: |
          gcc --version
          openssl version -a
          python3 -c 'from pathlib import Path; print(Path("/proc/cpuinfo").read_text().split("\n\n", 1)[0])'
          gcc -O3 -Wall -Wextra -DOPENSSL_REF ci/prototypes/compact-screen.c ci/prototypes/compact-mont.S -lcrypto -o compact-screen
          nm -n compact-screen | sed -n '/compact_mont/p'
          ./compact-screen | tee compact-results.txt
          cat compact-results.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/upload-artifact
        if: always()
        with:
          name: compact-montgomery-screen
          path: compact-results.txt
