name: Benchmarks

# Compares the performance of a pull request with its base, on each
# architecture whose code it changes (see ci/bench_arches.py), and fails if a
# benchmark slowed down by more than ci/bench_compare.py's threshold. The
# results are in the run's summary. Not part of `all-green`: it only runs for
# some pull requests. A pull request never runs every benchmark of an
# architecture (e.g. for a change to Cargo.lock or to the benchmarks' shared
# code): the run's summary names those architectures, to run by hand.
#
# It can also be run by hand (Actions > Benchmarks > Run workflow), comparing
# the chosen branch with any earlier commit on every architecture, e.g. to
# measure the total speedup of a series of pull requests; or, with no
# commit, measuring the chosen branch alone, next to OpenSSL and aws-lc-rs.
# A targeted run can name the architectures, the `VG_CPU_FEATURES`
# configurations and the library modules to run (`python3 ci/bench_arches.py
# --choices` lists them), e.g. from the command line:
#
#   gh workflow run bench.yml --ref BRANCH -f base_commit=SHA \
#     -f arches=aarch64 -f cpu_features='- neon' -f modules=chacha20
on:
  pull_request:
    paths:
      - "src/**"
      - "bench/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "ci/bench_compare.py"
      - "ci/bench_arches.py"
      - ".github/workflows/bench.yml"
  workflow_dispatch:
    inputs:
      base_commit:
        description: The commit to compare against (empty to run the branch alone, next to OpenSSL and aws-lc-rs)
        required: false
      arches:
        description: Space-separated architectures to run (x86_64 aarch64 x86 arm, or aarch64-apple, which only a run by hand measures; empty for all but aarch64-apple)
        required: false
      cpu_features:
        description: Space-separated VG_CPU_FEATURES configurations to run on each, `-` for none (empty for those that choose among the modules' implementations; `python3 ci/bench_arches.py --choices` lists them)
        required: false
      modules:
        description: Space-separated library modules whose benchmarks run, e.g. `chacha20 poly1305` (empty for every benchmark; `python3 ci/bench_arches.py --choices` lists them)
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  arches:
    name: Choose architectures
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.arches.outputs.matrix }}
      base: ${{ steps.arches.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's checkout is its merge with the base branch's
          # current tip, which is the merge's first parent.
          fetch-depth: 2
          persist-credentials: false
      - id: arches
        env:
          BASE_COMMIT: ${{ inputs.base_commit }}
          ARCHES: ${{ inputs.arches }}
          CPU_FEATURES: ${{ inputs.cpu_features }}
          MODULES: ${{ inputs.modules }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            base=$BASE_COMMIT
            matrix=$(python3 ci/bench_arches.py --all --arches "$ARCHES" --cpu-features "$CPU_FEATURES" --modules "$MODULES")
          else
            # Not `pull_request.base.sha`: it can be an older commit of the
            # base branch, whose later changes would then count as the pull
            # request's (selecting every benchmark) and be measured as such.
            base=$(git rev-parse HEAD^1)
            matrix=$(git diff --name-only "$base" HEAD | python3 ci/bench_arches.py --base "$base" 2> skipped.txt) \
              || { cat skipped.txt >&2; exit 1; }
            if [ -s skipped.txt ]; then
              echo "::notice title=Benchmarks not run::$(cat skipped.txt)"
              { echo "## Benchmarks not run"; echo; cat skipped.txt; } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

  compare:
    needs: arches
    if: ${{ needs.arches.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.arches.outputs.matrix) }}
    name: Compare with base (${{ matrix.arch }}${{ matrix.cpu-features && format(', VG_CPU_FEATURES={0}', matrix.cpu-features) || '' }}${{ matrix.shard && format(', shard {0}', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    # Running every benchmark took 25-30 minutes on every runner with 3
    # rounds; with 2, about 20-25, until the x86-64 configurations outgrew
    # the timeout. One round with a shorter warm-up and measurement, and no
    # OpenSSL or aws-lc-rs reference on pull requests (bench_compare.py), take
    # about half, until running P-521's groups from fresh copies took some
    # x86-64 configurations past it again, and AES-GCM's from copies did once
    # more: BENCHMARKS_PER_JOB (ci/bench_arches.py) splits a run of every
    # benchmark into shards.
    timeout-minutes: 30
    # With an empty image the job runs directly on the runner.
    container:
      image: ${{ matrix.image || '' }}
      options: ${{ matrix.options || '' }}
    env:
      # Selects the toolchain without `rustup default`, which refuses 32-bit
      # toolchains on a 64-bit kernel.
      RUSTUP_TOOLCHAIN: stable
      # Restricts the CPU features the library uses, to benchmark other
      # implementations (see ci/bench_arches.py); empty restricts nothing.
      VG_CPU_FEATURES: ${{ matrix.cpu-features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.arches.outputs.base }}
        with:
          ref: ${{ needs.arches.outputs.base }}
          path: base
          persist-credentials: false
      - name: Record CPU and OpenSSL capabilities
        run: |
          openssl version -a
          if [ -r /proc/cpuinfo ]; then
            python3 -c 'from pathlib import Path; print(Path("/proc/cpuinfo").read_text().split("\n\n", 1)[0])'
          else
            sysctl -n machdep.cpu.brand_string hw.optional.arm
          fi
      - name: Install Rust
        # ci.yml's `rust` job lints the benchmarks, once per architecture.
        run: rustup toolchain install stable --profile minimal
      # The dependencies (aws-lc-sys, criterion, ...) are the same for every
      # configuration and shard of an architecture, and about a third of the
      # job; ci.yml's `rust` job saves them on main whenever the key changes.
      - id: cache-key
        run: echo "key=$(sh head/ci/bench_cache_key.sh head/bench)" >> "$GITHUB_OUTPUT"
      - name: Restore the dependencies' build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench-target
          key: ${{ steps.cache-key.outputs.key }}
      - name: Profile SHA-512 (measurement only)
        run: |
          set -x
          lscpu || true
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq linux-tools-common linux-tools-generic "linux-tools-$(uname -r)" || true
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1)
          [ -n "$PERF" ] || PERF=perf
          sudo sysctl -w kernel.perf_event_paranoid=-1 || true
          sudo sysctl -w kernel.kptr_restrict=0 || true
          $PERF stat -e cycles,instructions true || true
          $PERF list 2>/dev/null | grep -iE "dispatch|stall|retired_ops|ex_ret|uops|port" | head -80 || true
          cd head/bench
          CARGO_TARGET_DIR=$GITHUB_WORKSPACE/t cargo bench --no-run
          BIN=$(ls -t $GITHUB_WORKSPACE/t/release/deps/primitives-* | grep -v '[.]d$' | head -1)
          for lib in verified-garbage openssl aws-lc-rs; do
            VG_BENCH_MODULES=sha512 $BIN --bench --noplot --warm-up-time 2 --measurement-time 6 "^sha(384|512)/$lib/" 2>&1 | grep -E "^sha|time:" || true
          done
          for lib in verified-garbage openssl aws-lc-rs; do
            for size in 16384 64; do
              echo "=== record $lib sha512/$size"
              VG_BENCH_MODULES=sha512 $PERF record -F 20000 -o perf-$lib-$size.data -e cpu-clock -- $BIN --bench --profile-time 8 "^sha512/$lib/$size\$" >/dev/null 2>&1 || true
              $PERF report -i perf-$lib-$size.data --stdio --sort dso,symbol 2>/dev/null | grep -E "^ +[0-9]" | head -20 || true
            done
            SYM=$($PERF report -i perf-$lib-16384.data --stdio --sort symbol 2>/dev/null | grep -E "^ +[0-9]" | head -1 | awk '{print $NF}')
            echo "=== annotate $lib $SYM"
            $PERF annotate -i perf-$lib-16384.data --stdio -s "$SYM" 2>/dev/null > ann-$lib.txt || true
            wc -l ann-$lib.txt
            grep -E "^ +[0-9]+[.][0-9]+ +:" ann-$lib.txt | sort -rn | head -60 || true
            echo "--- full annotate $lib"
            cat ann-$lib.txt | head -2500 || true
          done
