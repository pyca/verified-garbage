name: PPC64LE SHA-256 kernel experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04-ppc64le
    timeout-minutes: 10
    container:
      image: ghcr.io/pyca/verified-garbage-runner:ppc64le
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 ci/sha256_table_kernel/run.py
      - uses: ./.github/actions/upload-artifact
        with:
          name: sha256-table-kernel-samples
          path: sha256-table-kernel-samples.json
          retention-days: 7
