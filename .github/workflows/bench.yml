name: Benchmarks
on: workflow_dispatch
permissions:
  contents: read
jobs:
  public-split-seal:
    runs-on: ubuntu-24.04-ppc64le
    container: ghcr.io/pyca/verified-garbage-runner:ppc64le
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Machine and compilers
        run: |
          uname -a
          lscpu
          openssl version -a
          echo "$GITHUB_SHA"
      - name: Build public Rust API sampler
        run: |
          rustup toolchain install stable --profile minimal
          rustc +stable -Vv
          cargo +stable build --release --manifest-path experiments/gcm-public-split/Cargo.toml
      - name: Interleaved public API timings with reused keys
        run: |
          cd experiments/gcm-public-split
          for copy in 1 2 3 4 5 6 7 8; do
            cp target/release/gcm-public-split-probe "probe-$copy"
            "./probe-$copy" > "samples-$copy.csv"
          done
          python3 - <<'REPORT'
          import csv,statistics
          from pathlib import Path
          out={}
          for p in Path('.').glob('samples-*.csv'):
            rows={}
            for r in csv.reader(p.open()):
              if r[0].startswith('#'): continue
              bits,n,s,v,ns=r
              rows.setdefault((int(bits),int(n),int(v)),[]).append(float(ns))
            for k,vs in rows.items():out.setdefault(k,[]).append(statistics.median(vs))
          for (bits,n,v),vs in sorted(out.items()):
            print(f'AES={bits} payload={n} variant={v} median_ns={statistics.median(vs):.3f} min_copy={min(vs):.3f} max_copy={max(vs):.3f} copy_medians={vs}')
          REPORT
      - uses: ./.github/actions/upload-artifact
        if: always()
        with:
          name: public-split-seal-samples
          path: |
            experiments/gcm-public-split/samples-*.csv
            experiments/gcm-public-split/Cargo.lock
          retention-days: 7
