name: Benchmarks
on: workflow_dispatch
permissions:
  contents: read
jobs:
  perm-kara-seal-probe:
    runs-on: ubuntu-24.04-ppc64le
    container: ghcr.io/pyca/verified-garbage-runner:ppc64le
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Machine and compiler
        run: |
          uname -a
          lscpu
          cc --version
          openssl version -a
          echo "$GITHUB_SHA"
      - name: Build and verify complete seals
        run: |
          cd experiments/gcm-seal-perm-kara
          cc -DWITH_OPENSSL -O3 -mcpu=power8 gcm-seal-perm-kara.c -x assembler-with-cpp gcm-seal-perm-kara.s -x none -lcrypto -o probe
          ./probe < gcm-seal-perm-kara-input.bin > actual.bin
          python3 - <<'CHECK'
          from pathlib import Path
          actual=Path('actual.bin').read_bytes();expected=Path('gcm-seal-perm-kara-expected.bin').read_bytes()
          assert actual==expected
          print('54 full-seal Spec cases x 3 variants pass')
          CHECK
      - name: Interleaved native timings with reused keys
        run: |
          cd experiments/gcm-seal-perm-kara
          for copy in 1 2 3 4 5 6 7 8; do
            cp probe "probe-$copy"
            "./probe-$copy" bench > "samples-$copy.csv"
          done
          python3 - <<'REPORT'
          import csv,statistics
          from pathlib import Path
          out={}
          for p in Path('.').glob('samples-*.csv'):
            rows={}
            for row in csv.reader(p.open()):
              if row[0].startswith('#'): continue
              nr,n,s,v,ns=row
              rows.setdefault((int(nr),int(n),int(v)),[]).append(float(ns))
            for k,vs in rows.items(): out.setdefault(k,[]).append(statistics.median(vs))
          print('Variants: 0 current-fused/inplace, 1 two-mask-vperm/inplace, 2 three-multiply-karatsuba/inplace, 3 OpenSSL/inplace, 4 current-fused/copy, 5 two-mask-vperm/copy, 6 three-multiply-karatsuba/copy, 7 OpenSSL/out-of-place')
          for nr,n,v in sorted(out):
            vs=out[nr,n,v]
            print(f'Nr={nr}, bytes={n}, variant={v}, median_ns={statistics.median(vs):.3f}, fastest_copy_ns={min(vs):.3f}, copy_medians={vs}')
          REPORT
      - uses: ./.github/actions/upload-artifact
        with:
          name: gcm-seal-perm-kara-samples
          path: experiments/gcm-seal-perm-kara/samples-*.csv
          retention-days: 7
