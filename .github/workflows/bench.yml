name: GHASH verified emission
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emit:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/lean-keys
        id: keys
      - uses: ./.github/actions/lean-prepare
        with:
          key: ${{ steps.keys.outputs.build-cache }}
          restore-keys: ${{ steps.keys.outputs.build-cache-prefix }}
      - name: Verify and emit
        working-directory: lean
        run: |
          sudo sysctl -w vm.max_map_count=262144
          lake build --log-level=warning
          lake env lean --run Emit.lean
          lake env lean --run Emit.lean --check
      - name: Package emitted crate
        run: tar -czf /tmp/ghash-fold-emitted.tar.gz crates/verified-garbage-asm-powerpc64le/asm
      - uses: ./.github/actions/upload-artifact
        with:
          name: ghash-fold-emitted
          path: /tmp/ghash-fold-emitted.tar.gz
          retention-days: 7
