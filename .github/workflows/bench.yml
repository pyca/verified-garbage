name: Unproven x86 DSA experiments
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototypes:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    container:
      image: ghcr.io/pyca/verified-garbage-runner:i686
      options: --platform linux/386 --security-opt seccomp=unconfined
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - id: cache-key
        run: echo "key=$(sh ci/bench_cache_key.sh bench)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: bench-target
          key: ${{ steps.cache-key.outputs.key }}
      - run: python3 experiments/dsa_x86/run.py baseline dwpr4 dwpr0 dwprt4 dwprst4 dwprsct4
        env:
          PROTOTYPE_PARAMETERS: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: unproven-dsa-results
          path: |
            prototype-results/*.log
            prototype-results/*.md
            prototype-results/*.json
            prototype-results/*.txt
            prototype-results/criterion/**/new/estimates.json
            prototype-results/parameters/**/new/estimates.json
