name: Benchmarks
on: workflow_dispatch
permissions:
  contents: read
jobs:
  ghash-probe:
    runs-on: ubuntu-24.04-ppc64le
    container: ghcr.io/pyca/verified-garbage-runner:ppc64le
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Machine and compiler
        run: |
          uname -a
          lscpu
          cc --version
          git rev-parse HEAD
      - name: Build and verify
        run: |
          cd experiments/ghash-fold
          cc -O3 -mcpu=power8 ghash-fold.c ghash-fold.s -o probe
          ./probe < gh-power-probe-input.bin > actual.bin
          python3 - <<'PY'
          from pathlib import Path
          import struct
          inp=Path('gh-power-probe-input.bin').read_bytes();exp=Path('gh-power-probe-expected.bin').read_bytes();actual=Path('actual.bin').read_bytes()
          want=b''.join(exp[i:i+16]*3 for i in range(0,len(exp),16))
          assert actual==want
          print(f'{len(exp)//16} Spec-derived cases x 3 kernels pass')
          PY
      - name: Interleaved native timings
        run: |
          cd experiments/ghash-fold
          for copy in 1 2 3 4 5 6 7 8; do
            cp probe "probe-$copy"
            "./probe-$copy" bench > "samples-$copy.csv"
          done
          python3 - <<'PY'
          import csv,statistics
          from pathlib import Path
          out={}
          for p in Path('.').glob('samples-*.csv'):
            rows={}
            for n,s,v,ns in csv.reader(p.open()): rows.setdefault((int(n),int(v)),[]).append(float(ns))
            for k,vs in rows.items(): out.setdefault(k,[]).append(statistics.median(vs))
          for n,v in sorted(out):
            print(f'bytes={n*16}, variant={v}, ns={min(out[n,v]):.3f}, copy medians={out[n,v]}')
          PY
      - uses: ./.github/actions/upload-artifact
        with:
          name: ghash-fold-samples
          path: experiments/ghash-fold/samples-*.csv
          retention-days: 7
