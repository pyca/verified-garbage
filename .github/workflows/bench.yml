name: Benchmarks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: POWER8 instructions on native PPC64LE
    runs-on: ubuntu-24.04-ppc64le
    container:
      image: ghcr.io/pyca/verified-garbage-runner:ppc64le
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 ci/power8_instruction_probe.py
