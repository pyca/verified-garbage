name: Benchmarks
# Experiment branch only (never merged): times Montgomery-reduction variants
# of vg_rsa_mont_mul_adx on the x86-64 runners.
on:
  workflow_dispatch:
    inputs:
      base_commit: {required: false}
      arches: {required: false}
      cpu_features: {required: false}
      modules: {required: false}
permissions:
  contents: read
jobs:
  exp:
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: grep -m1 "model name" /proc/cpuinfo; nproc
      - run: cd exp-bench && cargo build --release -q
      - run: cd exp-bench && grep -m1 "model name" /proc/cpuinfo >> $GITHUB_STEP_SUMMARY && ./target/release/exp > /dev/null && ./target/release/exp | tee -a out.txt && sed 's/^/    /' out.txt >> $GITHUB_STEP_SUMMARY
