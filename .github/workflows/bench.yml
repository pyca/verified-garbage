name: Benchmarks
on: workflow_dispatch
permissions:
  contents: read
jobs:
  counter-probe:
    runs-on: ubuntu-24.04-ppc64le
    container: ghcr.io/pyca/verified-garbage-runner:ppc64le
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Machine and compiler
        run: |
          uname -a
          lscpu
          cc --version
          echo "$GITHUB_SHA"
      - name: Build and verify
        run: |
          cd experiments/aes-ctr16-reuse
          cc -O3 -mcpu=power8 aes-ctr-reuse.c aes-ctr-wide.s aes-ctr-reuse.s -o probe
          ./probe < aes-power-probe-input.bin > actual.bin
          python3 - <<'PY'
          from pathlib import Path
          import struct
          inp=Path('aes-power-probe-input.bin').read_bytes();exp=Path('aes-power-probe-expected.bin').read_bytes();actual=Path('actual.bin').read_bytes()
          i=e=a=0;cases=0
          while i<len(inp):
            n,nr=struct.unpack_from('<QQ',inp,i);i+=16+240+16+16*n
            want=exp[e:e+16]+exp[e+16+32*n:e+16+48*n];e+=16+48*n
            for variant in range(3):
              assert actual[a:a+len(want)]==want,(cases,variant)
              a+=len(want)
            cases+=1
          assert a==len(actual) and e==len(exp)
          print(f'{cases} Spec-derived cases x 3 kernels pass')
          PY
      - name: Interleaved native timings
        run: |
          cd experiments/aes-ctr16-reuse
          for copy in 1 2 3 4 5 6 7 8; do
            cp probe "probe-$copy"
            "./probe-$copy" bench > "samples-$copy.csv"
          done
          python3 - <<'PY'
          import csv,statistics
          from pathlib import Path
          out={}
          for p in Path('.').glob('samples-*.csv'):
            rows={}
            for nr,n,s,v,ns in csv.reader(p.open()): rows.setdefault((int(nr),int(n),int(v)),[]).append(float(ns))
            for k,vs in rows.items(): out.setdefault(k,[]).append(statistics.median(vs))
          for nr,n,v in sorted(out):
            print(f'Nr={nr}, bytes={n*16}, variant={v}, ns={min(out[nr,n,v]):.3f}, copy medians={out[nr,n,v]}')
          PY
      - uses: ./.github/actions/upload-artifact
        with:
          name: aes-ctr16-reuse-samples
          path: experiments/aes-ctr16-reuse/samples-*.csv
          retention-days: 7
