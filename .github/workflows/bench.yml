name: Benchmarks
on: workflow_dispatch
permissions:
  contents: read
jobs:
  fused-probe:
    runs-on: ubuntu-24.04-ppc64le
    container: ghcr.io/pyca/verified-garbage-runner:ppc64le
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Machine and compiler
        run: |
          uname -a
          lscpu
          cc --version
          echo "$GITHUB_SHA"
      - name: Build and verify
        run: |
          cd experiments/gcm-folded-wide
          cc -O3 -mcpu=power8 gcm-folded-wide.c aes-ctr-wide.s ghash-fold.s gcm-folded-wide.s -o probe
          ./probe < gcm-folded-wide-input.bin > actual.bin
          python3 - <<'PY'
          from pathlib import Path
          actual=Path('actual.bin').read_bytes();expected=Path('gcm-folded-wide-expected.bin').read_bytes()
          assert actual==expected
          print('9 Spec-derived cases x 3 kernels pass')
          PY
      - name: Interleaved native timings
        run: |
          cd experiments/gcm-folded-wide
          for copy in 1 2 3 4 5 6 7 8; do
            cp probe "probe-$copy"
            "./probe-$copy" bench > "samples-$copy.csv"
          done
          python3 - <<'PY'
          import csv,statistics
          from pathlib import Path
          out={}
          for p in Path('.').glob('samples-*.csv'):
            rows={}
            for nr,n,s,v,ns in csv.reader(p.open()): rows.setdefault((int(nr),int(n),int(v)),[]).append(float(ns))
            for k,vs in rows.items(): out.setdefault(k,[]).append(statistics.median(vs))
          for nr,n,v in sorted(out):
            print(f'Nr={nr}, bytes={n*16}, variant={v}, ns={min(out[nr,n,v]):.3f}, copy medians={out[nr,n,v]}')
          PY
      - uses: ./.github/actions/upload-artifact
        with:
          name: gcm-folded-wide-samples
          path: experiments/gcm-folded-wide/samples-*.csv
          retention-days: 7
