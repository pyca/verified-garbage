name: Verified static square and GCD Rust API measurement
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    container:
      image: ghcr.io/pyca/verified-garbage-runner:i686
      options: --platform linux/386 --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: head
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1043b94af7ee892919f5aaf9020956698bb6455f
          path: base
          persist-credentials: false
      - name: Measure real Rust API, paired with merged 2987 and OpenSSL
        run: |
          rustc -vV
          openssl version -a
          python3 head/ci/prototypes/core-api.py | tee api-results.txt
          cat api-results.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: ./head/.github/actions/upload-artifact
        if: always()
        with:
          name: verified-static-core-api-results
          path: |
            api-results.txt
            api-results
