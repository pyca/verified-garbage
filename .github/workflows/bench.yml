name: Benchmarks
# Experiment branch only (never merged): times Montgomery-reduction variants
# of vg_rsa_mont_mul_adx on the x86-64 runners.
on:
  workflow_dispatch:
    inputs:
      base_commit: {required: false}
      arches: {required: false}
      cpu_features: {required: false}
      modules: {required: false}
permissions:
  contents: read
jobs:
  op:
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cd op-bench && cargo build --release -q
      - run: |
          cd op-bench
          F=$(grep -m1 "^flags" /proc/cpuinfo)
          M=$(for f in ssse3 sha_ni aes pclmulqdq avx avx2 bmi1 bmi2 avx512f adx avx512vl vaes vpclmulqdq avx512bw; do case " $F " in *" $f "*) echo -n "${f/sha_ni/sha},";; esac; done)
          M=${M%,}
          grep -m1 "model name" /proc/cpuinfo >> $GITHUB_STEP_SUMMARY
          { echo "    masked (no IFMA)"; VG_CPU_FEATURES=$M OPENSSL_ia32cap="~0x0:~0x200000" ./target/release/op-bench | sed 's/^/    /'; } | tee -a $GITHUB_STEP_SUMMARY
