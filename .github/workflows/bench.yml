name: Unproven RSA algorithm screening
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    container:
      image: ghcr.io/pyca/verified-garbage-runner:i686
      options: --platform linux/386 --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: C2SP/wycheproof
          path: wycheproof
          persist-credentials: false
      - name: Record environment and screen unproven algorithms
        run: |
          uname -a
          gcc --version
          openssl version -a
          python3 -c 'from pathlib import Path; print(Path("/proc/cpuinfo").read_text().split("\n\n", 1)[0])'
          mkdir keys
          python3 - <<'PY'
          import json,pathlib
          for bits in [2048,3072,4096]:
              data=json.loads(pathlib.Path(f'wycheproof/testvectors_v1/rsa_oaep_{bits}_sha256_mgf1sha256_test.json').read_text())
              key=data['testGroups'][0]['privateKey']
              pathlib.Path(f'keys/key{bits}.txt').write_text('\n'.join(bytes.fromhex(key[f]).lstrip(b'\0').hex() for f in ['modulus','publicExponent','privateExponent']))
          PY
          gcc -O3 -Wall -Wextra ci/prototypes/rsa_recovery.c -lcrypto -o prototype
          file prototype
          for round in 1 2 3; do
            echo "ROUND $round"
            ./prototype keys
          done | tee prototype-results.txt
          cat prototype-results.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/upload-artifact
        with:
          name: unproven-rsa-prototypes
          path: prototype-results.txt
