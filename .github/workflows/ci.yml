name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

# Only pull requests share a group, so a new push to a PR cancels its stale
# run. Runs on main and in the merge queue each get their own group: they're
# never cancelled, and must not queue behind (or replace a pending) earlier run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Whether the Rust jobs run their tests. A push to main is the commit the
  # merge queue tested (see the `lean` job's `reuse`): its Rust jobs only
  # build, for main's caches, which only main saves.
  TESTS: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  # Plans the Lean build: when it needs shards (see ci/lean_shards.py), it
  # stops there, and they build in parallel; otherwise (or when a push to
  # main reuses the merge queue's outputs) it builds on this runner, rather
  # than queue for another.
  lean:
    name: "Lean: plan and build"
    # More independent files, with two compiler threads per file (lakefile.toml).
    env:
      LEAN_NUM_THREADS: "6"
    runs-on: ubuntu-26.04
    # To find the merge queue's run of this commit, and download its outputs.
    permissions:
      actions: read
      contents: read
    outputs:
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
      build-key: ${{ steps.plan.outputs.build-key }}
      reuse: ${{ steps.reuse.outputs.run-id }}
      # The caches' keys, for every job that restores them.
      build-cache: ${{ steps.keys.outputs.build-cache }}
      build-cache-prefix: ${{ steps.keys.outputs.build-cache-prefix }}
      manifest-cache: ${{ steps.keys.outputs.manifest-cache }}
      manifest-cache-prefix: ${{ steps.keys.outputs.manifest-cache-prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/runner-info
      # The keys of the caches of the build and of its manifest.
      - uses: ./.github/actions/lean-keys
        id: keys
      # GitHub moves main to exactly the commit its merge queue tested, with
      # this workflow, restoring only main's caches (and its own new
      # branch's, which start empty): that run's Lean outputs are what a push
      # to main would build. So the push reuses them instead of running the
      # shards, if that run succeeded and they're still there.
      # Never a pull request's run: only the merge queue's branches for main.
      - id: reuse
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          id=$(gh run list --workflow ci.yml --event merge_group --commit "$GITHUB_SHA" --status success \
            --json databaseId,headBranch \
            --jq '[.[] | select(.headBranch | startswith("gh-readonly-queue/main/"))][0].databaseId // empty' || true)
          # Its final outputs are named after the job that assembled them.
          if [ -n "$id" ] && [ -n "$(gh api --paginate "repos/$GH_REPO/actions/runs/$id/artifacts?per_page=100" \
              --jq '.artifacts[] | select((.name | startswith("lean-build-final-")) and (.expired | not)) | .name' || true)" ]; then
            echo "Reusing the Lean outputs of run $id."
            echo "run-id=$id" >> "$GITHUB_OUTPUT"
          fi
      # The hashes of the sources of `main`'s last build, and how long each
      # module took to build.
      - name: Restore the manifest of the last build
        id: manifest
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lean-manifest
          key: ${{ steps.keys.outputs.manifest-cache }}
          restore-keys: ${{ steps.keys.outputs.manifest-cache-prefix }}
      - id: plan
        env:
          MATCHED: ${{ steps.manifest.outputs.cache-matched-key }}
        run: |
          python3 ci/lean_shards.py plan .lean-manifest/manifest.json "$RUNNER_TEMP/lean-plan.json" >> "$GITHUB_OUTPUT"
          # The build saved with the manifest, which the plan is for.
          if [ -n "$MATCHED" ]; then
            echo "build-key=lean-build-${MATCHED#lean-manifest-}" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/upload-artifact
        with:
          name: lean-plan
          path: ${{ runner.temp }}/lean-plan.json
          retention-days: 1
          if-no-files-found: error
      # The rest builds here: with shards, it is skipped, so that they start
      # as soon as the plan is done.
      - name: Decide whether to build here
        id: here
        env:
          COUNT: ${{ steps.plan.outputs.count }}
          REUSE: ${{ steps.reuse.outputs.run-id }}
        run: |
          if [ "$COUNT" = 0 ] || [ -n "$REUSE" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "$COUNT shards build the proofs."
          fi
      - uses: ./.github/actions/lean-prepare
        id: prepare
        if: ${{ steps.here.outputs.build == 'true' }}
        with:
          key: ${{ steps.keys.outputs.build-cache }}
          restore-keys: |
            ${{ steps.plan.outputs.build-key }}
            ${{ steps.keys.outputs.build-cache-prefix }}
      # On a push to main, the merge queue run's outputs of this commit: its
      # shards' and its final ones (`lean-build-final-*`, extracted last).
      # Lake rebuilds whatever doesn't match the sources.
      - uses: ./.github/actions/download-artifact
        if: ${{ steps.here.outputs.build == 'true' && steps.reuse.outputs.run-id != '' }}
        with:
          pattern: lean-build-*
          merge-multiple: true
          path: ${{ runner.temp }}/lean-build
          run-id: ${{ steps.reuse.outputs.run-id }}
          github-token: ${{ github.token }}
      - uses: ./.github/actions/lean-assemble
        if: ${{ steps.here.outputs.build == 'true' }}
        with:
          id: lean
          cache-hit: ${{ steps.prepare.outputs.cache-hit }}
          cache-key: ${{ steps.prepare.outputs.cache-primary-key }}
          manifest-cache: ${{ steps.keys.outputs.manifest-cache }}
          manifest-cache-prefix: ${{ steps.keys.outputs.manifest-cache-prefix }}

  # Each shard uploads its outputs, then lists the run's artifacts; one that
  # finds every shard's assembles them (`lean-assemble`), on the runner it
  # has set up already, and then uploads a marker, `lean-assembled-<shard>`.
  # Whichever shard lists last lists after every upload, so one normally
  # finds them all, and two that both do check the same build twice. That
  # relies on the artifacts API listing an upload as soon as it is done,
  # which GitHub does not promise: if no shard assembles, `all-green`, which
  # requires every shard to succeed and a marker, assembles itself instead.
  # So whatever the API lists, a run passes only if some job checked the
  # whole build.
  lean-shard:
    # More independent files, with two compiler threads per file (lakefile.toml).
    env:
      LEAN_NUM_THREADS: "6"
    needs: lean
    # To list the run's artifacts.
    permissions:
      actions: read
      contents: read
    if: ${{ needs.lean.outputs.count != '0' && needs.lean.outputs.reuse == '' }}
    strategy:
      # One failed shard cancels the others: without its outputs nothing
      # assembles the build, so theirs would go unused (their times reach
      # later plans only through an assembled build's manifest).
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.lean.outputs.shards) }}
    # No expressions: GitHub does not evaluate them in the name of a skipped
    # job, and shows them as written. It adds the shard to each running
    # job's name itself ("Lean: shard (3)").
    name: "Lean: shard"
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/runner-info
      # The build the plan is for (or, if it has none, the last build main
      # saved).
      - uses: ./.github/actions/lean-prepare
        id: prepare
        with:
          key: ${{ needs.lean.outputs.build-cache }}
          restore-keys: |
            ${{ needs.lean.outputs.build-key }}
            ${{ needs.lean.outputs.build-cache-prefix }}
      - uses: ./.github/actions/download-artifact
        with:
          name: lean-plan
          path: ${{ runner.temp }}
      - name: Check the shard's proofs (and the axiom audit)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          touch "$RUNNER_TEMP/before-build"
          # Warnings and errors only: not the profile every module records
          # (lean/lakefile.toml), which Lake replays for each one it finds
          # built.
          lake build --log-level=warning $(python3 ../ci/lean_shards.py targets "$RUNNER_TEMP/lean-plan.json" "$SHARD") 2>&1 \
            | tee "$RUNNER_TEMP/build.log"
      # What this build wrote for the shard's own modules; Lean's outputs
      # are deterministic, so the shards' outputs agree on the modules they
      # all import. And how long it took to build each module, for later
      # plans.
      - name: Collect the outputs of the shard's modules
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 ../ci/lean_shards.py times < "$RUNNER_TEMP/build.log" > "$RUNNER_TEMP/lean-times-$SHARD.json"
          cd .lake/build
          find . -type f -newer "$RUNNER_TEMP/before-build" -printf '%P\n' \
            | python3 ../../../ci/lean_shards.py outputs "$RUNNER_TEMP/lean-plan.json" "$SHARD" \
            | tar --zstd -cf "$RUNNER_TEMP/lean-build-$SHARD.tar.zst" -T -
      - uses: ./.github/actions/upload-artifact
        with:
          name: lean-build-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/lean-build-${{ matrix.shard }}.tar.zst
            ${{ runner.temp }}/lean-times-${{ matrix.shard }}.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      # Only after this shard's upload, so that the last shard to list finds
      # every shard's. A shard that restored another build than the plan's (or
      # none: a download that failed) never assembles: the shards upload only
      # what they rebuilt, so it would build every other module again, on one
      # runner. `all-green` assembles instead.
      - name: Find out whether every shard's outputs are uploaded
        id: all-uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHARDS: ${{ needs.lean.outputs.shards }}
          PLANNED: ${{ needs.lean.outputs.build-key }}
          EXACT: ${{ needs.lean.outputs.build-cache }}
          RESTORED: ${{ steps.prepare.outputs.cache-matched-key }}
        run: |
          if [ -n "$PLANNED" ] && [ "$RESTORED" != "$PLANNED" ] && [ "$RESTORED" != "$EXACT" ]; then
            echo "::warning::This shard restored ${RESTORED:-no build}, not the plan's $PLANNED: another job assembles the build."
            exit 0
          fi
          # An error here only leaves the assembly to another job.
          names=$(gh api --paginate "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[].name' || true)
          for s in $(jq -r '.[]' <<< "$SHARDS"); do
            if ! grep -qxF "lean-build-$s" <<< "$names"; then
              echo "Shard $s's outputs are not uploaded yet: another job assembles the build."
              exit 0
            fi
          done
          echo "Every shard's outputs are uploaded: this shard assembles the build."
          echo "all=true" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.all-uploaded.outputs.all == 'true' }}
        uses: ./.github/actions/download-artifact
        with:
          pattern: lean-build-*
          merge-multiple: true
          path: ${{ runner.temp }}/lean-build
      - if: ${{ steps.all-uploaded.outputs.all == 'true' }}
        uses: ./.github/actions/lean-assemble
        with:
          id: ${{ matrix.shard }}
          cache-hit: ${{ steps.prepare.outputs.cache-hit }}
          cache-key: ${{ steps.prepare.outputs.cache-primary-key }}
          manifest-cache: ${{ needs.lean.outputs.manifest-cache }}
          manifest-cache-prefix: ${{ needs.lean.outputs.manifest-cache-prefix }}
      # Last: only once every check of the whole build has passed.
      - name: Record that this shard assembled the build
        if: ${{ steps.all-uploaded.outputs.all == 'true' }}
        run: echo "Shard $SHARD assembled the build." > "$RUNNER_TEMP/lean-assembled"
        env:
          SHARD: ${{ matrix.shard }}
      - if: ${{ steps.all-uploaded.outputs.all == 'true' }}
        uses: ./.github/actions/upload-artifact
        with:
          name: lean-assembled-${{ matrix.shard }}
          path: ${{ runner.temp }}/lean-assembled
          retention-days: 1
          if-no-files-found: error

  lean-imports:
    name: Static checks
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 ci/check_lean_imports.py
      - run: python3 ci/check_lean_modules.py
      - run: python3 ci/check_registrations.py
      - run: python3 ci/check_lean_speed.py
      - run: python3 ci/algorithms_table.py --check
      - run: python3 ci/check_arch_gates.py
      - run: python3 ci/check_variants.py
      # `rust-cpu-features` sets it per line of a CPU's `runs`, inline.
      - name: Only rust-cpu-features sets VG_CPU_FEATURES
        run: "! grep -nE '^ *VG_CPU_FEATURES:' .github/workflows/ci.yml"
      - run: python3 ci/cpu_tests.py lint .github/workflows/ci.yml
      - run: python3 -m unittest discover -s ci -p 'test_check_*.py'
      - run: python3 ci/check_mcdt.py
      - run: python3 ci/check_vectors.py

  rust:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-26.04
          # x86: a 32-bit userspace, run natively on the x86-64 host, in the
          # image ci/runner.Dockerfile builds (Runner images workflow). It
          # holds only that platform, so it is named.
          - os: ubuntu-26.04
            container:
              image: ghcr.io/pyca/verified-garbage-runner:i686
              # Docker 29.4.2 on ubuntu-26.04 denies socketcall(2), which i386
              # glibc makes its socket calls through, so the container has no
              # network (actions/runner-images#14790); drop the flag once the
              # runner has Docker 29.4.3 or later.
              options: --platform linux/386 --security-opt seccomp=unconfined
          - os: ubuntu-26.04-arm
          # ARMv7: cross-compiled on the ARM64 host, in the same Dockerfile's
          # 64-bit image for it, whose Cargo runs the tests (ci/arm32-run)
          # natively when the CPU has AArch32 and under QEMU when it doesn't:
          # some runners are Neoverse V3, which has none, and on which a
          # 32-bit container can't even start.
          - os: ubuntu-26.04-arm
            container:
              image: ghcr.io/pyca/verified-garbage-runner:armv7-cross
          # PPC64LE: pyca's ppc64le runner image, on a ppc64le runner (as
          # pyca/cryptography does).
          - os: ubuntu-24.04-ppc64le
            container:
              image: ghcr.io/pyca/cryptography-runner-ubuntu-rolling:ppc64le
              # A fresh home avoids upgrading the image's incomplete Rust installation.
              options: --env RUSTUP_HOME=/tmp/verified-garbage-rustup
          - os: macos-latest
          - os: windows-latest
        rust: [stable]
        include:
          # The minimum supported Rust version (Cargo.toml's `rust-version`),
          # on one platform.
          - platform:
              os: ubuntu-26.04
            rust: "1.88"
          # One job each for the upcoming toolchains, to catch regressions (and
          # new warnings, which are errors here) before they reach stable.
          - platform:
              os: ubuntu-26.04
            rust: beta
          - platform:
              os: ubuntu-26.04
            rust: nightly
    runs-on: ${{ matrix.platform.os }}
    # With an empty image the job runs directly on the runner.
    container:
      image: ${{ matrix.platform.container.image || '' }}
      options: ${{ matrix.platform.container.options || '' }}
    env:
      # Selects the toolchain without `rustup default`, which refuses 32-bit
      # toolchains on a 64-bit kernel.
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      RUSTFLAGS: -D warnings -Cinstrument-coverage
      # Both relative to the crate root, where the test binaries run.
      LLVM_PROFILE_FILE: .rust-cov/cov-%p-%m.profraw
      WYCHEPROOF_ROOT: wycheproof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/runner-info
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: C2SP/wycheproof
          path: wycheproof
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy,rustfmt,llvm-tools
      # The dependencies (built with opt-level 3) are most of the build.
      # Only main saves, so pull requests restore main's entries instead of
      # filling the cache quota with their own.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Not shared with `rust-cpu-features`: those jobs compute the same
          # key but run no clippy, so when one of them saved the entry first,
          # this job's clippy checked the dependencies again on every run.
          shared-key: rust
          # The benchmark crate is outside the library's workspace.
          workspaces: |
            . -> target
            bench -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint
        if: ${{ matrix.rust == 'stable' }}
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked
          cargo clippy --all-targets --locked --features std
          cargo clippy --all-targets --locked --features cpu-features-env
      # The benchmark crate, which is outside the library's workspace: on each
      # architecture the Benchmarks workflow runs it on, since its files are
      # gated by architecture. It links OpenSSL (rust-openssl).
      - name: Lint the benchmarks
        if: ${{ matrix.rust == 'stable' && runner.os == 'Linux' }}
        working-directory: bench
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked
      # The Benchmarks workflow's dependencies, for its `compare` jobs to
      # restore: pull requests can read only caches saved on their own branch
      # or on main, and that workflow does not run on main. A new stable Rust
      # changes the key (ci/bench_cache_key.sh), so every push to main looks
      # it up, without downloading, and builds only on a miss. Not when
      # cross-compiling (the ARMv7 image sets CARGO_BUILD_TARGET): the
      # Benchmarks workflow builds ARMv7's natively, in the armv7l image, and
      # this compiler's key is ARM64's.
      - id: bench-cache-key
        if: ${{ matrix.rust == 'stable' && runner.os == 'Linux' && github.event_name == 'push' }}
        run: |
          if [ -z "${CARGO_BUILD_TARGET:-}" ]; then
            echo "key=$(sh ci/bench_cache_key.sh bench)" >> "$GITHUB_OUTPUT"
          fi
      - id: bench-cache
        if: ${{ steps.bench-cache-key.outputs.key }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench-target
          key: ${{ steps.bench-cache-key.outputs.key }}
          lookup-only: true
      - name: Build the benchmarks' dependencies
        if: ${{ steps.bench-cache-key.outputs.key && steps.bench-cache.outputs.cache-hit != 'true' }}
        working-directory: bench
        # As ci/bench_compare.py builds them: same target directory and no
        # RUSTFLAGS, both of which the build's fingerprints include. The
        # crates of this repository are rebuilt there anyway.
        env:
          RUSTFLAGS: ""
        run: |
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/bench-target"
          cargo bench --no-run --locked
          cargo clean --release -p verified-garbage -p verified-garbage-bench
      - if: ${{ steps.bench-cache-key.outputs.key && steps.bench-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench-target
          key: ${{ steps.bench-cache-key.outputs.key }}
      - run: rustc -vV
      - run: cargo test --locked ${{ case(env.TESTS == 'true', '', '--no-run') }}
      - name: Export coverage
        if: ${{ env.TESTS == 'true' }}
        shell: bash
        run: $(command -v python3 || command -v python) ci/export_rust_coverage.py .rust-cov
      # `std` without `cpu-features-env`, as a default-features user that
      # enables it builds the library: AArch64 asks the operating system for
      # its features (src/cpu.rs), which the build above, without `std`,
      # does not, and `rust-cpu-features` does only with `VG_CPU_FEATURES`.
      - name: Test CPU feature detection with std
        if: ${{ env.TESTS == 'true' && matrix.platform.os == 'ubuntu-26.04-arm' }}
        env:
          LLVM_PROFILE_FILE: .rust-cov-std/cov-%p-%m.profraw
        run: |
          cargo test --locked --features std --lib cpu::
          python3 ci/export_rust_coverage.py .rust-cov-std --features std --lib
      - if: ${{ env.TESTS == 'true' }}
        uses: ./.github/actions/upload-artifact
        with:
          name: coverage-data-${{ strategy.job-index }}
          path: "*.lcov"
          if-no-files-found: error

  # The ARM code in Thumb (T32): the `rust` job's ARMv7 target assembles it
  # as A32, while thumbv7neon-*, Android, Windows and M-profile targets
  # assemble the same text as T32 (see "Modelling choices" in
  # lean/VerifiedGarbage/TCB/Arm/Isa.lean). Cross-compiled and run like
  # ARMv7, in its image. Without coverage: the standard library of this
  # target has no profiler runtime, and its Rust code is the ARMv7 job's,
  # which is covered there.
  rust-thumb:
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported Rust version is tested in the `rust` job.
        rust: [stable]
    name: Rust (Thumb, ${{ matrix.rust }})
    runs-on: ubuntu-26.04-arm
    container:
      image: ghcr.io/pyca/verified-garbage-runner:armv7-cross
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      # For every cargo command, in place of the image's ARMv7 (with the
      # same linker and runner).
      CARGO_BUILD_TARGET: thumbv7neon-unknown-linux-gnueabihf
      RUSTFLAGS: -D warnings
      WYCHEPROOF_ROOT: wycheproof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/runner-info
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: C2SP/wycheproof
          path: wycheproof
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy --target thumbv7neon-unknown-linux-gnueabihf
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-thumb
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: rustc -vV
      - name: Lint
        if: ${{ matrix.rust == 'stable' }}
        run: cargo clippy --all-targets --locked
      - run: cargo test --locked ${{ case(env.TESTS == 'true', '', '--no-run') }}
      # That the tests ran T32: the symbol of Thumb code has an odd address
      # (AAELF32 §5.5.3, "Symbol Values").
      - name: Check the verified functions are Thumb code
        if: ${{ env.TESTS == 'true' }}
        run: |
          find "target/$CARGO_BUILD_TARGET/debug/deps" -maxdepth 1 -type f -executable -exec readelf -sW {} + |
            awk '$4 == "FUNC" && $8 ~ /vg_/ { n++; if ($2 ~ /[02468aceACE]$/) { print "not Thumb: " $8; bad++ } }
                 END { print n " verified function symbols"; exit (n == 0 || bad > 0) }'

  # The latest CPU time of each line of `rust-cpu-features`' runs on `main`,
  # per class of host, which its shards deal out their lines by
  # (ci/cpu_shards.py):
  # restored once, so that every shard has the same; `{}` before `main` has
  # saved any.
  cpu-features-times:
    name: "Rust: times of the CPU feature runs"
    runs-on: ubuntu-26.04
    outputs:
      times: ${{ steps.times.outputs.times }}
    steps:
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cpu-features-times
          key: cpu-features-times-${{ github.run_id }}
          restore-keys: cpu-features-times-
      - id: times
        run: echo "times=$(cat .cpu-features-times/times.json 2>/dev/null || echo '{}')" >> "$GITHUB_OUTPUT"

  # CPU feature detection (src/cpu.rs) and the primitives that choose an
  # implementation by CPU feature, tested end to end on this runner's CPU,
  # on CPUs that Intel SDE emulates, and natively on ARM64 (where
  # `std`, which `cpu-features-env` enables, detects features at run time;
  # without it, AArch64 detection is at compile time, which the `rust` job
  # tests, along with `std` alone). SDE runs the
  # SHA extensions' code tens of times slower than hardware (#274), so the
  # chips that have them (arl, icx, dmr) run only the tests they are there
  # for. A job is one CPU (and userspace); its `runs` are lines of
  # `<VG_CPU_FEATURES> | <groups>` (`all` for every test), each running the
  # one build's tests of those groups (ci/cpu_tests.py, which names each
  # group's tests by path), since `VG_CPU_FEATURES` is read at run time.
  # `VG_CPU_FEATURES` restricts the CPU's features (`-` for no restriction,
  # `none` for the baseline ISA), so that each implementation, and each of
  # Ed25519's combinations of SHA-512 and field multiplication, is chosen
  # somewhere; the coverage, merged with the rest, checks that every one
  # was. These are the only runs that set `VG_CPU_FEATURES`, and a CPU runs
  # each value of it once (the lint job and ci/cpu_shards.py check both), so
  # that no run repeats another's. A CPU whose lines take long is split into
  # shards: matrix entries with the same `runs` (a YAML alias of the first's)
  # and a `shard` of `i/n`, each a job that runs its share of the lines,
  # dealt out by the CPU time each took on `main` on one class of host
  # (ci/cpu_shards.py, with the times `cpu-features-times` restores).
  rust-cpu-features:
    needs: cpu-features-times
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: native
            arch: x86_64
            # AES-GCM's instances for AES's or GHASH's extension alone, which
            # no runner or chip has without the other; AES-NI's and
            # PCLMULQDQ's together, without AVX and with it, and with AVX2
            # too, whose key setup with the powers needs it (and AES-CMAC's,
            # AES-CCM's and AES-SIV's AES-NI functions, those chaining CMAC's
            # blocks in registers among them, and the AES-NI instances of
            # AES-OCB and of the modes over whole blocks, ECB to XTS), which a
            # runner with VAES and VPCLMULQDQ never chooses; and VAES's and
            # VPCLMULQDQ's 256-bit ones, which a runner with AVX512BW too
            # never chooses; and XTS's VAES instances calling the block
            # functions, which a runner with VPCLMULQDQ never chooses; and RSAES-PKCS1-v1_5 and RSAES-OAEP decryption and
            # RSASSA-PSS with the hash functions' SHA extensions and RSA's
            # baseline code; and `vg_zeroize_avx`, and `vg_zeroize` without
            # AVX. And RSAES-OAEP with SHA-1's and SHA-256's SHA extensions
            # and with SHA-512's baseline code and RSA's ADX code, or with
            # SHA-512's AVX2 code and RSA's baseline or ADX code (whatever
            # the runner's AVX512_IFMA).
            runs: |
              - | ffdh dsa sha1 sha224 sha256 sha384 sha512 blake2 aes_gcm aes_ocb aes_ecb aes_cbc aes_ofb aes_cfb aes_cfb8 aes_ctr aes_xts cmac chacha20 triple_des_ecb poly1305 mlkem mldsa scrypt argon2 rfc9106 x25519 x448 ed25519 ed448 rsa message_boundaries_and_unaligned_inputs signing_with_aliased_read_only_inputs zeroize cpu
              aes,ssse3 | aes_gcm cmac aes_ccm aes_siv aes_ocb aes_ecb aes_cbc aes_ofb aes_cfb aes_cfb8 aes_ctr aes_xts zeroize cpu
              pclmulqdq,ssse3 | aes_gcm cpu
              aes,pclmulqdq,ssse3 | aes_gcm cpu
              aes,avx,pclmulqdq,ssse3 | aes_gcm aes_xts cpu
              aes,avx,avx2,pclmulqdq,ssse3 | aes_gcm cpu
              aes,avx,avx2,pclmulqdq,ssse3,vaes,vpclmulqdq | aes_gcm cpu
              aes,avx,avx2,ssse3,vaes | aes_xts cpu
              sha,ssse3 | rsa_pkcs1 rsa_pss rsa_oaep cpu
              avx,avx2,bmi2,adx,sha,ssse3 | rsa_oaep cpu
              avx,avx2,bmi1,bmi2,sha,ssse3 | rsa_oaep cpu
              adx,avx,avx2,bmi1,bmi2,sha,ssse3 | rsa_oaep cpu
          # x86 feature dispatch, natively in a 32-bit userspace, with the
          # runner's features (ChaCha20's and ChaCha20-Poly1305's SSSE3
          # instances) and every test with the baseline implementations; and
          # AES-GCM's and AES-GCM-SIV's instances for AES's or GHASH's
          # extension alone.
          - chip: native
            arch: x86
            container:
              image: ghcr.io/pyca/verified-garbage-runner:i686
              # Docker 29.4.2 on ubuntu-26.04 denies socketcall(2), which i386
              # glibc makes its socket calls through, so the container has no
              # network (actions/runner-images#14790); drop the flag once the
              # runner has Docker 29.4.3 or later.
              options: --platform linux/386 --security-opt seccomp=unconfined
            runs: |
              - | sha1 sha224 sha256 sha384 sha512 aes_ccm aes_gcm aes_gcm_siv aes_ocb aes_ecb aes_cbc aes_ofb aes_cfb aes_cfb8 aes_ctr aes_xts aes_siv cmac chacha20 mlkem scrypt x25519 ed25519 ecdsa p256_sha cpu
              none | all
              aes | aes_gcm aes_gcm_siv cpu
              pclmulqdq,ssse3 | aes_gcm aes_gcm_siv cpu
          # AVX-512F and AVX512VL (with Argon2's vg_argon2_compress_avx512
          # and BLAKE2b's vg_blake2b_compress_avx512), BMI2 and ADX (with
          # FFDH's and DSA's ADX functions), and with AVX2 too (RSA's ADX
          # functions, whose private-key operation selects its table's entries
          # with AVX2, and P-256's, P-384's, P-521's and Ed25519's `_adx`
          # functions, whose combs select their entries with AVX2, P-384's
          # and P-521's with SHA-512's baseline code); BMI2 and
          # ADX without AVX-512F; AVX-512F without AVX2, for Argon2 with G's
          # AVX-512 code and BLAKE2b's baseline code; and AVX-512F without
          # AVX512VL, for Argon2 with G's AVX-512 code and BLAKE2b's AVX2
          # code, and for ChaCha20's and ChaCha20-Poly1305's `_avx512`
          # instances, which the CPU's AVX512VL replaces with `_avx512vl`.
          - chip: skx
            arch: x86_64
            runs: |
              - | dsa sha1 sha224 sha256 sha384 sha512 blake2 aes_gcm cmac chacha20 triple_des_ecb poly1305 mlkem mldsa scrypt argon2 rfc9106 x25519 x448 ed25519 ed448 rsa message_boundaries_and_unaligned_inputs signing_with_aliased_read_only_inputs cpu
              bmi2,adx | ffdh dsa ed448 message_boundaries_and_unaligned_inputs signing_with_aliased_read_only_inputs cpu
              avx,avx2,bmi2,adx | rsa_pkcs1 rsa_pss rsa_oaep p256 p384 p521 ed25519 message_boundaries_and_unaligned_inputs signing_with_aliased_read_only_inputs cpu
              avx,avx512f | argon2 rfc9106 cpu
              avx,avx2,avx512f | argon2 rfc9106 mlkem chacha20 cpu
          # AVX2, but not AVX-512F or ADX; AES-NI and PCLMULQDQ with AVX, but
          # not VAES or VPCLMULQDQ (RSAES-PKCS1-v1_5 decryption and RSASSA-PSS
          # with the hash functions' AVX2 code and RSA's baseline code, and
          # P-256, P-384 and P-521 with their baseline multiplications).
          - chip: hsw
            arch: x86_64
            runs: |
              - | dsa sha1 sha224 sha256 sha384 sha512 blake2 aes_gcm cmac chacha20 triple_des_ecb poly1305 mlkem mldsa scrypt argon2 rfc9106 x25519 x448 ed25519 ed448 rsa_pkcs1 rsa_pss rsa_oaep p256 p384 p521 message_boundaries_and_unaligned_inputs signing_with_aliased_read_only_inputs cpu
          # Nothing beyond x86-64's baseline, not even CPUID leaf 7.
          # Ubuntu 26.04's x86-64 userspace is built for x86-64-v3 (AVX2), so
          # SDE stops on its dynamic loader's AVX instructions: this CPU runs
          # on 24.04, whose userspace is the baseline ISA's.
          - chip: p4p
            arch: x86_64
            runner: ubuntu-24.04
            runs: |
              - | ffdh dsa sha1 sha224 sha256 sha384 sha512 blake2 aes_gcm aes_ocb aes_ecb aes_cbc aes_ofb aes_cfb aes_cfb8 aes_ctr aes_xts cmac chacha20 triple_des_ecb poly1305 mlkem mldsa scrypt argon2 rfc9106 x25519 x448 ed25519 ed448 rsa message_boundaries_and_unaligned_inputs signing_with_aliased_read_only_inputs cpu
          # Arrow Lake: the SHA512 extension, which no runner has (and
          # RSASSA-PSS and RSAES-OAEP with SHA-384's and SHA-512's code using
          # it, and P-256's and P-384's signatures with SHA-384 and P-521's
          # with SHA-512 using it, with and without ADX; and RSAES-OAEP with
          # it and MGF1 over SHA-1 with SHA-1's baseline code and RSA's ADX
          # code, or with SHA-1's SHA extensions and RSA's baseline code).
          - chip: arl
            runs: |
              - | sha384 sha512 ed25519 rsa_pss rsa_oaep message_boundaries_and_unaligned_inputs signing_with_aliased_read_only_inputs cpu
              avx,avx2,sha512 | ed25519 rsa_oaep p256 p384 p521 message_boundaries_and_unaligned_inputs signing_with_aliased_read_only_inputs cpu
              avx,avx2,sha512,bmi2,adx | rsa_oaep_pairs cpu
              avx,avx2,sha512,sha,ssse3 | rsa_oaep_pairs cpu
          # Ice Lake server: AVX512_IFMA and AVX512VL, for vg_x25519_ifma
          # and (with AVX512F) vg_x25519_base_ifma, Ed25519's IFMA variants,
          # vg_rsa_private_checked_ifma and vg_poly1305_blocks_ifma (with the
          # `_ifma` instances of Poly1305, ChaCha20 and ChaCha20-Poly1305); VAES,
          # VPCLMULQDQ and AVX512BW, for vg_aes_ctr32_vaes, vg_ghash_vpclmul
          # and the AES-GCM and AES-CMAC instances calling them (AES-GCM's
          # with its 512-bit loops); and AES-GCM's instances with VAES or
          # VPCLMULQDQ alone or paired with the other's 128-bit instruction,
          # which no chip has without the other, and with both in 256-bit
          # registers alone, which a chip with AVX512BW never chooses; and
          # RSAES-PKCS1-v1_5 decryption and RSASSA-PSS signing with
          # vg_rsa_private_checked_ifma and each hash function's
          # implementations (and RSAES-OAEP decryption with SHA-1's SHA
          # extensions and SHA-512's baseline code).
          # Three shards: its RSA lines each run Wycheproof's RSA tests
          # under SDE, which take minutes on a runner without AVX-512, and
          # three times as long sharing a runner's cores.
          - chip: icx
            shard: 1/3
            runs: &icx-runs |
              - | x25519 ed25519 rsa message_boundaries_and_unaligned_inputs signing_with_aliased_read_only_inputs aes_gcm cmac chacha20 poly1305 cpu
              avx,avx2,avx512f,bmi2,adx,avx512ifma,avx512vl | ed25519 rsa_pkcs1 rsa_pss rsa_oaep message_boundaries_and_unaligned_inputs signing_with_aliased_read_only_inputs cpu
              avx,avx2,avx512f,bmi1,bmi2,adx,avx512ifma,avx512vl | rsa_pkcs1 rsa_pss rsa_oaep cpu
              avx,avx2,avx512f,bmi2,adx,avx512ifma,avx512vl,sha,ssse3 | rsa_oaep_pairs cpu
              aes,avx,avx2,ssse3,vaes | aes_gcm cpu
              avx,avx2,pclmulqdq,ssse3,vpclmulqdq | aes_gcm cpu
              aes,avx,avx2,pclmulqdq,ssse3,vaes | aes_gcm cpu
              aes,avx,avx2,pclmulqdq,ssse3,vpclmulqdq | aes_gcm cpu
              aes,avx,avx2,pclmulqdq,ssse3,vaes,vpclmulqdq | aes_gcm cpu
          - chip: icx
            shard: 2/3
            runs: *icx-runs
          - chip: icx
            shard: 3/3
            runs: *icx-runs
          # Diamond Rapids: the SHA512 extension and AVX512_IFMA, for
          # Ed25519's verification with both (vg_ed25519_verify_shani_ifma)
          # and RSASSA-PSS signing and RSAES-OAEP decryption with both (with
          # MGF1 over SHA-1 with its SHA extensions or its baseline code).
          - chip: dmr
            runs: |
              - | ed25519 rsa_pss rsa_oaep_pairs message_boundaries_and_unaligned_inputs signing_with_aliased_read_only_inputs cpu
              avx,avx2,sha512,avx512f,bmi2,adx,avx512ifma,avx512vl | rsa_oaep_pairs cpu
          # The runner has SVE2, so the unrestricted run tests the `_sve2`
          # instances; `neon` and `none` test ChaCha20's NEON and scalar ones,
          # `sha3` and `none` the SHA-3 prototype and its scalar fallback (and
          # the instances of ML-KEM, ML-DSA and Ed448 calling each),
          # `none` deterministic ECDSA with the scalar SHA-256 and SHA-512
          # and AES-CCM with the scalar AES, and RSAES-PKCS1-v1_5 decryption
          # with the scalar SHA-256 (the unrestricted runs of the plain tests
          # take its `_sha256_sha2` instance), and the unrestricted run and
          # `none` AES-GCM-SIV's and AES-OCB's `_aes` and scalar instances.
          # RSAES-OAEP: `sha2` takes SHA-1's and SHA-256's `_sha2`
          # instances with SHA-512's scalar ones, `none` the scalar ones,
          # `sha3` SHA-512's `_sha3` ones with SHA-1's scalar MGF1, and
          # `sha2,sha3` both extensions together.
          - chip: native
            arch: aarch64
            os: ubuntu-26.04-arm
            runs: |
              - | aes_gcm aes_gcm_siv aes_ocb aes_ecb aes_cbc aes_ofb aes_cfb aes_cfb8 aes_ctr aes_xts aes_siv aes_ccm cmac sha1 sha224 sha256 sha384 sha512 sha3 shake mlkem mldsa ed448 scrypt chacha20 ed25519 message_boundaries_and_unaligned_inputs signing_with_aliased_read_only_inputs cpu
              neon | chacha20
              sha3 | sha3 shake mlkem mldsa ed448 rsa_oaep
              sha2 | rsa_oaep
              sha2,sha3 | rsa_oaep
              none | dsa aes_siv chacha20 sha3 shake mlkem mldsa ecdsa p224_sha p256_sha p384_sha ed448 aes_gcm_siv aes_ccm aes_ocb aes_ecb aes_cbc aes_ofb aes_cfb aes_cfb8 aes_ctr aes_xts rsa_pkcs1 rsa_oaep
    name: Rust (${{ matrix.os && format('native, {0}', matrix.os) || matrix.chip == 'native' && 'native' || format('sde -{0}', matrix.chip) }}${{ matrix.arch && format(', {0}', matrix.arch) || '' }}${{ matrix.shard && format(', {0}', matrix.shard) || '' }})
    runs-on: ${{ matrix.runner || matrix.os || 'ubuntu-26.04' }}
    container:
      image: ${{ matrix.container.image || '' }}
      options: ${{ matrix.container.options || '' }}
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTFLAGS: -D warnings -Cinstrument-coverage
      LLVM_PROFILE_FILE: .rust-cov/cov-%p-%m.profraw
      WYCHEPROOF_ROOT: wycheproof
      SDE_VERSION: 10.13.1-2026-07-28
      SDE_URL: https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz
      SDE_SHA256: 94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: C2SP/wycheproof
          path: wycheproof
          persist-credentials: false
      - name: This runner's CPU
        run: |
          if [ "$(uname -m)" = aarch64 ]; then
            grep -m1 Features /proc/cpuinfo | tr ' ' '\n' | grep -xE 'aes|pmull|sve2' | tr '\n' ' '
          else
            grep -m1 'model name' /proc/cpuinfo
            grep -m1 flags /proc/cpuinfo | tr ' ' '\n' \
              | grep -xE 'ssse3|sha_ni|aes|pclmulqdq|avx|avx2|bmi1|bmi2|avx512f|sha512|adx|avx512ifma|avx512vl|vaes|vpclmulqdq' \
              | tr '\n' ' '
          fi
      - name: Download Intel SDE
        if: ${{ matrix.chip != 'native' && env.TESTS == 'true' }}
        run: |
          curl -sSfLo sde.tar.xz "$SDE_URL"
          echo "$SDE_SHA256  sde.tar.xz" | sha256sum -c
          mkdir "$RUNNER_TEMP/sde"
          tar -xJf sde.tar.xz -C "$RUNNER_TEMP/sde" --strip-components 1
          rm sde.tar.xz
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-cpu-features
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: ${{ env.TESTS != 'true' }}
        run: cargo test --locked --features cpu-features-env --no-run
      # Set the test runner after caching: its temporary path would otherwise
      # change the cache key, which includes CARGO_* environment variables.
      - name: Run the tests under SDE
        if: ${{ matrix.chip != 'native' && env.TESTS == 'true' }}
        run: echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER=$RUNNER_TEMP/sde/sde64 -$CHIP --" >> "$GITHUB_ENV"
        env:
          CHIP: ${{ matrix.chip }}
      # Only the tests of what depends on CPU features, once per line of
      # `runs` (of this shard's, ci/cpu_shards.py): each of the line's
      # groups' tests by its exact name (ci/cpu_tests.py, from the lists of
      # the library's unit tests and of the test binary's tests), in the one
      # binary or both that hold them. The lines run at the same time, slowest
      # first, as many as the runner has cores: each binary takes a second or
      # more to start under SDE, on one core, so that one line at a time left
      # the other cores idle. (Cargo holds the build directory's lock only
      # while building, which the first command does for all of them; the
      # coverage files are named by process.) Each line's output is printed
      # afterwards in a log group of its own; every line runs, and the step
      # fails at the end, naming the lines that failed. Each line's CPU time
      # (user and system, of its `cargo test`s and everything they ran) is
      # kept, for `main` to save for the next runs' shards, and the CPU's
      # tests and groups, for `coverage` to check every group's paths with.
      - name: Test the implementations
        if: ${{ env.TESTS == 'true' }}
        shell: bash
        run: |
          lines=$(python3 ci/cpu_shards.py pick "$CPU" "$SHARD" "$TIMES" <<< "$RUNS")
          # On a host without AVX512_IFMA (some runners' CPUs have none, or
          # do not expose it), SDE emulates it for -icx and -dmr some thirty
          # times slower than the ADX code runs: the RSA tests then leave
          # out the 3072- and 4096-bit keys that its private-key code runs
          # with but in one test (tests/wycheproof/harness.rs).
          if [ "${CPU%% *}" != native ] && ! grep -qw avx512ifma /proc/cpuinfo; then
            export VG_TEST_HOST_WITHOUT_IFMA=1
          fi
          cargo test --locked --features cpu-features-env --no-run
          lists=$RUNNER_TEMP/lists
          mkdir -p "$lists"
          cargo test --locked --features cpu-features-env --lib -- --list --format terse > "$lists/lib"
          cargo test --locked --features cpu-features-env --test tests -- --list --format terse > "$lists/tests"
          python3 ci/cpu_tests.py record "$CPU" "$RUNS" "$lists/lib" "$lists/tests" > "cpu-tests-$JOB.json"
          # A line's tests: every test for `all`, otherwise those its groups
          # select, by exact name, in each binary that has any.
          run_line() {
            local tests=$1 status=0 selected
            if [ "$tests" = all ]; then
              cargo test --locked --features cpu-features-env
              return
            fi
            for binary in lib tests; do
              selected=$(python3 ci/cpu_tests.py select "$binary" "$lists/lib" "$lists/tests" $tests) || return
              [ -n "$selected" ] || continue
              if [ "$binary" = lib ]; then target=(--lib); else target=(--test tests); fi
              cargo test --locked --features cpu-features-env "${target[@]}" -- --exact $selected || status=$?
            done
            return "$status"
          }
          logs=$RUNNER_TEMP/runs
          mkdir -p "$logs"
          names=()
          keys=()
          while IFS='|' read -r -u 3 features tests; do
            keys+=("$features")
            [ "$features" = - ] && features=
            while [ "$(jobs -rp | wc -l)" -ge "$(nproc)" ]; do wait -n || true; done
            log=$logs/${#names[@]}
            (
              status=0
              TIMEFORMAT='%U %S'
              export VG_CPU_FEATURES=$features
              { time run_line "$tests" > "$log" 2>&1 || status=$?; } 2> "$log.time"
              echo "$status" > "$log.status"
            ) &
            names+=("VG_CPU_FEATURES=$features: $tests")
          done 3<<< "$lines"
          wait
          failed=()
          for i in "${!names[@]}"; do
            echo "::group::${names[$i]}"
            cat "$logs/$i"
            echo "::endgroup::"
            echo "${names[$i]}: $(cat "$logs/$i.time") s of CPU (user, system)"
            printf '%s\t%s\n' "${keys[$i]}" "$(cat "$logs/$i.time")" >> "$logs/times"
            [ "$(cat "$logs/$i.status")" = 0 ] || failed+=("${names[$i]}")
          done
          # SDE emulates AVX-512 several times slower without it: the times
          # are kept per class of host (ci/cpu_shards.py).
          host=no-avx512f
          if grep -qw avx512f /proc/cpuinfo; then host=avx512f; fi
          python3 ci/cpu_shards.py times "$CPU" "$host" "$logs/times" > "cpu-features-times-$JOB.json"
          for f in "${failed[@]}"; do echo "::error::Failed with $f"; done
          [ ${#failed[@]} -eq 0 ]
        env:
          RUNS: ${{ matrix.runs }}
          CPU: ${{ matrix.chip }} ${{ matrix.arch }} ${{ matrix.os }}
          SHARD: ${{ matrix.shard }}
          TIMES: ${{ needs.cpu-features-times.outputs.times }}
          JOB: ${{ strategy.job-index }}
      # For `cpu-features-times-save`, from the merge queue's run.
      - if: ${{ env.TESTS == 'true' }}
        uses: ./.github/actions/upload-artifact
        with:
          name: cpu-features-times-${{ strategy.job-index }}
          path: cpu-features-times-${{ strategy.job-index }}.json
          retention-days: 1
          if-no-files-found: error
      # For `coverage`'s check of ci/cpu_tests.py's groups.
      - if: ${{ env.TESTS == 'true' }}
        uses: ./.github/actions/upload-artifact
        with:
          name: cpu-tests-${{ strategy.job-index }}
          path: cpu-tests-${{ strategy.job-index }}.json
          retention-days: 1
          if-no-files-found: error
      - name: Export coverage
        if: ${{ env.TESTS == 'true' }}
        run: python3 ci/export_rust_coverage.py .rust-cov --features cpu-features-env
      - if: ${{ env.TESTS == 'true' }}
        uses: ./.github/actions/upload-artifact
        with:
          name: coverage-data-cpu-features-${{ strategy.job-index }}
          path: "*.lcov"
          if-no-files-found: error

  # The CPU time of each line of `rust-cpu-features`' runs in this run of
  # `main`, over those of earlier runs (so that each line keeps its latest
  # time on each class of host, whichever its shard ran on this time),
  # saved for the next runs' `cpu-features-times`.
  cpu-features-times-save:
    name: "Rust: save the times of the CPU feature runs"
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: rust-cpu-features
    runs-on: ubuntu-26.04
    # To find the merge queue's run of this commit, and download its times.
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cpu-features-times
          key: cpu-features-times-${{ github.run_id }}
          restore-keys: cpu-features-times-
      # This push ran no tests: the times are those of the merge queue's run
      # of this commit, as in the `lean` job's `reuse`.
      - id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          id=$(gh run list --workflow ci.yml --event merge_group --commit "$GITHUB_SHA" --status success \
            --json databaseId,headBranch \
            --jq '[.[] | select(.headBranch | startswith("gh-readonly-queue/main/"))][0].databaseId // empty' || true)
          if [ -n "$id" ]; then
            echo "run-id=$id" >> "$GITHUB_OUTPUT"
          else
            echo "No merge queue run tested this commit: the times stay as they were."
          fi
      - if: ${{ steps.queue.outputs.run-id }}
        uses: ./.github/actions/download-artifact
        with:
          pattern: cpu-features-times-*
          merge-multiple: true
          path: ${{ runner.temp }}/times
          run-id: ${{ steps.queue.outputs.run-id }}
          github-token: ${{ github.token }}
      - if: ${{ steps.queue.outputs.run-id }}
        run: |
          mkdir -p .cpu-features-times
          [ -f .cpu-features-times/times.json ] || echo '{}' > .cpu-features-times/times.json
          python3 ci/cpu_shards.py merge .cpu-features-times/times.json "$RUNNER_TEMP"/times/*.json > "$RUNNER_TEMP/merged.json"
          mv "$RUNNER_TEMP/merged.json" .cpu-features-times/times.json
          cat .cpu-features-times/times.json
      - if: ${{ steps.queue.outputs.run-id }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cpu-features-times
          key: cpu-features-times-${{ github.run_id }}-${{ github.run_attempt }}

  # Not on a push to main, which runs no tests (`TESTS`, which a job's `if`
  # cannot read).
  coverage:
    name: Rust coverage
    needs: [rust, rust-cpu-features]
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install -r ci/requirements-coverage.txt
      - uses: ./.github/actions/download-artifact
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: coverage-data/
      # Every path of ci/cpu_tests.py's groups selects a test on some CPU of
      # `rust-cpu-features`, from the tests each one listed: a test renamed
      # or moved out of its group fails here, not by running less.
      - uses: ./.github/actions/download-artifact
        with:
          pattern: cpu-tests-*
          merge-multiple: true
          path: cpu-tests/
      - name: Check the CPU feature runs' groups
        run: python3 ci/cpu_tests.py check cpu-tests/*.json
      - name: Combine coverage and fail if it's <100%
        id: combinecoverage
        run: |
          set +e
          echo "## Coverage" >> $GITHUB_STEP_SUMMARY
          .venv/bin/python -u ci/merge_rust_coverage.py coverage-data/ | tee COV_REPORT
          COV_EXIT_CODE=${PIPESTATUS[0]}
          if [ $COV_EXIT_CODE -ne 0 ]; then
            echo "🚨 Coverage failed. Under 100" | tee -a $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat COV_REPORT >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $COV_EXIT_CODE
      - name: Upload HTML report
        if: ${{ failure() && steps.combinecoverage.outcome == 'failure' }}
        uses: ./.github/actions/upload-artifact
        with:
          name: _html-coverage-report
          path: htmlcov
          if-no-files-found: ignore

  # The one check to require in branch protection (and so for the merge queue),
  # so the required checks don't have to track every job and matrix entry.
  # With shards, it also requires that one of them assembled the build (see
  # `lean-shard`), and assembles it itself if none did.
  all-green:
    if: ${{ always() }}
    needs: [lean, lean-shard, lean-imports, rust, rust-thumb, rust-cpu-features, coverage]
    runs-on: ubuntu-26.04
    # To list the run's artifacts.
    permissions:
      actions: read
      contents: read
    env:
      LEAN_NUM_THREADS: "6"
    steps:
      - name: Check every job succeeded
        id: check
        env:
          RESULTS: >-
            ${{ needs.lean.result }} ${{ needs.lean-imports.result }}
            ${{ needs.rust.result }} ${{ needs.rust-thumb.result }} ${{ needs.rust-cpu-features.result }}
          # Skipped on a push to main, which runs no tests (`TESTS`).
          COVERAGE: ${{ needs.coverage.result }}
          # Skipped when `lean` built the proofs itself.
          SHARDS: ${{ needs.lean-shard.result }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "$RESULTS $COVERAGE $SHARDS"
          for r in $RESULTS; do
            [ "$r" = success ] || exit 1
          done
          [ "$COVERAGE" = success ] || { [ "$TESTS" = false ] && [ "$COVERAGE" = skipped ]; } || exit 1
          case "$SHARDS" in
            skipped) ;;
            success)
              if gh api --paginate "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
                  --jq '.artifacts[].name' | grep -q '^lean-assembled-'; then
                echo "A shard assembled the build."
              else
                echo "No shard assembled the build: assembling it here."
                echo "assemble=true" >> "$GITHUB_OUTPUT"
              fi ;;
            *) exit 1 ;;
          esac
      # What `lean` does without shards, after them.
      - if: ${{ steps.check.outputs.assemble == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/lean-prepare
        id: prepare
        if: ${{ steps.check.outputs.assemble == 'true' }}
        with:
          key: ${{ needs.lean.outputs.build-cache }}
          restore-keys: |
            ${{ needs.lean.outputs.build-key }}
            ${{ needs.lean.outputs.build-cache-prefix }}
      - uses: ./.github/actions/download-artifact
        if: ${{ steps.check.outputs.assemble == 'true' }}
        with:
          pattern: lean-build-*
          merge-multiple: true
          path: ${{ runner.temp }}/lean-build
      - uses: ./.github/actions/lean-assemble
        if: ${{ steps.check.outputs.assemble == 'true' }}
        with:
          id: all-green
          cache-hit: ${{ steps.prepare.outputs.cache-hit }}
          cache-key: ${{ steps.prepare.outputs.cache-primary-key }}
          manifest-cache: ${{ needs.lean.outputs.manifest-cache }}
          manifest-cache-prefix: ${{ needs.lean.outputs.manifest-cache-prefix }}
      # Last, whatever the run's outcome, and never failing or holding it up
      # (each bounded, and a failure or timeout of either is ignored): what
      # the run did and how long it took, kept for later analysis
      # (ci/ci_metrics.py, fetched alone: this job has no checkout).
      - name: Collect the run's metrics
        id: metrics
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          timeout 10 gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GH_REPO/contents/ci/ci_metrics.py?ref=$GITHUB_SHA" > "$RUNNER_TEMP/ci_metrics.py"
          timeout 30 python3 "$RUNNER_TEMP/ci_metrics.py" collect > "$RUNNER_TEMP/ci-metrics.json"
          python3 "$RUNNER_TEMP/ci_metrics.py" summary "$RUNNER_TEMP/ci-metrics.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.metrics.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        with:
          name: ci-metrics
          path: ${{ runner.temp }}/ci-metrics.json
