          du -sh "$GITHUB_WORKSPACE/$DESTINATION"
          rm -rf "$GITHUB_WORKSPACE/$DESTINATION"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json, os, pathlib, statistics
          rows = json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'results.json').read_text())
          text = ['| Measurement | Disk median (range), seconds | Tmpfs median (range), seconds | Median reduction |', '|---|---:|---:|---:|']
          for metric in ['action_bracket_seconds', 'fetch', 'checkout']:
              groups = {}
              for medium in ['disk', 'tmpfs']:
                  xs = [(r[metric] if metric == 'action_bracket_seconds' else r['git_seconds'][metric]) for r in rows if r['medium'] == medium]
                  groups[medium] = statistics.median(xs)
                  text_value = f'{statistics.median(xs):.3f} ({min(xs):.3f}–{max(xs):.3f})'
                  groups[medium+'_text'] = text_value
              delta = (groups['disk']-groups['tmpfs'])/groups['disk']*100
              text.append(f"| {metric} | {groups['disk_text']} | {groups['tmpfs_text']} | {delta:.1f}% |")
          report = '\n'.join(text)
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('Six alternating paired trials; pinned checkout v7, default depth 1; fresh destination each time. Action bracket includes inter-step overhead. Git trace times exclude that overhead.\n\n'+report+'\n')
          PY
      - name: Preserve raw timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmpfs-checkout-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/results.json
            ${{ runner.temp }}/trace-*.jsonl
