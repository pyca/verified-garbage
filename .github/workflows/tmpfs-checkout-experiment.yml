name: Tmpfs checkout experiment
on:
  push:
    branches: [bench/tmpfs-checkout-20261107]
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Set up tmpfs and record runner
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ram"
          sudo mount -t tmpfs -o size=4G tmpfs "$GITHUB_WORKSPACE/ram"
          sudo chown "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/ram"
          uname -a
          lscpu
          free -h
          df -Th "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/ram"
          git --version
          echo '[]' > "$RUNNER_TEMP/results.json"
      - name: Start disk trial 1
        run: |
          date +%s%N > "$RUNNER_TEMP/start"
      - name: Checkout disk trial 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_TRACE2_EVENT: ${{ runner.temp }}/trace-disk-0.jsonl
        with:
          ref: 1e938f5abb64510b0ff65502723915391c66e649
          path: disk-checkout
          persist-credentials: false
      - name: Record disk trial 1
        env:
          MEDIUM: disk
          TRIAL: "1"
          DESTINATION: disk-checkout
          TRACE: ${{ runner.temp }}/trace-disk-0.jsonl
        run: |
          date +%s%N > "$RUNNER_TEMP/end"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          elapsed = (int((temp/'end').read_text())-int((temp/'start').read_text()))/1e9
          starts = {}
          phases = {}
          for line in pathlib.Path(os.environ['TRACE']).read_text().splitlines():
              e = json.loads(line)
              if e['event'] == 'start':
                  starts[e['sid']] = e['argv']
              elif e['event'] == 'exit':
                  argv = starts.get(e['sid'], [])
                  for command in ['fetch', 'checkout']:
                      if command in argv[1:]:
                          phases[command] = phases.get(command, 0) + e['t_abs']
          dest = pathlib.Path(os.environ['GITHUB_WORKSPACE'])/os.environ['DESTINATION']
          head = subprocess.check_output(['git', '-C', str(dest), 'rev-parse', 'HEAD'], text=True).strip()
          assert head == '1e938f5abb64510b0ff65502723915391c66e649', head
          row = dict(medium=os.environ['MEDIUM'], trial=int(os.environ['TRIAL']), action_bracket_seconds=elapsed, git_seconds=phases, head=head)
          rows = json.loads((temp/'results.json').read_text())
          rows.append(row)
          (temp/'results.json').write_text(json.dumps(rows, indent=2))
          print(json.dumps(row))
          PY
          du -sh "$GITHUB_WORKSPACE/$DESTINATION"
          rm -rf "$GITHUB_WORKSPACE/$DESTINATION"
      - name: Start tmpfs trial 1
        run: |
          date +%s%N > "$RUNNER_TEMP/start"
      - name: Checkout tmpfs trial 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
