          date +%s%N > "$RUNNER_TEMP/end"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          elapsed = (int((temp/'end').read_text())-int((temp/'start').read_text()))/1e9
          starts = {}
          phases = {}
          for line in pathlib.Path(os.environ['TRACE']).read_text().splitlines():
              e = json.loads(line)
              if e['event'] == 'start':
                  starts[e['sid']] = e['argv']
              elif e['event'] == 'exit':
                  argv = starts.get(e['sid'], [])
                  for command in ['fetch', 'checkout']:
