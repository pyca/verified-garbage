name: Runner images

# Builds the images CI's x86, ARMv7, PPC64LE and RISC-V jobs and its lints run
# in (ci/runner.Dockerfile), each natively on a 64-bit runner of its
# architecture, and checks them; pushes to main, and the weekly rebuild that
# picks up new packages and Rust releases, publish them to GHCR.
on:
  workflow_dispatch:
  schedule:
    # Run once a week on Fridays
    - cron: "0 0 * * FRI"
  pull_request:
    paths:
      - .github/workflows/runner-images.yml
      - .github/actions/runner-node/**
      - ci/runner.Dockerfile
  push:
    branches: [main]
    paths:
      - .github/workflows/runner-images.yml
      - .github/actions/runner-node/**
      - ci/runner.Dockerfile

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        image:
          # i686 runs without seccomp: Docker 29.4.2 on ubuntu-26.04 denies
          # socketcall(2), which i386 glibc makes its socket calls through
          # (actions/runner-images#14790); drop it once the runner has Docker
          # 29.4.3 or later.
          - {tag: "verified-garbage-runner:i686", platform: "linux/386", os: ubuntu-26.04, run-options: "--security-opt seccomp=unconfined"}
          # For ARMv7's and Thumb's tests, on any ARM64 host, and ARMv7's
          # benchmarks, on one with AArch32.
          - {tag: "verified-garbage-runner:armv7-cross", platform: "linux/arm64", os: ubuntu-26.04-arm}
          # For PPC64LE's tests, on the ppc64le runner they run on.
          - {tag: "verified-garbage-runner:ppc64le", platform: "linux/ppc64le", os: ubuntu-24.04-ppc64le}
          # For RISC-V's tests and, with what compiling C needs, its
          # benchmarks, on their riscv64 runner (RISE's, as pyca/infra's
          # riscv64 images use). The tests' image leaves that out: their jobs
          # pull it, at a few MB/s, every time.
          - {tag: "verified-garbage-runner:riscv64", platform: "linux/riscv64", os: ubuntu-24.04-riscv, build-args: "BENCH=false"}
          - {tag: "verified-garbage-runner:riscv64-bench", platform: "linux/riscv64", os: ubuntu-24.04-riscv}
          # For the lints of every target (`rust-lint`).
          - {tag: "verified-garbage-runner:lint", platform: "linux/amd64", os: ubuntu-26.04}
    name: ${{ matrix.image.tag }}
    runs-on: ${{ matrix.image.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/pyca/${{ matrix.image.tag }}
      PLATFORM: ${{ matrix.image.platform }}
      # Only main publishes; pull requests build into the local image store.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'pyca/verified-garbage' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The previous image, for its layers; it fails until the first push.
      - name: Pull existing image
        if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
        run: docker pull --platform "$PLATFORM" "$IMAGE" || true
      - name: Get image name
        id: image-name
        run: echo "name=${IMAGE%%:*}" | tee -a "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          cache-binary: false
      - name: Login to ghcr.io
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push if main) the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: docker-build
        with:
          context: ci
          file: ci/runner.Dockerfile
          cache-from: ${{ env.IMAGE }}
          tags: ${{ env.IMAGE }}
          platforms: ${{ env.PLATFORM }}
          build-args: ${{ matrix.image.build-args }}
          pull: true
          # BuildKit's strongest zstd (every layer, the base image's too): the
          # riscv64 runners pull the image for every job at a few MB/s, so a
          # slower build of the image pays for itself many times over.
          outputs: ${{ env.PUBLISH == 'true' && 'type=registry,compression=zstd,compression-level=19,force-compression=true' || 'type=docker' }}
      - id: runner-node
        uses: ./.github/actions/runner-node
      # What CI's jobs need: the runner's Node (which GitHub Actions injects
      # into the container for JS actions), a toolchain that builds and runs
      # for the host and each installed target it can run (with a runner,
      # such as ci/arm32-run) and checks for the others (the lint image's),
      # each cross C compiler with its target's OpenSSL, and one that rustup
      # can update in place (exercising the uninstall path even if stable has
      # not changed since the image was built; this container is disposable).
      - name: Check the image
        env:
          PULL: ${{ env.PUBLISH == 'true' && 'always' || 'never' }}
          RUN_OPTIONS: ${{ matrix.image.run-options }}
          RUNNER_NODE: ${{ steps.runner-node.outputs.path }}
        run: |
          docker run --rm --platform "$PLATFORM" --pull="$PULL" $RUN_OPTIONS \
            -v "$(readlink -f "$RUNNER_NODE")":/runner-node:ro \
            "$IMAGE" \
            sh -euxc '
              /runner-node -e "console.log(process.version, process.arch)"
              git --version
              python3 -V
              openssl version
              # OpenSSL for the benchmarks where they are built (not in
              # riscv64's tests' image).
              if command -v pkg-config; then
                pkg-config --exists openssl
              fi
              zstd --version
              rustc -vV
              # Clippy and rustfmt only where the image has them (the lint
              # image).
              if rustup component list --installed | grep -q "^clippy"; then
                cargo clippy -V
                cargo fmt --version
              fi
              command -v "$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n "s/^host: //p")/bin/llvm-cov"
              # Each C compiler with its OpenSSL (riscv64's tests' image has
              # no C compiler proper, cc1: it only links, which cargo run
              # checks).
              for gcc in /usr/bin/*-linux-gnu*-gcc; do
                if [ -e "$gcc" ] && [ -x "$("$gcc" -print-prog-name=cc1)" ]; then
                  echo "#include <openssl/ssl.h>" | "$gcc" -xc -c -o /tmp/check-openssl.o -
                fi
              done
              cd /tmp && cargo new -q hello && cd hello
              host=$(rustc -vV | sed -n "s/^host: //p")
              for target in $(rustup target list --installed); do
                runner=CARGO_TARGET_$(echo "$target" | tr a-z- A-Z_)_RUNNER
                if [ "$target" = "$host" ] || printenv "$runner" >/dev/null; then
                  cargo run -q --target "$target"
                else
                  cargo clippy -q --target "$target"
                fi
              done
              # The 32-bit Arm targets under QEMU too, which ci/arm32-run
              # chooses only on a host without AArch32.
              if command -v arm32-run; then
                for target in armv7-unknown-linux-gnueabihf thumbv7neon-unknown-linux-gnueabihf; do
                  qemu-arm "target/$target/debug/hello"
                done
              fi
              rustup component list --installed | xargs rustup component remove
            '
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ env.PUBLISH == 'true' }}
        with:
          subject-name: ${{ steps.image-name.outputs.name }}
          subject-digest: ${{ steps.docker-build.outputs.digest }}
          push-to-registry: true
