[package]
name = "verified-garbage"
version = "0.0.0"
edition = "2024"
# Naked functions (`#[unsafe(naked)]`, `naked_asm!`) were stabilized in 1.88.
rust-version = "1.88"
description = "An experimental, formally verified cryptography library, implemented entirely by LLMs"
license = "Apache-2.0 OR BSD-3-Clause"
repository = "https://github.com/alex/verified-garbage"
publish = false
# All assembly is inline, in naked functions generated from Lean: no build script.
build = false
include = ["/src", "/LICENSE*", "/README.md"]
# Every integration test is a module of the one test binary, `tests/main.rs`.
autotests = false

[features]
default = ["alloc"]
# APIs that allocate (scrypt's memory-hard table), through the `alloc` crate.
alloc = []
# Links `std`, so that the CPU features are detected at run time on every
# target: on AArch64, by asking the operating system (see `src/cpu.rs`);
# without it, AArch64 uses only the features the code was compiled for.
std = []
# Lets the `VG_CPU_FEATURES` environment variable restrict the CPU features
# the library uses (see `src/cpu.rs`), to test and benchmark every
# implementation on one machine. Reading the environment needs `std`.
cpu-features-env = ["std"]

[dependencies]
# The randomness of ML-KEM encapsulation, from the operating system.
getrandom = "0.4"
# The naked functions, generated from Lean (`asm/`, `lean/VerifiedGarbage/TCB/Rust.lean`).
verified-garbage-asm = { path = "asm" }

[[test]]
name = "tests"
path = "tests/main.rs"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The Wycheproof tests parse ~100 MB of JSON; optimize dependencies (but not
# this crate) in test builds.
[profile.dev.package."*"]
opt-level = 3

# The naked functions' code is the same at every optimization level, but an
# optimized build runs LLVM's ThinLTO, which parses all of the assembly again
# several times over (once its symbol table, once its summary, ...), serially
# as rustc puts the naked functions in one codegen unit: this takes seconds.
[profile.dev.package.verified-garbage-asm]
opt-level = 0

[profile.release.package.verified-garbage-asm]
opt-level = 0
