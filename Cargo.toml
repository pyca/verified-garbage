[package]
name = "verified-garbage"
version = "0.0.0"
edition = "2024"
# Naked functions (`#[unsafe(naked)]`, `naked_asm!`) were stabilized in 1.88.
rust-version = "1.88"
description = "An experimental, formally verified cryptography library, implemented entirely by LLMs"
license = "Apache-2.0 OR BSD-3-Clause"
repository = "https://github.com/pyca/verified-garbage"
publish = false
# All assembly is inline, in naked functions generated from Lean: no build script.
build = false
include = ["/src", "/LICENSE*", "/README.md"]
# Every integration test is a module of the one test binary, `tests/main.rs`.
autotests = false

[features]
default = ["alloc"]
# Everything that allocates, through the `alloc` crate: Argon2, scrypt, RSA,
# DSA, FFDH, and AES-GCM's tables of powers on x86-64 and AArch64.
alloc = []
# Links `std`, so that the CPU features are detected at run time on every
# target: on AArch64, by asking the operating system (see `src/cpu.rs`);
# without it, AArch64 uses only the features the code was compiled for.
std = []
# Lets the `VG_CPU_FEATURES` environment variable restrict the CPU features
# the library uses (see `src/cpu.rs`), to test and benchmark every
# implementation on one machine. Reading the environment needs `std`.
cpu-features-env = ["std"]

[dependencies]
# Randomness from the operating system, for generating keys and for
# randomized signing, encryption and encapsulation.
getrandom = "0.4"
# `Features`, the sets of CPU features that the generated `_FEATURES`
# constants and the detection in `src/cpu.rs` name.
verified-garbage-cpu = { path = "cpu" }

[workspace]
members = ["cpu"]

[[test]]
name = "tests"
path = "tests/main.rs"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The Wycheproof tests parse ~100 MB of JSON; optimize dependencies (but not
# this crate) in test builds.
[profile.dev.package."*"]
opt-level = 3

# Test builds keep only line tables (the file and line of each frame of a
# backtrace), not full debug information: a tenth of a test build's time.
[profile.test]
debug = "line-tables-only"
