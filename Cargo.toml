[package]
name = "verified-garbage"
description = "An experimental, formally verified cryptography library, implemented entirely by LLMs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# All assembly is inline, in naked functions generated from Lean: no build script.
build = false
include = ["/src", "/LICENSE*", "/README.md"]
# Every integration test is a module of the one test binary, `tests/main.rs`.
autotests = false

[features]
default = ["alloc"]
# Everything that allocates, through the `alloc` crate: Argon2, scrypt, RSA,
# DSA, FFDH, and AES-GCM's tables of powers on x86-64 and AArch64.
alloc = []
# Links `std`, so that the CPU features are detected at run time on every
# target: on AArch64, by asking the operating system (see `src/cpu.rs`);
# without it, AArch64 uses only the features the code was compiled for.
std = []
# Lets the `VG_CPU_FEATURES` environment variable restrict the CPU features
# the library uses (see `src/cpu.rs`), to test and benchmark every
# implementation on one machine. Reading the environment needs `std`.
cpu-features-env = ["std"]

[dependencies]
# Randomness from the operating system, for generating keys and for
# randomized signing, encryption and encapsulation.
getrandom = "0.4"
# `Features`, the sets of CPU features that the generated `_FEATURES`
# constants and the detection in `src/cpu.rs` name.
verified-garbage-cpu = { path = "crates/verified-garbage-cpu" }

# The verified assembly of each target, generated into
# `crates/verified-garbage-asm-<target>/src/`: a crate per target (see
# `lean/VerifiedGarbage/TCB/Rust.lean`).
[target.'cfg(target_arch = "aarch64")'.dependencies]
verified-garbage-asm-aarch64 = { path = "crates/verified-garbage-asm-aarch64" }
[target.'cfg(target_arch = "arm")'.dependencies]
verified-garbage-asm-arm = { path = "crates/verified-garbage-asm-arm" }
[target.'cfg(target_arch = "powerpc64")'.dependencies]
verified-garbage-asm-powerpc64le = { path = "crates/verified-garbage-asm-powerpc64le" }
[target.'cfg(target_arch = "riscv64")'.dependencies]
verified-garbage-asm-riscv64 = { path = "crates/verified-garbage-asm-riscv64" }
[target.'cfg(target_arch = "x86")'.dependencies]
verified-garbage-asm-x86 = { path = "crates/verified-garbage-asm-x86" }
[target.'cfg(target_arch = "x86_64")'.dependencies]
verified-garbage-asm-x86_64 = { path = "crates/verified-garbage-asm-x86_64" }

[workspace]
members = ["crates/*"]

# What every crate of the workspace shares, which each inherits
# (`<key>.workspace = true`).
[workspace.package]
version = "0.0.0"
edition = "2024"
# The generated code's `.base64` directive, which the assembler of LLVM 22
# reads (`lean/VerifiedGarbage/TCB/Rust.lean`, `packRun`), is first in 1.95
# (naked functions, `#[unsafe(naked)]` and `naked_asm!`, were stabilized in
# 1.88).
rust-version = "1.95"
license = "Apache-2.0 OR BSD-3-Clause"
repository = "https://github.com/pyca/verified-garbage"
publish = false

[[test]]
name = "tests"
path = "tests/main.rs"

[[test]]
name = "cavp"
path = "tests/cavp.rs"

[dev-dependencies]
# Parsing the JSON test vector files (`tests/json.rs` reads them into Rust
# types, without serde's derive).
serde_json = "1"
# Hex and the `key = value` records of the text vector files
# (`crates/verified-garbage-test-vectors`), optimized below.
verified-garbage-test-vectors = { path = "crates/verified-garbage-test-vectors" }

# The Wycheproof tests parse ~100 MB of JSON; optimize the parser (and the
# `memchr` it scans strings with) in test builds. Only these and the text
# files' parsing below: the other
# dependencies' speed does not matter to the tests, and optimizing them, and
# their build scripts, kept the cores busy while the generated crate and
# the library, which the tests wait for, were compiling.
[profile.dev.package.serde_json]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
# The text vector files' parsing, for the same reason: unoptimized, decoding
# the hex of CAVP's AES-GCM files was nine tenths of that test's time.
[profile.dev.package.verified-garbage-test-vectors]
opt-level = 3

# Test builds keep only line tables (the file and line of each frame of a
# backtrace), not full debug information: a tenth of a test build's time.
[profile.test]
debug = "line-tables-only"

# The generated crates are naked functions and constants, whose machine code
# no optimization changes. Optimized (with more than one codegen unit), rustc
# runs ThinLTO over them, in which LLVM parses all of their assembly twice
# more: a release build of the library took 2.6 times as long. And their
# codegen units are stated: rustc merges a crate's units smaller than its
# minimum unless their number is, and it counts a naked function as tiny, so
# each crate was one unit, assembled on one thread (a debug build of the
# library took 1.4 times as long).
[profile.dev.package.verified-garbage-asm-aarch64]
opt-level = 0
codegen-units = 16
[profile.dev.package.verified-garbage-asm-arm]
opt-level = 0
codegen-units = 16
[profile.dev.package.verified-garbage-asm-powerpc64le]
opt-level = 0
codegen-units = 16
[profile.dev.package.verified-garbage-asm-riscv64]
opt-level = 0
codegen-units = 16
[profile.dev.package.verified-garbage-asm-x86]
opt-level = 0
codegen-units = 16
[profile.dev.package.verified-garbage-asm-x86_64]
opt-level = 0
codegen-units = 16
[profile.release.package.verified-garbage-asm-aarch64]
opt-level = 0
codegen-units = 16
[profile.release.package.verified-garbage-asm-arm]
opt-level = 0
codegen-units = 16
[profile.release.package.verified-garbage-asm-powerpc64le]
opt-level = 0
codegen-units = 16
[profile.release.package.verified-garbage-asm-riscv64]
opt-level = 0
codegen-units = 16
[profile.release.package.verified-garbage-asm-x86]
opt-level = 0
codegen-units = 16
[profile.release.package.verified-garbage-asm-x86_64]
opt-level = 0
codegen-units = 16
